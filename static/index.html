<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>SMM Sourcing CRM</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root { --primary: #0F4C45; --primary-light: #1a6b62; --primary-bg: #e8f5f3; }
  body { font-family: 'Segoe UI', sans-serif; background: #f5f7fa; }
  .sidebar { background: var(--primary); min-height: 100vh; width: 220px; flex-shrink:0; }
  .sidebar a { color: #c8e6e3; transition: all .2s; display:flex; align-items:center; gap:8px; padding:10px 16px; border-radius:8px; cursor:pointer; text-decoration:none; }
  .sidebar a:hover, .sidebar a.active { background: var(--primary-light); color: #fff; }
  .badge { background:#ef4444; color:#fff; border-radius:9999px; padding:1px 7px; font-size:11px; }
  .btn { padding:7px 16px; border-radius:8px; font-size:14px; cursor:pointer; border:none; transition:all .15s; }
  .btn-primary { background: var(--primary); color:#fff; }
  .btn-primary:hover { background: var(--primary-light); }
  .btn-secondary { background:#f3f4f6; color:#374151; }
  .btn-secondary:hover { background:#e5e7eb; }
  .btn-danger { background:#fee2e2; color:#dc2626; }
  .btn-danger:hover { background:#fecaca; }
  .card { background:#fff; border-radius:12px; box-shadow:0 1px 4px rgba(0,0,0,.08); }
  .status-open { color:#2563eb; background:#eff6ff; border-radius:20px; padding:2px 10px; font-size:12px; }
  .status-in_progress { color:#d97706; background:#fffbeb; border-radius:20px; padding:2px 10px; font-size:12px; }
  .status-pending_ack { color:#7c3aed; background:#ede9fe; border-radius:20px; padding:2px 10px; font-size:12px; }
  .status-pending_fault { color:#db2777; background:#fce7f3; border-radius:20px; padding:2px 10px; font-size:12px; }
  .status-closed { color:#6b7280; background:#f9fafb; border-radius:20px; padding:2px 10px; font-size:12px; }
  .priority-Urgent { color:#dc2626; font-weight:700; }
  .priority-High { color:#ea580c; font-weight:600; }
  .priority-Medium { color:#d97706; }
  .priority-Low { color:#16a34a; }
  input, select, textarea { border:1px solid #d1d5db; border-radius:6px; padding:7px 10px; width:100%; outline:none; font-size:14px; }
  input:focus, select:focus, textarea:focus { border-color:var(--primary); box-shadow:0 0 0 2px rgba(15,76,69,.15); }
  .tab { padding:8px 18px; cursor:pointer; border-bottom:2px solid transparent; color:#6b7280; font-size:14px; white-space:nowrap; }
  .tab.active { color:var(--primary); border-color:var(--primary); font-weight:600; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .spin { animation: spin 1s linear infinite; display:inline-block; }
  .timeline-line { position:absolute; left:13px; top:28px; bottom:0; width:2px; background:#e5e7eb; }
  .tl-dot { width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:13px; flex-shrink:0; z-index:1; }
  .fault-btn { border:2px solid #e5e7eb; border-radius:10px; padding:10px 14px; cursor:pointer; text-align:center; transition:all .15s; font-size:13px; }
  .fault-btn:hover { border-color:var(--primary); background:var(--primary-bg); }
  .fault-btn.selected { border-color:var(--primary); background:var(--primary-bg); color:var(--primary); font-weight:600; }
  .checkbox-team { display:flex; align-items:center; gap:8px; padding:8px 12px; border:2px solid #e5e7eb; border-radius:8px; cursor:pointer; transition:all .15s; font-size:13px; }
  .checkbox-team:hover { border-color:#9ca3af; }
  .checkbox-team.checked { border-color:var(--primary); background:var(--primary-bg); color:var(--primary); }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;
const API = '';

// ── auth helpers ─────────────────────────────────────────────────────────────
const getToken = () => localStorage.getItem('crm_token');
const setToken = t => localStorage.setItem('crm_token', t);
const clearToken = () => localStorage.removeItem('crm_token');

async function api(path, opts = {}) {
  const token = getToken();
  const headers = { 'Content-Type': 'application/json', ...(opts.headers || {}) };
  if (token) headers['Authorization'] = 'Bearer ' + token;
  const res = await fetch(API + path, { ...opts, headers });
  if (res.status === 401) { clearToken(); window.location.reload(); return; }
  return res.json();
}

async function apiUpload(path, formData) {
  const token = getToken();
  const headers = {};
  if (token) headers['Authorization'] = 'Bearer ' + token;
  const res = await fetch(API + path, { method: 'POST', body: formData, headers });
  return res.json();
}

// ── constants ─────────────────────────────────────────────────────────────────
const TEAMS = ['CX', 'Sales', 'KAM', 'Merchandise', 'Inbound/QC', 'Outbound/Logistics', 'Management'];
const FAULT_TEAMS = [...TEAMS, 'Customer'];
const CASE_TYPES = ['Complain', 'Claim', 'Update Invoice'];
const CLAIM_SUBTYPES = ['ด่วน (ภายในวัน)', 'รอรอบถัดไป (ไม่รู้วัน)', 'รอรอบถัดไป (รู้วันแล้ว)'];
const ROOT_CAUSES = ['สินค้าตกหล่น', 'คุณภาพไม่ผ่าน/ไม่ได้ spec', 'น้ำหนักไม่ครบ', 'ส่งผิด SKU', 'เอกสารผิดพลาด', 'อื่นๆ'];
const PRIORITIES = ['Urgent', 'High', 'Medium', 'Low'];

const TEAM_ICONS = {
  'CX': '🎧', 'Sales': '💼', 'KAM': '🤝', 'Merchandise': '📦',
  'Inbound/QC': '🔍', 'Outbound/Logistics': '🚚', 'Management': '👔', 'Customer': '🧑'
};

const STATUS_LABELS = {
  open: 'เปิด', in_progress: 'กำลังดำเนินการ',
  pending_ack: 'รอรับทราบ', pending_fault: 'รอระบุผู้รับผิดชอบ', closed: 'ปิดแล้ว'
};

function fmtDuration(sec) {
  if (!sec && sec !== 0) return '';
  if (sec < 60) return `${sec}วิ`;
  if (sec < 3600) return `${Math.floor(sec/60)}น.`;
  if (sec < 86400) return `${Math.floor(sec/3600)}ชม.${Math.floor((sec%3600)/60)}น.`;
  return `${Math.floor(sec/86400)}วัน ${Math.floor((sec%86400)/3600)}ชม.`;
}

function fmtDt(s) {
  if (!s) return '';
  const d = new Date(s);
  return d.toLocaleDateString('th-TH', { day:'2-digit', month:'short' }) + ' ' +
    d.toLocaleTimeString('th-TH', { hour:'2-digit', minute:'2-digit' });
}

// ── Spinner ───────────────────────────────────────────────────────────────────
function Spinner() { return <span className="spin">⏳</span>; }

// ── Login ─────────────────────────────────────────────────────────────────────
function Login({ onLogin }) {
  const [username, setUsername] = useState('');
  const [password, setPassword] = useState('');
  const [err, setErr] = useState('');
  const [loading, setLoading] = useState(false);

  const submit = async e => {
    e.preventDefault();
    setLoading(true); setErr('');
    const res = await fetch(API + '/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();
    setLoading(false);
    if (data.token) { setToken(data.token); onLogin(data.user); }
    else setErr(data.error || 'เข้าสู่ระบบไม่ได้');
  };

  return (
    <div className="min-h-screen flex items-center justify-center bg-gradient-to-br from-teal-900 to-teal-700">
      <div className="card p-8 w-full max-w-sm">
        <div className="text-center mb-6">
          <div className="text-4xl mb-2">📋</div>
          <h1 className="text-2xl font-bold" style={{color:'var(--primary)'}}>SMM CRM</h1>
          <p className="text-gray-500 text-sm mt-1">Ticket Management System</p>
        </div>
        <form onSubmit={submit} className="space-y-4">
          <div>
            <label className="text-sm font-medium text-gray-700 block mb-1">ชื่อผู้ใช้</label>
            <input value={username} onChange={e=>setUsername(e.target.value)} required autoFocus/>
          </div>
          <div>
            <label className="text-sm font-medium text-gray-700 block mb-1">รหัสผ่าน</label>
            <input type="password" value={password} onChange={e=>setPassword(e.target.value)} required/>
          </div>
          {err && <div className="text-red-600 text-sm bg-red-50 p-2 rounded">{err}</div>}
          <button type="submit" className="btn btn-primary w-full" disabled={loading}>
            {loading ? <Spinner/> : 'เข้าสู่ระบบ'}
          </button>
        </form>
      </div>
    </div>
  );
}

// ── ImageUploader ─────────────────────────────────────────────────────────────
function ImageUploader({ onUploaded }) {
  const [uploading, setUploading] = useState(false);
  const ref = useRef();

  const handle = async e => {
    const file = e.target.files[0];
    if (!file) return;
    setUploading(true);
    const fd = new FormData();
    fd.append('file', file);
    const res = await apiUpload('/api/upload/image', fd);
    setUploading(false);
    if (res.url) onUploaded(res.url);
    ref.current.value = '';
  };

  return (
    <label className="flex items-center gap-2 cursor-pointer text-sm text-gray-500 hover:text-gray-700">
      {uploading ? <Spinner/> : '📎'}
      <span>{uploading ? 'กำลังอัปโหลด...' : 'แนบรูป'}</span>
      <input ref={ref} type="file" accept="image/*" className="hidden" onChange={handle} style={{display:'none'}}/>
    </label>
  );
}

// ── Dashboard ─────────────────────────────────────────────────────────────────
function Dashboard() {
  const [tab, setTab] = useState('overview');
  const [overview, setOverview] = useState(null);
  const [bottleneck, setBottleneck] = useState([]);
  const [faultTeam, setFaultTeam] = useState([]);
  const [faultEmp, setFaultEmp] = useState([]);
  const [skuProblems, setSkuProblems] = useState([]);
  const [byCust, setByCust] = useState([]);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    Promise.all([
      api('/api/dashboard/overview'),
      api('/api/dashboard/bottleneck'),
      api('/api/dashboard/fault-by-team'),
      api('/api/dashboard/fault-by-employee'),
      api('/api/dashboard/sku-problems'),
      api('/api/dashboard/by-customer')
    ]).then(([ov, bn, ft, fe, sk, bc]) => {
      setOverview(ov);
      setBottleneck(bn || []);
      setFaultTeam(ft || []);
      setFaultEmp(fe || []);
      setSkuProblems(sk || []);
      setByCust(bc || []);
      setLoading(false);
    });
  }, []);

  if (loading) return <div className="p-8 text-center text-gray-400"><Spinner/> กำลังโหลด...</div>;

  const tabs = [
    {id:'overview', label:'ภาพรวม'},
    {id:'bottleneck', label:'Bottleneck'},
    {id:'fault-team', label:'ความผิดพลาดรายทีม'},
    {id:'fault-emp', label:'ความผิดพลาดรายคน'},
    {id:'sku', label:'SKU ปัญหา'},
    {id:'customer', label:'รายลูกค้า'},
  ];

  return (
    <div className="p-6">
      <h2 className="text-xl font-bold mb-4" style={{color:'var(--primary)'}}>📊 Dashboard</h2>

      {/* overview cards */}
      {overview && (
        <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
          {[
            {label:'เปิดอยู่', val:overview.open, color:'#2563eb'},
            {label:'กำลังดำเนินการ', val:overview.in_progress, color:'#d97706'},
            {label:'รอรับทราบ/ระบุ', val:(overview.pending_ack||0)+(overview.pending_fault||0), color:'#7c3aed'},
            {label:'ปิดแล้ว', val:overview.closed, color:'#16a34a'},
          ].map(c => (
            <div key={c.label} className="card p-4 text-center">
              <div className="text-3xl font-bold" style={{color:c.color}}>{c.val ?? 0}</div>
              <div className="text-sm text-gray-500 mt-1">{c.label}</div>
            </div>
          ))}
        </div>
      )}

      {/* contribution ratio */}
      {overview && overview.by_opener_team && (
        <div className="card p-4 mb-6">
          <h3 className="font-semibold text-gray-700 mb-3">สัดส่วนการสร้างเคส (Contribution)</h3>
          <div className="space-y-2">
            {overview.by_opener_team.map(r => {
              const pct = overview.total ? Math.round(r.count/overview.total*100) : 0;
              return (
                <div key={r.opener_team} className="flex items-center gap-3">
                  <div className="w-28 text-sm text-gray-600 shrink-0">{TEAM_ICONS[r.opener_team]||'👥'} {r.opener_team}</div>
                  <div className="flex-1 h-4 bg-gray-100 rounded-full overflow-hidden">
                    <div className="h-full rounded-full" style={{width:pct+'%', background:'var(--primary)'}}/>
                  </div>
                  <div className="text-sm text-gray-600 w-16 text-right">{r.count} ({pct}%)</div>
                </div>
              );
            })}
          </div>
        </div>
      )}

      {/* tabs */}
      <div className="flex border-b mb-4 overflow-x-auto">
        {tabs.slice(1).map(t => (
          <div key={t.id} className={`tab ${tab===t.id?'active':''}`} onClick={()=>setTab(t.id)}>{t.label}</div>
        ))}
      </div>

      {tab === 'bottleneck' && (
        <div className="card p-4">
          <h3 className="font-semibold text-gray-700 mb-3">ทีมที่ใช้เวลาเฉลี่ยนานที่สุด</h3>
          {bottleneck.length === 0 ? <p className="text-gray-400 text-sm">ยังไม่มีข้อมูล</p> : (
            <table className="w-full text-sm">
              <thead><tr className="text-left text-gray-500 border-b">
                <th className="pb-2">ทีม</th><th className="pb-2">จำนวนเคส</th><th className="pb-2">เวลาเฉลี่ย</th>
              </tr></thead>
              <tbody>
                {bottleneck.map((r,i) => (
                  <tr key={i} className="border-b last:border-0">
                    <td className="py-2">{TEAM_ICONS[r.team]||'👥'} {r.team}</td>
                    <td className="py-2">{r.count}</td>
                    <td className="py-2 font-medium" style={{color:'var(--primary)'}}>{fmtDuration(r.avg_seconds)}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          )}
        </div>
      )}

      {tab === 'fault-team' && (
        <div className="card p-4">
          <h3 className="font-semibold text-gray-700 mb-3">ความผิดพลาดแยกตามทีม</h3>
          {faultTeam.length === 0 ? <p className="text-gray-400 text-sm">ยังไม่มีข้อมูล</p> : (
            <table className="w-full text-sm">
              <thead><tr className="text-left text-gray-500 border-b">
                <th className="pb-2">ทีม</th><th className="pb-2">จำนวนเคส</th>
              </tr></thead>
              <tbody>
                {faultTeam.map((r,i) => (
                  <tr key={i} className="border-b last:border-0">
                    <td className="py-2">{TEAM_ICONS[r.fault_team]||'👥'} {r.fault_team}</td>
                    <td className="py-2 font-semibold text-red-600">{r.count}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          )}
        </div>
      )}

      {tab === 'fault-emp' && (
        <div className="card p-4">
          <h3 className="font-semibold text-gray-700 mb-3">ความผิดพลาดแยกตามพนักงาน</h3>
          {faultEmp.length === 0 ? <p className="text-gray-400 text-sm">ยังไม่มีข้อมูล</p> : (
            <table className="w-full text-sm">
              <thead><tr className="text-left text-gray-500 border-b">
                <th className="pb-2">พนักงาน</th><th className="pb-2">ทีม</th><th className="pb-2">จำนวนเคส</th>
              </tr></thead>
              <tbody>
                {faultEmp.map((r,i) => (
                  <tr key={i} className="border-b last:border-0">
                    <td className="py-2">{r.employee_name}</td>
                    <td className="py-2 text-gray-500">{r.fault_team}</td>
                    <td className="py-2 font-semibold text-red-600">{r.count}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          )}
        </div>
      )}

      {tab === 'sku' && (
        <div className="card p-4">
          <h3 className="font-semibold text-gray-700 mb-3">SKU ที่มีปัญหาบ่อย</h3>
          {skuProblems.length === 0 ? <p className="text-gray-400 text-sm">ยังไม่มีข้อมูล</p> : (
            <table className="w-full text-sm">
              <thead><tr className="text-left text-gray-500 border-b">
                <th className="pb-2">SKU</th><th className="pb-2">สาเหตุหลัก</th><th className="pb-2">จำนวน</th>
              </tr></thead>
              <tbody>
                {skuProblems.map((r,i) => (
                  <tr key={i} className="border-b last:border-0">
                    <td className="py-2 font-mono text-xs">{r.sku_code}</td>
                    <td className="py-2">{r.root_cause}</td>
                    <td className="py-2 font-semibold">{r.count}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          )}
        </div>
      )}

      {tab === 'customer' && (
        <div className="card p-4">
          <h3 className="font-semibold text-gray-700 mb-3">เคสแยกตามลูกค้า</h3>
          {byCust.length === 0 ? <p className="text-gray-400 text-sm">ยังไม่มีข้อมูล</p> : (
            <table className="w-full text-sm">
              <thead><tr className="text-left text-gray-500 border-b">
                <th className="pb-2">ลูกค้า</th><th className="pb-2">จำนวน</th>
              </tr></thead>
              <tbody>
                {byCust.map((r,i) => (
                  <tr key={i} className="border-b last:border-0">
                    <td className="py-2">{r.account_name}</td>
                    <td className="py-2 font-semibold">{r.count}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          )}
        </div>
      )}
    </div>
  );
}

// ── CreateTicket ──────────────────────────────────────────────────────────────
function CreateTicket({ user, onCreated }) {
  const [accounts, setAccounts] = useState([]);
  const [employees, setEmployees] = useState([]);
  const [form, setForm] = useState({
    case_type: 'Complain', case_subtype: '', root_cause: '', priority: 'Medium',
    account_id: '', employee_id: '', description: '', initial_teams: []
  });
  const [saving, setSaving] = useState(false);
  const [msg, setMsg] = useState('');

  useEffect(() => {
    api('/api/accounts').then(d => setAccounts(d || []));
    api('/api/employees').then(d => setEmployees(d || []));
  }, []);

  const set = (k, v) => setForm(f => ({ ...f, [k]: v }));

  const toggleTeam = team => {
    setForm(f => {
      const has = f.initial_teams.includes(team);
      return { ...f, initial_teams: has ? f.initial_teams.filter(t => t !== team) : [...f.initial_teams, team] };
    });
  };

  const submit = async e => {
    e.preventDefault();
    if (!form.case_type) return setMsg('กรุณาเลือกประเภทเคส');
    if (form.case_type === 'Complain' && form.initial_teams.length === 0) return setMsg('กรุณาเลือกทีมที่เกี่ยวข้องอย่างน้อย 1 ทีม');
    if (form.case_type !== 'Complain' && form.initial_teams.length === 0) return setMsg('กรุณาเลือกทีมที่จะส่งให้');
    setSaving(true); setMsg('');
    const res = await api('/api/tickets', { method: 'POST', body: JSON.stringify(form) });
    setSaving(false);
    if (res && res.id) { onCreated(res.id); }
    else setMsg(res?.error || 'เกิดข้อผิดพลาด');
  };

  const isComplain = form.case_type === 'Complain';

  return (
    <div className="p-6 max-w-2xl">
      <h2 className="text-xl font-bold mb-5" style={{color:'var(--primary)'}}>🎫 เปิดเคสใหม่</h2>
      <form onSubmit={submit} className="space-y-5">
        <div className="card p-5 space-y-4">
          <h3 className="font-semibold text-gray-700">รายละเอียดเคส</h3>

          {/* Case type */}
          <div>
            <label className="text-sm font-medium text-gray-700 block mb-2">ประเภทเคส *</label>
            <div className="flex gap-3">
              {CASE_TYPES.map(t => (
                <label key={t} className={`flex items-center gap-2 px-4 py-2 rounded-lg border-2 cursor-pointer transition-all text-sm ${form.case_type===t?'border-teal-600 bg-teal-50 text-teal-700 font-semibold':'border-gray-200'}`}>
                  <input type="radio" name="case_type" value={t} checked={form.case_type===t}
                    onChange={e=>{ set('case_type',t); set('initial_teams',[]); }} className="hidden"/>
                  {t==='Complain'?'😤':t==='Claim'?'🔄':'📄'} {t}
                </label>
              ))}
            </div>
          </div>

          {/* Claim subtype */}
          {form.case_type === 'Claim' && (
            <div>
              <label className="text-sm font-medium text-gray-700 block mb-1">ประเภทการ Claim *</label>
              <select value={form.case_subtype} onChange={e=>set('case_subtype',e.target.value)} required>
                <option value="">-- เลือกประเภท --</option>
                {CLAIM_SUBTYPES.map(s => <option key={s} value={s}>{s}</option>)}
              </select>
            </div>
          )}

          {/* Root cause */}
          <div>
            <label className="text-sm font-medium text-gray-700 block mb-1">สาเหตุ</label>
            <select value={form.root_cause} onChange={e=>set('root_cause',e.target.value)}>
              <option value="">-- ไม่ระบุ --</option>
              {ROOT_CAUSES.map(r => <option key={r} value={r}>{r}</option>)}
            </select>
          </div>

          {/* Priority */}
          <div>
            <label className="text-sm font-medium text-gray-700 block mb-1">ความเร่งด่วน</label>
            <select value={form.priority} onChange={e=>set('priority',e.target.value)}>
              {PRIORITIES.map(p => <option key={p} value={p}>{p}</option>)}
            </select>
          </div>

          {/* Account */}
          <div>
            <label className="text-sm font-medium text-gray-700 block mb-1">ลูกค้า</label>
            <select value={form.account_id} onChange={e=>set('account_id',e.target.value)}>
              <option value="">-- เลือกลูกค้า --</option>
              {accounts.map(a => <option key={a.id} value={a.id}>{a.account_name}</option>)}
            </select>
          </div>

          {/* Employee */}
          <div>
            <label className="text-sm font-medium text-gray-700 block mb-1">พนักงานที่เกี่ยวข้อง</label>
            <select value={form.employee_id} onChange={e=>set('employee_id',e.target.value)}>
              <option value="">-- ไม่ระบุ --</option>
              {employees.map(e => <option key={e.id} value={e.id}>{e.name} ({e.team})</option>)}
            </select>
          </div>

          {/* Description */}
          <div>
            <label className="text-sm font-medium text-gray-700 block mb-1">รายละเอียด *</label>
            <textarea rows={3} value={form.description} onChange={e=>set('description',e.target.value)} required placeholder="อธิบายปัญหาหรือรายละเอียดเคส..."/>
          </div>
        </div>

        {/* Team selection */}
        <div className="card p-5">
          <h3 className="font-semibold text-gray-700 mb-3">
            {isComplain ? '🔀 เลือกทีมที่เกี่ยวข้อง (Complain — แจ้งได้หลายทีม) *' : '➡️ ส่งต่อไปยังทีม *'}
          </h3>
          {isComplain ? (
            <div className="grid grid-cols-2 gap-2">
              {TEAMS.map(t => (
                <div key={t} className={`checkbox-team ${form.initial_teams.includes(t)?'checked':''}`}
                  onClick={()=>toggleTeam(t)}>
                  <div className={`w-4 h-4 rounded border-2 flex items-center justify-center text-xs
                    ${form.initial_teams.includes(t)?'bg-teal-600 border-teal-600 text-white':'border-gray-300'}`}>
                    {form.initial_teams.includes(t)?'✓':''}
                  </div>
                  {TEAM_ICONS[t]} {t}
                </div>
              ))}
            </div>
          ) : (
            <div className="grid grid-cols-2 gap-2">
              {TEAMS.map(t => (
                <div key={t} className={`checkbox-team ${form.initial_teams[0]===t?'checked':''}`}
                  onClick={()=>set('initial_teams',[t])}>
                  <div className={`w-4 h-4 rounded-full border-2 flex items-center justify-center
                    ${form.initial_teams[0]===t?'bg-teal-600 border-teal-600':''}`}/>
                  {TEAM_ICONS[t]} {t}
                </div>
              ))}
            </div>
          )}
          {form.case_type === 'Update Invoice' && (
            <p className="text-xs text-gray-400 mt-2">* Update Invoice มักส่งให้ Sales Co หรือ KAM</p>
          )}
        </div>

        {msg && <div className="text-red-600 text-sm bg-red-50 p-3 rounded">{msg}</div>}
        <button type="submit" className="btn btn-primary w-full" disabled={saving}>
          {saving ? <Spinner/> : '✅ เปิดเคส'}
        </button>
      </form>
    </div>
  );
}

// ── TicketList ────────────────────────────────────────────────────────────────
function TicketList({ user, onSelect }) {
  const [tickets, setTickets] = useState([]);
  const [loading, setLoading] = useState(true);
  const [myTeamOnly, setMyTeamOnly] = useState(false);
  const [statusFilter, setStatusFilter] = useState('');
  const [typeFilter, setTypeFilter] = useState('');

  const load = useCallback(() => {
    setLoading(true);
    const params = new URLSearchParams();
    if (myTeamOnly && user.team) params.set('team', user.team);
    if (statusFilter) params.set('status', statusFilter);
    if (typeFilter) params.set('case_type', typeFilter);
    api('/api/tickets?' + params).then(d => { setTickets(d || []); setLoading(false); });
  }, [myTeamOnly, statusFilter, typeFilter, user.team]);

  useEffect(() => { load(); }, [load]);

  return (
    <div className="p-6">
      <div className="flex items-center justify-between mb-4 flex-wrap gap-3">
        <h2 className="text-xl font-bold" style={{color:'var(--primary)'}}>🎫 เคสทั้งหมด</h2>
        <div className="flex items-center gap-3 flex-wrap">
          <label className="flex items-center gap-2 text-sm cursor-pointer">
            <input type="checkbox" checked={myTeamOnly} onChange={e=>setMyTeamOnly(e.target.checked)}/>
            เฉพาะทีมฉัน ({user.team})
          </label>
          <select value={statusFilter} onChange={e=>setStatusFilter(e.target.value)} style={{width:'auto'}}>
            <option value="">สถานะทั้งหมด</option>
            {Object.entries(STATUS_LABELS).map(([k,v]) => <option key={k} value={k}>{v}</option>)}
          </select>
          <select value={typeFilter} onChange={e=>setTypeFilter(e.target.value)} style={{width:'auto'}}>
            <option value="">ประเภททั้งหมด</option>
            {CASE_TYPES.map(t => <option key={t} value={t}>{t}</option>)}
          </select>
          <button className="btn btn-secondary text-sm" onClick={load}>🔄</button>
        </div>
      </div>

      {loading ? <div className="text-center py-10 text-gray-400"><Spinner/></div> : (
        tickets.length === 0 ? <div className="text-center py-10 text-gray-400">ไม่มีเคส</div> : (
          <div className="space-y-3">
            {tickets.map(t => (
              <div key={t.id} className="card p-4 cursor-pointer hover:shadow-md transition-shadow" onClick={()=>onSelect(t.id)}>
                <div className="flex items-start justify-between gap-3">
                  <div className="flex-1 min-w-0">
                    <div className="flex items-center gap-2 flex-wrap">
                      <span className="font-mono text-xs text-gray-400">#{t.id}</span>
                      <span className={`status-${t.status}`}>{STATUS_LABELS[t.status]||t.status}</span>
                      <span className={`text-xs font-medium priority-${t.priority}`}>{t.priority}</span>
                      <span className="text-xs bg-gray-100 text-gray-600 px-2 py-0.5 rounded-full">{t.case_type}</span>
                      {t.case_subtype && <span className="text-xs text-gray-400">{t.case_subtype}</span>}
                    </div>
                    <p className="mt-1.5 text-gray-800 font-medium line-clamp-2 text-sm">{t.description}</p>
                    <div className="mt-1 flex items-center gap-3 text-xs text-gray-400 flex-wrap">
                      {t.account_name && <span>👤 {t.account_name}</span>}
                      <span>{TEAM_ICONS[t.opener_team]||'👥'} {t.opener_team}</span>
                      <span>→ {TEAM_ICONS[t.current_team]||'👥'} {t.current_team}</span>
                      <span>🕐 {fmtDt(t.created_at)}</span>
                    </div>
                  </div>
                </div>
              </div>
            ))}
          </div>
        )
      )}
    </div>
  );
}

// ── Timeline ──────────────────────────────────────────────────────────────────
function Timeline({ ticketId }) {
  const [logs, setLogs] = useState([]);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    api(`/api/tickets/${ticketId}/log`).then(d => { setLogs(d || []); setLoading(false); });
  }, [ticketId]);

  const ACTION_COLORS = {
    created: '#16a34a', forwarded: '#2563eb', completed: '#7c3aed',
    acknowledged: '#0891b2', closed: '#6b7280', fault_attributed: '#dc2626',
    note: '#d97706'
  };

  const ACTION_ICONS = {
    created: '🟢', forwarded: '➡️', completed: '✅',
    acknowledged: '👍', closed: '🔒', fault_attributed: '⚠️', note: '💬'
  };

  if (loading) return <div className="text-center py-6 text-gray-400"><Spinner/></div>;
  if (logs.length === 0) return <div className="text-center py-6 text-gray-400">ยังไม่มีประวัติ</div>;

  return (
    <div className="space-y-1">
      {logs.map((log, i) => (
        <div key={log.id} className="flex gap-3 relative">
          {i < logs.length - 1 && <div className="timeline-line"/>}
          <div className="tl-dot" style={{background: (ACTION_COLORS[log.action]||'#9ca3af')+'22', border:`2px solid ${ACTION_COLORS[log.action]||'#9ca3af'}`}}>
            <span style={{fontSize:13}}>{ACTION_ICONS[log.action]||'📌'}</span>
          </div>
          <div className="flex-1 pb-4">
            <div className="flex items-center gap-2 flex-wrap">
              <span className="font-medium text-sm text-gray-800">
                {log.user_name || log.team}
              </span>
              {log.team && <span className="text-xs text-gray-400">({TEAM_ICONS[log.team]||'👥'} {log.team})</span>}
              <span className="text-xs text-gray-400">{fmtDt(log.created_at)}</span>
              {log.duration_seconds != null && (
                <span className="text-xs bg-amber-100 text-amber-700 px-2 py-0.5 rounded-full">
                  ⏱ {fmtDuration(log.duration_seconds)}
                </span>
              )}
            </div>
            {log.note && (
              <div className="mt-1.5 text-sm text-gray-700 bg-gray-50 rounded-lg p-3 border border-gray-100">
                {log.note}
              </div>
            )}
            {log.image_url && (
              <img src={log.image_url} alt="attachment" className="mt-2 max-w-xs rounded-lg border border-gray-200 cursor-pointer"
                onClick={()=>window.open(log.image_url,'_blank')}/>
            )}
          </div>
        </div>
      ))}
    </div>
  );
}

// ── TicketDetail ──────────────────────────────────────────────────────────────
function TicketDetail({ ticketId, user, onBack }) {
  const [ticket, setTicket] = useState(null);
  const [employees, setEmployees] = useState([]);
  const [tab, setTab] = useState('detail');
  const [loading, setLoading] = useState(true);
  const [saving, setSaving] = useState(false);
  const [msg, setMsg] = useState('');

  // action forms
  const [note, setNote] = useState('');
  const [imageUrl, setImageUrl] = useState('');
  const [forwardTeam, setForwardTeam] = useState('');
  const [ackEmployee, setAckEmployee] = useState('');
  const [faultTeam, setFaultTeam] = useState('');
  const [faultEmployee, setFaultEmployee] = useState('');

  const load = () => {
    setLoading(true);
    Promise.all([
      api(`/api/tickets/${ticketId}`),
      api('/api/employees')
    ]).then(([t, e]) => {
      setTicket(t);
      setEmployees(e || []);
      setLoading(false);
    });
  };

  useEffect(() => { load(); }, [ticketId]);

  const act = async (endpoint, body) => {
    setSaving(true); setMsg('');
    const res = await api(`/api/tickets/${ticketId}/${endpoint}`, { method:'POST', body: JSON.stringify(body) });
    setSaving(false);
    if (res && res.success) { setNote(''); setImageUrl(''); setFaultTeam(''); setFaultEmployee(''); load(); }
    else setMsg(res?.error || 'เกิดข้อผิดพลาด');
  };

  if (loading) return <div className="p-8 text-center text-gray-400"><Spinner/></div>;
  if (!ticket) return <div className="p-8 text-center text-gray-400">ไม่พบเคส</div>;

  const isMyTeam = user.team === ticket.current_team;
  const isCX = user.team === 'CX';
  const isOpenerTeam = user.team === ticket.opener_team;
  const isPendingAck = ticket.status === 'pending_ack';
  const isPendingFault = ticket.status === 'pending_fault';

  const teamEmployees = employees.filter(e => e.team === user.team);
  const faultTeamEmployees = employees.filter(e => e.team === ticket.fault_team);

  return (
    <div className="p-6 max-w-3xl">
      <div className="flex items-center gap-3 mb-5">
        <button onClick={onBack} className="btn btn-secondary text-sm">← กลับ</button>
        <h2 className="text-lg font-bold" style={{color:'var(--primary)'}}>เคส #{ticket.id}</h2>
      </div>

      {/* Header card */}
      <div className="card p-5 mb-4">
        <div className="flex items-start justify-between flex-wrap gap-3">
          <div>
            <div className="flex items-center gap-2 flex-wrap mb-2">
              <span className={`status-${ticket.status}`}>{STATUS_LABELS[ticket.status]||ticket.status}</span>
              <span className={`text-sm font-medium priority-${ticket.priority}`}>{ticket.priority}</span>
              <span className="text-sm bg-gray-100 text-gray-600 px-2 py-0.5 rounded-full">{ticket.case_type}</span>
              {ticket.case_subtype && <span className="text-xs text-gray-500 bg-gray-50 px-2 py-0.5 rounded-full">{ticket.case_subtype}</span>}
            </div>
            {ticket.account_name && <p className="text-gray-600 text-sm mb-1">👤 {ticket.account_name}</p>}
            {ticket.root_cause && <p className="text-gray-500 text-xs">สาเหตุ: {ticket.root_cause}</p>}
          </div>
          <div className="text-right text-sm text-gray-500">
            <div>เปิดโดย: {TEAM_ICONS[ticket.opener_team]||'👥'} {ticket.opener_team}</div>
            <div>อยู่ที่: {TEAM_ICONS[ticket.current_team]||'👥'} <strong>{ticket.current_team}</strong></div>
            <div className="text-xs mt-1">{fmtDt(ticket.created_at)}</div>
          </div>
        </div>
        <p className="mt-3 text-gray-800">{ticket.description}</p>
        {ticket.fault_team && (
          <div className="mt-3 text-xs text-red-600 bg-red-50 px-3 py-1.5 rounded-lg">
            ⚠️ ระบุว่าเป็นความผิดพลาดของ: <strong>{ticket.fault_team}</strong>
            {ticket.fault_employee_name && <> → {ticket.fault_employee_name}</>}
          </div>
        )}
      </div>

      {/* Tabs */}
      <div className="flex border-b mb-4">
        {[{id:'detail',label:'การดำเนินการ'},{id:'timeline',label:'⏱ Timeline'},{id:'comments',label:'💬 บันทึก'}].map(t=>(
          <div key={t.id} className={`tab ${tab===t.id?'active':''}`} onClick={()=>setTab(t.id)}>{t.label}</div>
        ))}
      </div>

      {tab === 'timeline' && <Timeline ticketId={ticketId}/>}

      {tab === 'comments' && (
        <div className="space-y-3">
          <div className="card p-4">
            <h4 className="font-semibold text-gray-700 mb-3">เพิ่มบันทึก</h4>
            <textarea rows={3} value={note} onChange={e=>setNote(e.target.value)} placeholder="พิมพ์บันทึก..." className="mb-2"/>
            {imageUrl && <img src={imageUrl} alt="preview" className="max-w-xs rounded mb-2 border"/>}
            <div className="flex items-center justify-between">
              <ImageUploader onUploaded={url=>setImageUrl(url)}/>
              <button className="btn btn-primary text-sm" disabled={saving||!note}
                onClick={()=>act('note',{note,image_url:imageUrl})}>
                {saving?<Spinner/>:'บันทึก'}
              </button>
            </div>
          </div>
        </div>
      )}

      {tab === 'detail' && (
        <div className="space-y-4">

          {/* 1. Acknowledge (Complain, pending_ack) */}
          {isPendingAck && isMyTeam && (
            <div className="card p-4 border-l-4 border-purple-500">
              <h4 className="font-semibold text-gray-700 mb-3">👍 รับทราบเคส (Acknowledge)</h4>
              <p className="text-sm text-gray-500 mb-3">
                เคส Complain นี้ถูกส่งมาให้ทีม <strong>{ticket.current_team}</strong> รับทราบพร้อมกัน
              </p>
              <textarea rows={2} value={note} onChange={e=>setNote(e.target.value)} placeholder="บันทึกการรับทราบ *" className="mb-2"/>
              {imageUrl && <img src={imageUrl} alt="preview" className="max-w-xs rounded mb-2 border"/>}
              <div className="mb-3">
                <label className="text-sm font-medium text-gray-700 block mb-1">พนักงานผู้รับทราบ *</label>
                <select value={ackEmployee} onChange={e=>setAckEmployee(e.target.value)}>
                  <option value="">-- เลือกพนักงาน --</option>
                  {teamEmployees.map(e=><option key={e.id} value={e.id}>{e.name}</option>)}
                </select>
              </div>
              <div className="flex items-center gap-2">
                <ImageUploader onUploaded={url=>setImageUrl(url)}/>
                <button className="btn btn-primary ml-auto" disabled={saving||!note||!ackEmployee}
                  onClick={()=>act('acknowledge',{note,image_url:imageUrl,employee_id:ackEmployee})}>
                  {saving?<Spinner/>:'✅ รับทราบ'}
                </button>
              </div>
            </div>
          )}

          {/* 2. Forward / Complete (sequential, in_progress/open) */}
          {!isPendingAck && !isPendingFault && ticket.status !== 'closed' && isMyTeam && (
            <div className="card p-4 border-l-4 border-blue-400">
              <h4 className="font-semibold text-gray-700 mb-3">📤 ดำเนินการ</h4>
              <textarea rows={2} value={note} onChange={e=>setNote(e.target.value)} placeholder="บันทึก *" className="mb-2"/>
              {imageUrl && <img src={imageUrl} alt="preview" className="max-w-xs rounded mb-2 border"/>}
              <div className="flex items-center gap-2 mb-3">
                <ImageUploader onUploaded={url=>setImageUrl(url)}/>
              </div>
              <div className="flex gap-3 flex-wrap">
                {/* Complete → back to opener */}
                {ticket.opener_team !== ticket.current_team && (
                  <button className="btn btn-secondary flex-1" disabled={saving||!note}
                    onClick={()=>act('complete',{note,image_url:imageUrl})}>
                    {saving?<Spinner/>:`✅ ส่งกลับ ${ticket.opener_team}`}
                  </button>
                )}
                {/* Forward to another team */}
                <div className="flex gap-2 flex-1">
                  <select value={forwardTeam} onChange={e=>setForwardTeam(e.target.value)} style={{flex:1}}>
                    <option value="">-- ส่งต่อไปทีม --</option>
                    {TEAMS.filter(t=>t!==ticket.current_team).map(t=>(
                      <option key={t} value={t}>{TEAM_ICONS[t]} {t}</option>
                    ))}
                  </select>
                  <button className="btn btn-primary" disabled={saving||!note||!forwardTeam}
                    onClick={()=>act('forward',{note,image_url:imageUrl,to_team:forwardTeam})}>
                    {saving?<Spinner/>:'ส่งต่อ →'}
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* 3. Close with fault attribution (opener team only) */}
          {!isPendingAck && !isPendingFault && ticket.status !== 'closed' && isOpenerTeam && (
            <div className="card p-4 border-l-4 border-red-400">
              <h4 className="font-semibold text-gray-700 mb-3">🔒 ปิดเคส</h4>
              <textarea rows={2} value={note} onChange={e=>setNote(e.target.value)} placeholder="บันทึกการปิดเคส *" className="mb-3"/>
              <div className="mb-3">
                <label className="text-sm font-medium text-gray-700 block mb-2">ทีมที่รับผิดชอบ *</label>
                <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
                  {FAULT_TEAMS.map(t => (
                    <div key={t} className={`fault-btn ${faultTeam===t?'selected':''}`} onClick={()=>setFaultTeam(t)}>
                      <div className="text-lg">{TEAM_ICONS[t]||'👥'}</div>
                      <div className="text-xs mt-1">{t}</div>
                    </div>
                  ))}
                </div>
              </div>
              {imageUrl && <img src={imageUrl} alt="preview" className="max-w-xs rounded mb-2 border"/>}
              <div className="flex items-center gap-2">
                <ImageUploader onUploaded={url=>setImageUrl(url)}/>
                <button className="btn btn-danger ml-auto" disabled={saving||!note||!faultTeam}
                  onClick={()=>act('close',{note,image_url:imageUrl,fault_team:faultTeam})}>
                  {saving?<Spinner/>:'🔒 ปิดเคส'}
                </button>
              </div>
            </div>
          )}

          {/* 4. Attribute fault (fault team, pending_fault) */}
          {isPendingFault && isMyTeam && ticket.fault_team === user.team && (
            <div className="card p-4 border-l-4 border-pink-500">
              <h4 className="font-semibold text-gray-700 mb-3">⚠️ ระบุผู้รับผิดชอบ</h4>
              <p className="text-sm text-gray-500 mb-3">
                ทีม <strong>{ticket.fault_team}</strong> ถูกระบุว่าเป็นผู้รับผิดชอบ กรุณาเลือกพนักงานที่เกี่ยวข้อง
              </p>
              <select value={faultEmployee} onChange={e=>setFaultEmployee(e.target.value)} className="mb-3">
                <option value="">-- เลือกพนักงาน --</option>
                {faultTeamEmployees.map(e=><option key={e.id} value={e.id}>{e.name}</option>)}
              </select>
              <textarea rows={2} value={note} onChange={e=>setNote(e.target.value)} placeholder="บันทึกเพิ่มเติม" className="mb-3"/>
              <button className="btn btn-primary w-full" disabled={saving||!faultEmployee}
                onClick={()=>act('attribute-fault',{employee_id:faultEmployee,note})}>
                {saving?<Spinner/>:'✅ ยืนยัน'}
              </button>
            </div>
          )}

          {/* Closed state */}
          {ticket.status === 'closed' && (
            <div className="card p-4 text-center text-gray-400">
              <div className="text-3xl mb-2">🔒</div>
              <p>เคสนี้ปิดแล้ว</p>
              {ticket.closed_at && <p className="text-xs mt-1">ปิดเมื่อ {fmtDt(ticket.closed_at)}</p>}
            </div>
          )}

          {msg && <div className="text-red-600 text-sm bg-red-50 p-3 rounded">{msg}</div>}
        </div>
      )}
    </div>
  );
}

// ── Users (admin) ─────────────────────────────────────────────────────────────
function Users({ currentUser }) {
  const [users, setUsers] = useState([]);
  const [loading, setLoading] = useState(true);
  const [form, setForm] = useState({ username:'', display_name:'', password:'', team:'CX', role:'user' });
  const [editId, setEditId] = useState(null);
  const [msg, setMsg] = useState('');
  const [saving, setSaving] = useState(false);
  const [resetPw, setResetPw] = useState({});

  const load = () => {
    setLoading(true);
    api('/api/users').then(d => { setUsers(d || []); setLoading(false); });
  };

  useEffect(() => { load(); }, []);

  const set = (k,v) => setForm(f=>({...f,[k]:v}));

  const save = async e => {
    e.preventDefault();
    setSaving(true); setMsg('');
    const method = editId ? 'PUT' : 'POST';
    const path = editId ? `/api/users/${editId}` : '/api/users';
    const res = await api(path, { method, body: JSON.stringify(form) });
    setSaving(false);
    if (res && (res.id || res.success)) {
      setForm({ username:'', display_name:'', password:'', team:'CX', role:'user' });
      setEditId(null); load();
    } else setMsg(res?.error || 'เกิดข้อผิดพลาด');
  };

  const startEdit = u => {
    setEditId(u.id);
    setForm({ username: u.username, display_name: u.display_name, password:'', team: u.team, role: u.role });
  };

  const doResetPw = async (uid) => {
    const pw = resetPw[uid];
    if (!pw) return;
    const res = await api(`/api/users/${uid}/reset-password`, { method:'POST', body: JSON.stringify({password:pw}) });
    if (res && res.success) { setResetPw(r=>({...r,[uid]:''})); alert('รีเซ็ตสำเร็จ'); }
    else alert(res?.error || 'เกิดข้อผิดพลาด');
  };

  if (currentUser.role !== 'admin') return <div className="p-8 text-center text-gray-400">ไม่มีสิทธิ์เข้าถึง</div>;

  return (
    <div className="p-6 max-w-4xl">
      <h2 className="text-xl font-bold mb-5" style={{color:'var(--primary)'}}>👥 จัดการผู้ใช้</h2>

      {/* Form */}
      <div className="card p-5 mb-5">
        <h3 className="font-semibold text-gray-700 mb-3">{editId ? '✏️ แก้ไขผู้ใช้' : '➕ เพิ่มผู้ใช้ใหม่'}</h3>
        <form onSubmit={save} className="grid grid-cols-2 gap-3">
          <div>
            <label className="text-sm font-medium text-gray-700 block mb-1">ชื่อผู้ใช้ (username)</label>
            <input value={form.username} onChange={e=>set('username',e.target.value)} required disabled={!!editId}/>
          </div>
          <div>
            <label className="text-sm font-medium text-gray-700 block mb-1">ชื่อแสดง</label>
            <input value={form.display_name} onChange={e=>set('display_name',e.target.value)} required/>
          </div>
          {!editId && (
            <div>
              <label className="text-sm font-medium text-gray-700 block mb-1">รหัสผ่านเริ่มต้น</label>
              <input type="password" value={form.password} onChange={e=>set('password',e.target.value)} required={!editId}/>
            </div>
          )}
          <div>
            <label className="text-sm font-medium text-gray-700 block mb-1">ทีม</label>
            <select value={form.team} onChange={e=>set('team',e.target.value)}>
              {TEAMS.map(t=><option key={t} value={t}>{t}</option>)}
            </select>
          </div>
          <div>
            <label className="text-sm font-medium text-gray-700 block mb-1">สิทธิ์</label>
            <select value={form.role} onChange={e=>set('role',e.target.value)}>
              <option value="user">user</option>
              <option value="admin">admin</option>
            </select>
          </div>
          {msg && <div className="col-span-2 text-red-600 text-sm">{msg}</div>}
          <div className="col-span-2 flex gap-2">
            <button type="submit" className="btn btn-primary" disabled={saving}>{saving?<Spinner/>:(editId?'บันทึก':'เพิ่ม')}</button>
            {editId && <button type="button" className="btn btn-secondary" onClick={()=>{setEditId(null);setForm({username:'',display_name:'',password:'',team:'CX',role:'user'});}}>ยกเลิก</button>}
          </div>
        </form>
      </div>

      {/* List */}
      {loading ? <Spinner/> : (
        <div className="card overflow-hidden">
          <table className="w-full text-sm">
            <thead className="bg-gray-50 text-gray-600 text-left">
              <tr>
                <th className="p-3">ชื่อผู้ใช้</th>
                <th className="p-3">ชื่อแสดง</th>
                <th className="p-3">ทีม</th>
                <th className="p-3">สิทธิ์</th>
                <th className="p-3">Reset PW</th>
                <th className="p-3"></th>
              </tr>
            </thead>
            <tbody>
              {users.map(u => (
                <tr key={u.id} className="border-t">
                  <td className="p-3 font-mono">{u.username}</td>
                  <td className="p-3">{u.display_name}</td>
                  <td className="p-3">{TEAM_ICONS[u.team]||''} {u.team}</td>
                  <td className="p-3"><span className={`px-2 py-0.5 rounded-full text-xs ${u.role==='admin'?'bg-purple-100 text-purple-700':'bg-gray-100 text-gray-600'}`}>{u.role}</span></td>
                  <td className="p-3">
                    <div className="flex gap-1">
                      <input type="password" placeholder="รหัสใหม่" style={{width:100}} value={resetPw[u.id]||''}
                        onChange={e=>setResetPw(r=>({...r,[u.id]:e.target.value}))}/>
                      <button className="btn btn-secondary text-xs px-2" onClick={()=>doResetPw(u.id)}>Reset</button>
                    </div>
                  </td>
                  <td className="p-3">
                    <button className="btn btn-secondary text-xs" onClick={()=>startEdit(u)}>แก้ไข</button>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

// ── ImportERP ─────────────────────────────────────────────────────────────────
function ImportERP() {
  const [file, setFile] = useState(null);
  const [uploading, setUploading] = useState(false);
  const [result, setResult] = useState(null);
  const [err, setErr] = useState('');
  const ref = useRef();

  const submit = async e => {
    e.preventDefault();
    if (!file) return;
    setUploading(true); setResult(null); setErr('');
    const fd = new FormData();
    fd.append('file', file);
    const res = await apiUpload('/api/import/erp', fd);
    setUploading(false);
    if (res && res.inserted !== undefined) setResult(res);
    else setErr(res?.error || 'เกิดข้อผิดพลาด');
  };

  return (
    <div className="p-6 max-w-xl">
      <h2 className="text-xl font-bold mb-5" style={{color:'var(--primary)'}}>📥 Import ERP</h2>
      <div className="card p-5">
        <form onSubmit={submit} className="space-y-4">
          <div>
            <label className="text-sm font-medium text-gray-700 block mb-1">เลือกไฟล์ Excel (.xlsx)</label>
            <input ref={ref} type="file" accept=".xlsx,.xls"
              onChange={e=>{ setFile(e.target.files[0]); setResult(null); setErr(''); }}/>
          </div>
          {err && <div className="text-red-600 text-sm bg-red-50 p-3 rounded">{err}</div>}
          {result && (
            <div className="bg-green-50 border border-green-200 rounded-lg p-4 text-sm space-y-1">
              <p className="font-semibold text-green-700">✅ Import สำเร็จ</p>
              <p>แถวทั้งหมด: <strong>{result.total_rows}</strong></p>
              <p>เพิ่มใหม่: <strong>{result.inserted}</strong></p>
              <p>ซ้ำ (ข้าม): <strong>{result.skipped}</strong></p>
              {result.errors > 0 && <p className="text-orange-600">มีข้อผิดพลาด: {result.errors} แถว</p>}
            </div>
          )}
          <button type="submit" className="btn btn-primary w-full" disabled={uploading || !file}>
            {uploading ? <><Spinner/> กำลัง import...</> : '📤 Import'}
          </button>
        </form>
      </div>
      <div className="card p-4 mt-4 text-sm text-gray-500">
        <p className="font-medium text-gray-700 mb-2">คอลัมน์ที่ต้องมีในไฟล์:</p>
        <ul className="space-y-1 list-disc list-inside">
          <li>order_item_id, order_id, invoice_number</li>
          <li>doc_date, account_name, outlet_name</li>
          <li>sku_code, product_name, qty, unit, unit_price, total_sales</li>
        </ul>
      </div>
    </div>
  );
}

// ── Accounts / Outlets / Suppliers / Employees (simple pass-through) ──────────
function SimpleList({ title, endpoint, columns }) {
  const [data, setData] = useState([]);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    api(endpoint).then(d => { setData(d || []); setLoading(false); });
  }, [endpoint]);

  return (
    <div className="p-6">
      <h2 className="text-xl font-bold mb-4" style={{color:'var(--primary)'}}>{title}</h2>
      {loading ? <Spinner/> : (
        data.length === 0 ? <p className="text-gray-400">ไม่มีข้อมูล</p> : (
          <div className="card overflow-auto">
            <table className="w-full text-sm">
              <thead className="bg-gray-50 text-gray-600">
                <tr>{columns.map(c=><th key={c.key} className="p-3 text-left">{c.label}</th>)}</tr>
              </thead>
              <tbody>
                {data.map((row,i)=>(
                  <tr key={i} className="border-t hover:bg-gray-50">
                    {columns.map(c=><td key={c.key} className="p-3">{row[c.key]||'-'}</td>)}
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )
      )}
    </div>
  );
}

// ── App ───────────────────────────────────────────────────────────────────────
function App() {
  const [user, setUser] = useState(null);
  const [checking, setChecking] = useState(true);
  const [page, setPage] = useState('tickets');
  const [selectedTicket, setSelectedTicket] = useState(null);
  const [creating, setCreating] = useState(false);

  useEffect(() => {
    const token = getToken();
    if (!token) { setChecking(false); return; }
    api('/api/auth/me').then(d => {
      if (d && d.id) setUser(d);
      else clearToken();
      setChecking(false);
    }).catch(() => { clearToken(); setChecking(false); });
  }, []);

  const logout = () => { clearToken(); setUser(null); setPage('tickets'); };

  if (checking) return <div className="min-h-screen flex items-center justify-center text-gray-400"><Spinner/></div>;
  if (!user) return <Login onLogin={u => setUser(u)}/>;

  const navItems = [
    { id:'dashboard', label:'Dashboard', icon:'📊' },
    { id:'tickets', label:'เคส', icon:'🎫' },
    { id:'accounts', label:'ลูกค้า', icon:'👤' },
    { id:'outlets', label:'Outlet', icon:'🏪' },
    { id:'suppliers', label:'Supplier', icon:'🏭' },
    { id:'employees', label:'พนักงาน', icon:'👷' },
    { id:'import', label:'Import ERP', icon:'📥' },
    ...(user.role === 'admin' ? [{ id:'users', label:'จัดการผู้ใช้', icon:'👥' }] : []),
  ];

  const renderPage = () => {
    if (selectedTicket) return <TicketDetail ticketId={selectedTicket} user={user} onBack={()=>setSelectedTicket(null)}/>;
    if (creating) return <CreateTicket user={user} onCreated={id=>{ setCreating(false); setSelectedTicket(id); }}/>;
    switch(page) {
      case 'dashboard': return <Dashboard/>;
      case 'tickets': return <TicketList user={user} onSelect={id=>setSelectedTicket(id)}/>;
      case 'accounts': return <SimpleList title="👤 ลูกค้า" endpoint="/api/accounts" columns={[{key:'account_name',label:'ชื่อ'},{key:'account_code',label:'รหัส'},{key:'channel',label:'ช่องทาง'},{key:'sales_name',label:'เซลล์'}]}/>;
      case 'outlets': return <SimpleList title="🏪 Outlet" endpoint="/api/outlets" columns={[{key:'outlet_name',label:'ชื่อ'},{key:'account_name',label:'ลูกค้า'},{key:'province',label:'จังหวัด'}]}/>;
      case 'suppliers': return <SimpleList title="🏭 Supplier" endpoint="/api/suppliers" columns={[{key:'supplier_name',label:'ชื่อ'},{key:'contact_name',label:'ผู้ติดต่อ'},{key:'phone',label:'โทร'}]}/>;
      case 'employees': return <SimpleList title="👷 พนักงาน" endpoint="/api/employees" columns={[{key:'name',label:'ชื่อ'},{key:'team',label:'ทีม'},{key:'position',label:'ตำแหน่ง'}]}/>;
      case 'import': return <ImportERP/>;
      case 'users': return <Users currentUser={user}/>;
      default: return <TicketList user={user} onSelect={id=>setSelectedTicket(id)}/>;
    }
  };

  return (
    <div className="flex min-h-screen">
      {/* Sidebar */}
      <div className="sidebar flex flex-col py-4 px-2">
        <div className="px-3 mb-6">
          <div className="text-white font-bold text-lg">📋 SMM CRM</div>
          <div className="text-teal-300 text-xs mt-0.5">{TEAM_ICONS[user.team]||''} {user.display_name} · {user.team}</div>
        </div>

        <nav className="flex-1 space-y-1">
          {navItems.map(n => (
            <a key={n.id} className={page===n.id&&!selectedTicket&&!creating?'active':''} onClick={()=>{ setPage(n.id); setSelectedTicket(null); setCreating(false); }}>
              {n.icon} {n.label}
            </a>
          ))}
        </nav>

        <div className="mt-4 px-1 space-y-1">
          {page === 'tickets' && !selectedTicket && !creating && (
            <a onClick={()=>{ setCreating(true); setSelectedTicket(null); }} className="cursor-pointer">
              ➕ เปิดเคสใหม่
            </a>
          )}
          <a onClick={logout} style={{color:'#f87171'}}>🚪 ออกจากระบบ</a>
        </div>
      </div>

      {/* Main */}
      <div className="flex-1 overflow-auto">
        {renderPage()}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
