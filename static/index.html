<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>SMM Sourcing CRM</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
  :root { --primary: #0F4C45; --primary-light: #1a6b62; --primary-bg: #e8f5f3; }
  body { font-family: 'Segoe UI', sans-serif; background: #f5f7fa; }
  .sidebar { background: var(--primary); min-height: 100vh; width: 220px; flex-shrink:0; }
  .sidebar a { color: #c8e6e3; transition: all .2s; display:flex; align-items:center; gap:8px; padding:10px 16px; border-radius:8px; cursor:pointer; text-decoration:none; }
  .sidebar a:hover, .sidebar a.active { background: var(--primary-light); color: #fff; }
  .badge { background:#ef4444; color:#fff; border-radius:9999px; padding:1px 7px; font-size:11px; }
  .btn { padding:7px 16px; border-radius:8px; font-size:14px; cursor:pointer; border:none; transition:all .15s; }
  .btn-primary { background: var(--primary); color:#fff; }
  .btn-primary:hover { background: var(--primary-light); }
  .btn-secondary { background:#f3f4f6; color:#374151; }
  .btn-secondary:hover { background:#e5e7eb; }
  .btn-danger { background:#fee2e2; color:#dc2626; }
  .btn-danger:hover { background:#fecaca; }
  .card { background:#fff; border-radius:12px; box-shadow:0 1px 4px rgba(0,0,0,.08); }
  .status-open { color:#2563eb; background:#eff6ff; border-radius:20px; padding:2px 10px; font-size:12px; }
  .status-in_progress { color:#d97706; background:#fffbeb; border-radius:20px; padding:2px 10px; font-size:12px; }
  .status-pending_ack { color:#7c3aed; background:#ede9fe; border-radius:20px; padding:2px 10px; font-size:12px; }
  .status-pending_fault { color:#db2777; background:#fce7f3; border-radius:20px; padding:2px 10px; font-size:12px; }
  .status-closed { color:#6b7280; background:#f9fafb; border-radius:20px; padding:2px 10px; font-size:12px; }
  .priority-Urgent { color:#dc2626; font-weight:700; }
  .priority-High { color:#ea580c; font-weight:600; }
  .priority-Medium { color:#d97706; }
  .priority-Low { color:#16a34a; }
  input, select, textarea { border:1px solid #d1d5db; border-radius:6px; padding:7px 10px; width:100%; outline:none; font-size:14px; }
  input:focus, select:focus, textarea:focus { border-color:var(--primary); box-shadow:0 0 0 2px rgba(15,76,69,.15); }
  .tab { padding:8px 18px; cursor:pointer; border-bottom:2px solid transparent; color:#6b7280; font-size:14px; white-space:nowrap; }
  .tab.active { color:var(--primary); border-color:var(--primary); font-weight:600; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .spin { animation: spin 1s linear infinite; display:inline-block; }
  .timeline-line { position:absolute; left:13px; top:28px; bottom:0; width:2px; background:#e5e7eb; }
  .tl-dot { width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:13px; flex-shrink:0; z-index:1; }
  .fault-btn { border:2px solid #e5e7eb; border-radius:10px; padding:10px 14px; cursor:pointer; text-align:center; transition:all .15s; font-size:13px; }
  .fault-btn:hover { border-color:var(--primary); background:var(--primary-bg); }
  .fault-btn.selected { border-color:var(--primary); background:var(--primary-bg); color:var(--primary); font-weight:600; }
  .checkbox-team { display:flex; align-items:center; gap:8px; padding:8px 12px; border:2px solid #e5e7eb; border-radius:8px; cursor:pointer; transition:all .15s; font-size:13px; }
  .checkbox-team:hover { border-color:#9ca3af; }
  .checkbox-team.checked { border-color:var(--primary); background:var(--primary-bg); color:var(--primary); }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;
const API = '';

// ── auth helpers ─────────────────────────────────────────────────────────────
const getToken = () => localStorage.getItem('crm_token');
const setToken = t => localStorage.setItem('crm_token', t);
const clearToken = () => localStorage.removeItem('crm_token');

async function api(path, opts = {}) {
  const token = getToken();
  const headers = { 'Content-Type': 'application/json', ...(opts.headers || {}) };
  if (token) headers['Authorization'] = 'Bearer ' + token;
  const res = await fetch(API + path, { ...opts, headers });
  if (res.status === 401) { clearToken(); window.location.reload(); return; }
  return res.json();
}

async function apiUpload(path, formData) {
  const token = getToken();
  const headers = {};
  if (token) headers['Authorization'] = 'Bearer ' + token;
  const res = await fetch(API + path, { method: 'POST', body: formData, headers });
  return res.json();
}

// ── constants ─────────────────────────────────────────────────────────────────
const TEAMS = ['CX', 'Sales', 'KAM', 'Merchandise', 'Inbound/QC', 'Outbound/Logistics', 'Management'];
const FAULT_TEAMS = [...TEAMS, 'Customer'];
const CASE_TYPES = ['Complain', 'Claim', 'Update Invoice'];
const CLAIM_SUBTYPES = ['ด่วน (ภายในวัน)', 'รอรอบถัดไป (ไม่รู้วัน)', 'รอรอบถัดไป (รู้วันแล้ว)'];
const ROOT_CAUSES = ['สินค้าตกหล่น', 'คุณภาพไม่ผ่าน/ไม่ได้ spec', 'น้ำหนักไม่ครบ', 'ส่งผิด SKU', 'เอกสารผิดพลาด', 'อื่นๆ'];
const PRIORITIES = ['Urgent', 'High', 'Medium', 'Low'];

const TEAM_ICONS = {
  'CX': '🎧', 'Sales': '💼', 'KAM': '🤝', 'Merchandise': '📦',
  'Inbound/QC': '🔍', 'Outbound/Logistics': '🚚', 'Management': '👔', 'Customer': '🧑'
};

const STATUS_LABELS = {
  open: 'Open', in_progress: 'In Progress',
  pending_ack: 'Pending Acknowledge', pending_fault: 'Pending Fault Attribution', closed: 'Closed'
};

function fmtDuration(sec) {
  if (!sec && sec !== 0) return '';
  if (sec < 60) return `${sec}วิ`;
  if (sec < 3600) return `${Math.floor(sec/60)}น.`;
  if (sec < 86400) return `${Math.floor(sec/3600)}ชม.${Math.floor((sec%3600)/60)}น.`;
  return `${Math.floor(sec/86400)}วัน ${Math.floor((sec%86400)/3600)}ชม.`;
}

function fmtDt(s) {
  if (!s) return '';
  const d = new Date(s);
  return d.toLocaleDateString('th-TH', { day:'2-digit', month:'short' }) + ' ' +
    d.toLocaleTimeString('th-TH', { hour:'2-digit', minute:'2-digit' });
}

// ── Spinner ───────────────────────────────────────────────────────────────────
function Spinner() { return <span className="spin">⏳</span>; }

// ── Login ─────────────────────────────────────────────────────────────────────
function Login({ onLogin }) {
  const [username, setUsername] = useState('');
  const [password, setPassword] = useState('');
  const [err, setErr] = useState('');
  const [loading, setLoading] = useState(false);

  const submit = async e => {
    e.preventDefault();
    setLoading(true); setErr('');
    const res = await fetch(API + '/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();
    setLoading(false);
    if (data.token) { setToken(data.token); onLogin(data.user); }
    else setErr(data.error || 'Login failed');
  };

  return (
    <div className="min-h-screen flex items-center justify-center bg-gradient-to-br from-teal-900 to-teal-700">
      <div className="card p-8 w-full max-w-sm">
        <div className="text-center mb-6">
          <div className="text-4xl mb-2">📋</div>
          <h1 className="text-2xl font-bold" style={{color:'var(--primary)'}}>SMM CRM</h1>
          <p className="text-gray-500 text-sm mt-1">Ticket Management System</p>
        </div>
        <form onSubmit={submit} className="space-y-4">
          <div>
            <label className="text-sm font-medium text-gray-700 block mb-1">Username</label>
            <input value={username} onChange={e=>setUsername(e.target.value)} required autoFocus/>
          </div>
          <div>
            <label className="text-sm font-medium text-gray-700 block mb-1">Password</label>
            <input type="password" value={password} onChange={e=>setPassword(e.target.value)} required/>
          </div>
          {err && <div className="text-red-600 text-sm bg-red-50 p-2 rounded">{err}</div>}
          <button type="submit" className="btn btn-primary w-full" disabled={loading}>
            {loading ? <Spinner/> : 'Sign In'}
          </button>
        </form>
      </div>
    </div>
  );
}

// ── ImageUploader ─────────────────────────────────────────────────────────────
function ImageUploader({ onUploaded }) {
  const [uploading, setUploading] = useState(false);
  const [err, setErr] = useState('');
  const ref = useRef();

  const handle = async e => {
    const file = e.target.files[0];
    if (!file) return;
    setUploading(true); setErr('');
    try {
      const fd = new FormData();
      fd.append('file', file);
      const res = await apiUpload('/api/upload/image', fd);
      if (res && res.url) { onUploaded(res.url); }
      else { setErr(res?.error || 'Upload failed'); }
    } catch(ex) {
      setErr('Network error: ' + ex.message);
    } finally {
      setUploading(false);
      if (ref.current) ref.current.value = '';
    }
  };

  return (
    <div className="flex flex-col gap-1">
      <label className="flex items-center gap-2 cursor-pointer text-sm text-gray-500 hover:text-gray-700">
        {uploading ? <Spinner/> : '📎'}
        <span>{uploading ? 'Uploading...' : 'Attach image'}</span>
        <input ref={ref} type="file" accept="image/*" className="hidden" onChange={handle} style={{display:'none'}}/>
      </label>
      {err && <p className="text-xs text-red-500">{err}</p>}
    </div>
  );
}

// ── DateRangeFilter ───────────────────────────────────────────────────────────
function DateRangeFilter({ value, onChange }) {
  const today = new Date().toISOString().slice(0, 10);
  const d7 = new Date(Date.now() - 6*86400000).toISOString().slice(0, 10);
  const d30 = new Date(Date.now() - 29*86400000).toISOString().slice(0, 10);
  return (
    <div className="flex items-center gap-2 flex-wrap mb-5">
      <span className="text-sm text-gray-500 shrink-0">Date range:</span>
      <input type="date" value={value.start} onChange={e=>onChange({...value,start:e.target.value})}
        style={{fontSize:13,border:'1px solid #d1d5db',borderRadius:6,padding:'4px 8px'}}/>
      <span className="text-xs text-gray-400">—</span>
      <input type="date" value={value.end} onChange={e=>onChange({...value,end:e.target.value})}
        style={{fontSize:13,border:'1px solid #d1d5db',borderRadius:6,padding:'4px 8px'}}/>
      <button className="text-xs px-2 py-1 rounded border border-gray-200 hover:bg-gray-50"
        onClick={()=>onChange({start:d7,end:today})}>7 days</button>
      <button className="text-xs px-2 py-1 rounded border border-gray-200 hover:bg-gray-50"
        onClick={()=>onChange({start:d30,end:today})}>30 days</button>
      <button className="text-xs text-gray-400 hover:underline"
        onClick={()=>onChange({start:'',end:''})}>All time</button>
    </div>
  );
}

// ── BarChart ──────────────────────────────────────────────────────────────────
function BarChart({ data, labelKey, valueKey, color='var(--primary)' }) {
  if (!data || data.length === 0) return <p className="text-gray-400 text-sm">No data yet</p>;
  const max = Math.max(...data.map(d => d[valueKey] || 0)) || 1;
  return (
    <div className="space-y-2">
      {data.map((d, i) => {
        const pct = Math.round((d[valueKey]||0) / max * 100);
        return (
          <div key={i} className="flex items-center gap-3">
            <div className="w-32 text-sm text-gray-600 truncate shrink-0">{d[labelKey] || '—'}</div>
            <div className="flex-1 h-4 bg-gray-100 rounded-full overflow-hidden">
              <div className="h-full rounded-full" style={{width:pct+'%', background:color}}/>
            </div>
            <div className="text-sm text-gray-600 w-8 text-right shrink-0">{d[valueKey]||0}</div>
          </div>
        );
      })}
    </div>
  );
}

// ── Dashboard ─────────────────────────────────────────────────────────────────
function Dashboard() {
  const today = new Date().toISOString().slice(0, 10);
  const d7 = new Date(Date.now() - 6*86400000).toISOString().slice(0, 10);
  const [dateRange, setDateRange] = useState({ start: d7, end: today });
  const [tab, setTab] = useState('overview');
  const [overview, setOverview] = useState(null);
  const [bottleneck, setBottleneck] = useState([]);
  const [faultTeam, setFaultTeam] = useState([]);
  const [faultEmp, setFaultEmp] = useState([]);
  const [skuProblems, setSkuProblems] = useState([]);
  const [byCust, setByCust] = useState([]);
  const [byEmp, setByEmp] = useState([]);
  const [loading, setLoading] = useState(true);

  const qs = dateRange.start ? `?start=${dateRange.start}&end=${dateRange.end}` : '';

  useEffect(() => {
    setLoading(true);
    Promise.all([
      api(`/api/dashboard/overview${qs}`),
      api(`/api/dashboard/bottleneck`),
      api(`/api/dashboard/fault-by-team`),
      api(`/api/dashboard/fault-by-employee`),
      api(`/api/dashboard/sku-problems${qs}`),
      api(`/api/dashboard/by-customer${qs}`),
      api(`/api/dashboard/by-employee${qs}`),
    ]).then(([ov, bn, ft, fe, sk, bc, be]) => {
      setOverview(ov);
      setBottleneck(bn || []);
      setFaultTeam(ft || []);
      setFaultEmp(fe || []);
      setSkuProblems(sk || []);
      setByCust(bc || []);
      setByEmp(be || []);
      setLoading(false);
    });
  }, [qs]);

  if (loading) return <div className="p-8 text-center text-gray-400"><Spinner/> Loading...</div>;

  const tabs = [
    {id:'overview', label:'Overview'},
    {id:'bottleneck', label:'⏱ Bottleneck'},
    {id:'fault-team', label:'⚠️ Fault by Team'},
    {id:'sku', label:'📦 Problem SKUs'},
    {id:'customer', label:'🏪 By Account'},
    {id:'employee', label:'👤 Fault by Employee'},
  ];

  return (
    <div className="p-6">
      <h2 className="text-xl font-bold mb-4" style={{color:'var(--primary)'}}>📊 Dashboard</h2>

      <DateRangeFilter value={dateRange} onChange={setDateRange}/>

      {/* tabs */}
      <div className="flex border-b mb-5 overflow-x-auto">
        {tabs.map(t => (
          <div key={t.id} className={`tab ${tab===t.id?'active':''}`} onClick={()=>setTab(t.id)}>{t.label}</div>
        ))}
      </div>

      {/* ── Overview tab ── */}
      {tab === 'overview' && overview && (<div className="space-y-5">
        {/* KPI cards */}
        <div className="grid grid-cols-2 md:grid-cols-5 gap-4">
          {[
            {label:'Total', val:overview.total, color:'#374151'},
            {label:'Open', val:overview.open, color:'#2563eb'},
            {label:'In Progress', val:overview.in_progress, color:'#d97706'},
            {label:'Pending', val:(overview.pending_ack||0)+(overview.pending_fault||0), color:'#7c3aed'},
            {label:'Closed', val:overview.closed, color:'#16a34a'},
          ].map(c => (
            <div key={c.label} className="card p-4 text-center">
              <div className="text-3xl font-bold" style={{color:c.color}}>{c.val ?? 0}</div>
              <div className="text-sm text-gray-500 mt-1">{c.label}</div>
            </div>
          ))}
        </div>

        {/* Bar charts row */}
        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div className="card p-4">
            <h3 className="font-semibold text-gray-700 mb-3">Case Type</h3>
            <BarChart data={overview.by_case_type} labelKey="case_type" valueKey="cnt" color="#0d9488"/>
          </div>
          <div className="card p-4">
            <h3 className="font-semibold text-gray-700 mb-3">Fault Team</h3>
            <BarChart data={faultTeam} labelKey="fault_team" valueKey="cnt" color="#ef4444"/>
          </div>
          <div className="card p-4">
            <h3 className="font-semibold text-gray-700 mb-3">Priority</h3>
            <BarChart data={overview.by_priority} labelKey="priority" valueKey="cnt" color="#f59e0b"/>
          </div>
        </div>

        {/* Case contribution by team */}
        {overview.by_opener_team && overview.by_opener_team.length > 0 && (
          <div className="card p-4">
            <h3 className="font-semibold text-gray-700 mb-3">Case Contribution by Team</h3>
            <div className="space-y-2">
              {overview.by_opener_team.map(r => {
                const pct = overview.total ? Math.round(r.count/overview.total*100) : 0;
                return (
                  <div key={r.opener_team} className="flex items-center gap-3">
                    <div className="w-32 text-sm text-gray-600 shrink-0">{TEAM_ICONS[r.opener_team]||'👥'} {r.opener_team}</div>
                    <div className="flex-1 h-4 bg-gray-100 rounded-full overflow-hidden">
                      <div className="h-full rounded-full" style={{width:pct+'%', background:'var(--primary)'}}/>
                    </div>
                    <div className="text-sm text-gray-600 w-20 text-right">{r.count} ({pct}%)</div>
                  </div>
                );
              })}
            </div>
          </div>
        )}

        {/* Root cause */}
        {overview.by_root_cause && overview.by_root_cause.length > 0 && (
          <div className="card p-4">
            <h3 className="font-semibold text-gray-700 mb-3">Root Cause</h3>
            <BarChart data={overview.by_root_cause} labelKey="root_cause" valueKey="cnt" color="#8b5cf6"/>
          </div>
        )}
      </div>)}

      {tab === 'bottleneck' && (
        <div className="card p-4">
          <h3 className="font-semibold text-gray-700 mb-3">Average time per team (all time)</h3>
          {bottleneck.length === 0 ? <p className="text-gray-400 text-sm">No data yet</p> : (
            <table className="w-full text-sm">
              <thead><tr className="text-left text-gray-500 border-b">
                <th className="pb-2">Team</th><th className="pb-2">Cases</th><th className="pb-2">Avg. Time</th>
              </tr></thead>
              <tbody>
                {bottleneck.map((r,i) => (
                  <tr key={i} className={`border-b last:border-0 ${i%2===1?'bg-gray-50':''}`}>
                    <td className="py-2">{TEAM_ICONS[r.team]||'👥'} {r.team}</td>
                    <td className="py-2">{r.ticket_count}</td>
                    <td className="py-2 font-medium" style={{color:'var(--primary)'}}>{fmtDuration(r.avg_seconds)}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          )}
        </div>
      )}

      {tab === 'fault-team' && (
        <div className="card p-4">
          <h3 className="font-semibold text-gray-700 mb-3">Fault by Team (all time)</h3>
          {faultTeam.length === 0 ? <p className="text-gray-400 text-sm">No data yet</p> : (
            <table className="w-full text-sm">
              <thead><tr className="text-left text-gray-500 border-b">
                <th className="pb-2">Team</th><th className="pb-2">Cases</th>
              </tr></thead>
              <tbody>
                {faultTeam.map((r,i) => (
                  <tr key={i} className={`border-b last:border-0 ${i%2===1?'bg-gray-50':''}`}>
                    <td className="py-2">{TEAM_ICONS[r.fault_team]||'👥'} {r.fault_team}</td>
                    <td className="py-2 font-semibold text-red-600">{r.cnt}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          )}
        </div>
      )}


      {tab === 'sku' && (
        <div className="card p-4">
          <h3 className="font-semibold text-gray-700 mb-3">Frequently Problematic SKUs</h3>
          {skuProblems.length === 0 ? <p className="text-gray-400 text-sm">No data yet</p> : (
            <table className="w-full text-sm">
              <thead><tr className="text-left text-gray-500 border-b">
                <th className="pb-2">SKU</th><th className="pb-2">Product Name</th><th className="pb-2">Cases</th><th className="pb-2">Case Types</th>
              </tr></thead>
              <tbody>
                {skuProblems.map((r,i) => (
                  <tr key={i} className={`border-b last:border-0 ${i%2===1?'bg-gray-50':''}`}>
                    <td className="py-2 font-mono text-xs">{r.sku_code}</td>
                    <td className="py-2">{r.product_name}</td>
                    <td className="py-2 font-semibold text-red-600">{r.cnt}</td>
                    <td className="py-2 text-xs text-gray-400">{r.case_types}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          )}
        </div>
      )}

      {tab === 'customer' && (
        <div className="card p-4">
          <h3 className="font-semibold text-gray-700 mb-3">Cases by Account / Outlet</h3>
          {byCust.length === 0 ? <p className="text-gray-400 text-sm">No data yet</p> : (
            <table className="w-full text-sm">
              <thead><tr className="text-left text-gray-500 border-b">
                <th className="pb-2">Outlet</th><th className="pb-2">Account</th><th className="pb-2">Cases</th><th className="pb-2">Case Types</th>
              </tr></thead>
              <tbody>
                {byCust.map((r,i) => (
                  <tr key={i} className={`border-b last:border-0 ${i%2===1?'bg-gray-50':''}`}>
                    <td className="py-2 font-medium">{r.outlet_name}</td>
                    <td className="py-2 text-gray-500">{r.account_name}</td>
                    <td className="py-2 font-semibold">{r.cnt}</td>
                    <td className="py-2 text-xs text-gray-400">{r.case_types}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          )}
        </div>
      )}

      {tab === 'employee' && (
        <div className="card p-4">
          <h3 className="font-semibold text-gray-700 mb-3">Fault Attribution by Employee</h3>
          {byEmp.length === 0 ? <p className="text-gray-400 text-sm">No data yet</p> : (
            <table className="w-full text-sm">
              <thead><tr className="text-left text-gray-500 border-b">
                <th className="pb-2">Employee</th><th className="pb-2">Team</th><th className="pb-2">Cases</th><th className="pb-2">% of Total</th>
              </tr></thead>
              <tbody>
                {byEmp.map((r,i) => (
                  <tr key={i} className={`border-b last:border-0 ${i%2===1?'bg-gray-50':''}`}>
                    <td className="py-2 font-medium">{r.name}</td>
                    <td className="py-2 text-gray-500">{r.team}</td>
                    <td className="py-2 font-semibold">{r.cnt}</td>
                    <td className="py-2 text-gray-500">{r.pct}%</td>
                  </tr>
                ))}
              </tbody>
            </table>
          )}
        </div>
      )}
    </div>
  );
}

// ── Combobox ──────────────────────────────────────────────────────────────────
function Combobox({ items, value, onChange, placeholder, labelKey='name' }) {
  const [query, setQuery] = useState('');
  const [open, setOpen] = useState(false);
  const ref = useRef();

  const selected = items.find(i => i.id == value);
  const filtered = items.filter(i => i[labelKey].toLowerCase().includes(query.toLowerCase()));

  useEffect(() => {
    const handler = e => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', handler);
    return () => document.removeEventListener('mousedown', handler);
  }, []);

  const select = item => { onChange(item.id); setQuery(''); setOpen(false); };
  const clear = () => { onChange(''); setQuery(''); setOpen(false); };

  return (
    <div ref={ref} style={{position:'relative'}}>
      <div style={{display:'flex', alignItems:'center', border:'1px solid #d1d5db', borderRadius:6, background:'#fff', padding:'7px 10px'}}
        onClick={()=>setOpen(true)}>
        {selected && !open
          ? <span style={{flex:1, fontSize:14, color:'#111'}}>{selected[labelKey]}</span>
          : <input autoFocus={open} value={query} onChange={e=>setQuery(e.target.value)}
              onFocus={()=>setOpen(true)} placeholder={selected ? selected[labelKey] : placeholder}
              style={{flex:1, border:'none', outline:'none', fontSize:14, background:'transparent', padding:0}}/>
        }
        {selected
          ? <span onClick={e=>{e.stopPropagation();clear();}} style={{cursor:'pointer',color:'#9ca3af',marginLeft:4}}>✕</span>
          : <span style={{color:'#9ca3af',marginLeft:4}}>▾</span>
        }
      </div>
      {open && (
        <div style={{position:'absolute',zIndex:50,width:'100%',background:'#fff',border:'1px solid #d1d5db',borderRadius:6,boxShadow:'0 4px 12px rgba(0,0,0,.1)',maxHeight:220,overflowY:'auto',marginTop:2}}>
          {filtered.length === 0
            ? <div style={{padding:'10px 14px',color:'#9ca3af',fontSize:13}}>No results</div>
            : filtered.map(i => (
                <div key={i.id} onClick={()=>select(i)}
                  style={{padding:'8px 14px',cursor:'pointer',fontSize:14,background: i.id==value?'var(--primary-bg)':'#fff', color: i.id==value?'var(--primary)':'#111'}}
                  onMouseEnter={e=>e.currentTarget.style.background='#f3f4f6'}
                  onMouseLeave={e=>e.currentTarget.style.background=i.id==value?'var(--primary-bg)':'#fff'}>
                  {i[labelKey]}
                </div>
              ))
          }
        </div>
      )}
    </div>
  );
}

// ── CreateTicket ──────────────────────────────────────────────────────────────
function CreateTicket({ user, onCreated }) {
  const [accounts, setAccounts] = useState([]);
  const [allOutlets, setAllOutlets] = useState([]);
  const [selectedAccount, setSelectedAccount] = useState(null);
  const [invoices, setInvoices] = useState([]);
  const [selectedInvoice, setSelectedInvoice] = useState('');
  const [invoiceSkus, setInvoiceSkus] = useState([]);
  const [claimItems, setClaimItems] = useState([]);
  const [form, setForm] = useState({
    case_type: 'Complain', case_subtype: '', root_cause: '', priority: 'Medium',
    outlet_id: '', description: '', initial_teams: [], resolution_type: ''
  });
  const [imageUrl, setImageUrl] = useState('');
  const [saving, setSaving] = useState(false);
  const [msg, setMsg] = useState('');

  useEffect(() => {
    api('/api/accounts').then(d => setAccounts(d || []));
  }, []);

  useEffect(() => {
    if (!selectedAccount) { setAllOutlets([]); set('outlet_id', ''); return; }
    api(`/api/accounts/${selectedAccount.id}/outlets`).then(d => setAllOutlets(d || []));
  }, [selectedAccount]);

  useEffect(() => {
    if (!form.outlet_id) { setInvoices([]); setSelectedInvoice(''); setInvoiceSkus([]); setClaimItems([]); return; }
    api(`/api/outlets/${form.outlet_id}/invoices`).then(d => setInvoices(d || []));
    setSelectedInvoice(''); setInvoiceSkus([]); setClaimItems([]);
  }, [form.outlet_id]);

  useEffect(() => {
    if (!selectedInvoice) { setInvoiceSkus([]); setClaimItems([]); return; }
    api(`/api/invoices/${selectedInvoice}/skus`).then(d => setInvoiceSkus(d || []));
    setClaimItems([]);
  }, [selectedInvoice]);

  const set = (k, v) => setForm(f => ({ ...f, [k]: v }));

  const toggleTeam = team => {
    setForm(f => {
      const has = f.initial_teams.includes(team);
      return { ...f, initial_teams: has ? f.initial_teams.filter(t => t !== team) : [...f.initial_teams, team] };
    });
  };

  const toggleClaimItem = sku => {
    setClaimItems(prev => {
      const exists = prev.find(i => i.sku_code === sku.sku_code);
      if (exists) return prev.filter(i => i.sku_code !== sku.sku_code);
      return [...prev, { ...sku, claimed_qty: sku.qty }];
    });
  };

  const setClaimQty = (sku_code, qty) => {
    setClaimItems(prev => prev.map(i => i.sku_code === sku_code ? { ...i, claimed_qty: qty } : i));
  };

  const submit = async e => {
    e.preventDefault();
    if (!form.case_type) return setMsg('Please select a case type');
    if (form.case_type === 'Claim' && claimItems.length === 0) return setMsg('Please select at least 1 claim item');
    if (form.case_type === 'Claim' && !form.resolution_type) return setMsg('Please select a resolution type');
    if (form.case_type === 'Complain' && form.initial_teams.length === 0) return setMsg('Please select at least 1 team');
    if (form.case_type !== 'Complain' && form.initial_teams.length === 0) return setMsg('Please select a team');
    setSaving(true); setMsg('');
    const payload = {
      ...form,
      image_url: imageUrl,
      invoice_number: selectedInvoice || null,
      claim_items: claimItems.length > 0 ? JSON.stringify(claimItems) : null,
    };
    const res = await api('/api/tickets', { method: 'POST', body: JSON.stringify(payload) });
    setSaving(false);
    if (res && res.id) { onCreated(res.id); }
    else setMsg(res?.error || 'An error occurred');
  };

  const isComplain = form.case_type === 'Complain';
  const isClaim = form.case_type === 'Claim';

  return (
    <div className="p-6 max-w-2xl">
      <h2 className="text-xl font-bold mb-5" style={{color:'var(--primary)'}}>🎫 New Case</h2>
      <form onSubmit={submit} className="space-y-5">
        <div className="card p-5 space-y-4">
          <h3 className="font-semibold text-gray-700">Case Details</h3>

          {/* Case type */}
          <div>
            <label className="text-sm font-medium text-gray-700 block mb-2">Case Type *</label>
            <div className="flex gap-3">
              {CASE_TYPES.map(t => (
                <label key={t} className={`flex items-center gap-2 px-4 py-2 rounded-lg border-2 cursor-pointer transition-all text-sm ${form.case_type===t?'border-teal-600 bg-teal-50 text-teal-700 font-semibold':'border-gray-200'}`}>
                  <input type="radio" name="case_type" value={t} checked={form.case_type===t}
                    onChange={e=>{ set('case_type',t); set('initial_teams',[]); }} className="hidden"/>
                  {t==='Complain'?'😤':t==='Claim'?'🔄':'📄'} {t}
                </label>
              ))}
            </div>
          </div>

          {/* Claim subtype */}
          {form.case_type === 'Claim' && (
            <div>
              <label className="text-sm font-medium text-gray-700 block mb-1">Claim Type *</label>
              <select value={form.case_subtype} onChange={e=>set('case_subtype',e.target.value)} required>
                <option value="">-- Select type --</option>
                {CLAIM_SUBTYPES.map(s => <option key={s} value={s}>{s}</option>)}
              </select>
            </div>
          )}

          {/* Root cause */}
          <div>
            <label className="text-sm font-medium text-gray-700 block mb-1">Root Cause</label>
            <select value={form.root_cause} onChange={e=>set('root_cause',e.target.value)}>
              <option value="">-- None --</option>
              {ROOT_CAUSES.map(r => <option key={r} value={r}>{r}</option>)}
            </select>
          </div>

          {/* Priority */}
          <div>
            <label className="text-sm font-medium text-gray-700 block mb-1">Priority</label>
            <select value={form.priority} onChange={e=>set('priority',e.target.value)}>
              {PRIORITIES.map(p => <option key={p} value={p}>{p}</option>)}
            </select>
          </div>

          {/* Account */}
          <div>
            <label className="text-sm font-medium text-gray-700 block mb-1">Account</label>
            <Combobox items={accounts} value={selectedAccount?.id||''} placeholder="Search Account..."
              onChange={id=>{ const acc=accounts.find(a=>a.id==id)||null; setSelectedAccount(acc); set('outlet_id',''); }}/>
          </div>

          {/* Outlet — shows after account selected */}
          {selectedAccount && (
            <div>
              <label className="text-sm font-medium text-gray-700 block mb-1">Outlet</label>
              <Combobox items={allOutlets} value={form.outlet_id} placeholder="Search Outlet..."
                onChange={id=>set('outlet_id', id)}/>
            </div>
          )}

          {/* Invoice — shows after outlet selected, for all case types */}
          {form.outlet_id && (
            <div>
              <label className="text-sm font-medium text-gray-700 block mb-1">Invoice Number {isClaim && <span className="text-red-500">*</span>}</label>
              {invoices.length === 0
                ? <p className="text-xs text-gray-400">No invoices found for this outlet</p>
                : <select value={selectedInvoice} onChange={e=>setSelectedInvoice(e.target.value)}>
                    <option value="">-- Select invoice --</option>
                    {invoices.map(inv => (
                      <option key={inv.invoice_number} value={inv.invoice_number}>
                        {inv.invoice_number} — {inv.doc_date} ({inv.sku_count} items)
                      </option>
                    ))}
                  </select>
              }
            </div>
          )}

          {/* Claim items — shows after invoice selected (all case types) */}
          {selectedInvoice && invoiceSkus.length > 0 && (
            <div>
              <label className="text-sm font-medium text-gray-700 block mb-2">
                {isClaim ? <>Claim Items <span className="text-red-500">*</span></> : 'Related Items'}
                <span className="text-xs text-gray-400 font-normal ml-1">— tick items with issues{isClaim && ' and fill claim qty'}</span>
              </label>
              <div className="border border-gray-200 rounded-lg overflow-hidden">
                <table className="w-full text-sm">
                  <thead>
                    <tr className="bg-gray-50 border-b text-gray-500 text-xs">
                      <th className="p-2 w-8"></th>
                      <th className="p-2 text-left">Product</th>
                      <th className="p-2 text-center">Invoice Qty</th>
                      <th className="p-2 text-center">Claim Qty</th>
                    </tr>
                  </thead>
                  <tbody>
                    {invoiceSkus.map(sku => {
                      const sel = claimItems.find(i => i.sku_code === sku.sku_code);
                      return (
                        <tr key={sku.sku_code} className={`border-b last:border-0 cursor-pointer ${sel?'bg-teal-50':''}`}
                          onClick={()=>toggleClaimItem(sku)}>
                          <td className="p-2 text-center">
                            <div className={`w-4 h-4 rounded border-2 flex items-center justify-center text-xs mx-auto
                              ${sel?'bg-teal-600 border-teal-600 text-white':'border-gray-300'}`}>
                              {sel?'✓':''}
                            </div>
                          </td>
                          <td className="p-2">
                            <div className="font-medium">{sku.product_name}</div>
                            <div className="text-xs text-gray-400 font-mono">{sku.sku_code}</div>
                          </td>
                          <td className="p-2 text-center text-gray-600">{sku.qty} {sku.unit}</td>
                          <td className="p-2 text-center" onClick={e=>e.stopPropagation()}>
                            {sel && (
                              <input type="number" min="0.01" step="0.01" value={sel.claimed_qty}
                                onChange={e=>setClaimQty(sku.sku_code, parseFloat(e.target.value)||0)}
                                style={{width:70,textAlign:'center',border:'1px solid #d1d5db',borderRadius:6,padding:'3px 6px'}}/>
                            )}
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
              {claimItems.length > 0 && (
                <p className="text-xs text-teal-600 mt-1">✓ {claimItems.length} item(s) selected</p>
              )}
            </div>
          )}

          {/* Resolution type — for Claim only */}
          {isClaim && (
            <div>
              <label className="text-sm font-medium text-gray-700 block mb-1">Resolution Type *</label>
              <select value={form.resolution_type} onChange={e=>set('resolution_type',e.target.value)}>
                <option value="">-- Select resolution --</option>
                <option value="ส่งด่วน">🚚 ส่งด่วน (Express delivery)</option>
                <option value="ส่งพร้อมออเดอร์ถัดไป">📦 ส่งพร้อมออเดอร์ถัดไป (Next order)</option>
                <option value="อื่นๆ">📝 อื่นๆ (Other)</option>
              </select>
            </div>
          )}

          {/* Description */}
          <div>
            <label className="text-sm font-medium text-gray-700 block mb-1">Description *</label>
            <textarea rows={3} value={form.description} onChange={e=>set('description',e.target.value)} required placeholder="Describe the issue..."/>
          </div>

          {/* Image */}
          <div>
            <label className="text-sm font-medium text-gray-700 block mb-1">Attach image</label>
            {imageUrl
              ? <div className="flex items-center gap-3">
                  <img src={imageUrl} alt="preview" className="w-20 h-20 object-cover rounded-lg border"/>
                  <button type="button" className="btn btn-secondary text-xs" onClick={()=>setImageUrl('')}>Remove</button>
                </div>
              : <ImageUploader onUploaded={url=>setImageUrl(url)}/>
            }
          </div>
        </div>

        {/* Team selection */}
        <div className="card p-5">
          <h3 className="font-semibold text-gray-700 mb-3">
            {isComplain ? '🔀 Select involved teams (Complain — multi-select) *' : '➡️ Forward to team *'}
          </h3>
          {isComplain ? (
            <div className="grid grid-cols-2 gap-2">
              {TEAMS.map(t => (
                <div key={t} className={`checkbox-team ${form.initial_teams.includes(t)?'checked':''}`}
                  onClick={()=>toggleTeam(t)}>
                  <div className={`w-4 h-4 rounded border-2 flex items-center justify-center text-xs
                    ${form.initial_teams.includes(t)?'bg-teal-600 border-teal-600 text-white':'border-gray-300'}`}>
                    {form.initial_teams.includes(t)?'✓':''}
                  </div>
                  {TEAM_ICONS[t]} {t}
                </div>
              ))}
            </div>
          ) : (
            <div className="grid grid-cols-2 gap-2">
              {TEAMS.map(t => (
                <div key={t} className={`checkbox-team ${form.initial_teams[0]===t?'checked':''}`}
                  onClick={()=>set('initial_teams',[t])}>
                  <div className={`w-4 h-4 rounded-full border-2 flex items-center justify-center
                    ${form.initial_teams[0]===t?'bg-teal-600 border-teal-600':''}`}/>
                  {TEAM_ICONS[t]} {t}
                </div>
              ))}
            </div>
          )}
          {form.case_type === 'Update Invoice' && (
            <p className="text-xs text-gray-400 mt-2">* Update Invoice is usually sent to Sales Co or KAM</p>
          )}
        </div>

        {msg && <div className="text-red-600 text-sm bg-red-50 p-3 rounded">{msg}</div>}
        <button type="submit" className="btn btn-primary w-full" disabled={saving}>
          {saving ? <Spinner/> : '✅ Submit'}
        </button>
      </form>
    </div>
  );
}

// ── TicketList ────────────────────────────────────────────────────────────────
const STATUS_TABS = [
  { key: '', label: 'All' },
  { key: 'open', label: 'Open' },
  { key: 'in_progress', label: 'In Progress' },
  { key: 'pending_ack', label: 'Pending Ack' },
  { key: 'pending_fault', label: 'Pending Fault' },
  { key: 'closed', label: 'Closed' },
];

function TicketList({ user, onSelect }) {
  const [allTickets, setAllTickets] = useState([]);
  const [loading, setLoading] = useState(true);
  const [myTeamOnly, setMyTeamOnly] = useState(false);
  const [statusFilter, setStatusFilter] = useState('');
  const [typeFilter, setTypeFilter] = useState('');
  const [search, setSearch] = useState('');

  const load = useCallback(() => {
    setLoading(true);
    const params = new URLSearchParams();
    if (myTeamOnly && user.team) params.set('team', user.team);
    if (typeFilter) params.set('case_type', typeFilter);
    api('/api/tickets?' + params).then(d => {
      setAllTickets(d || []);
      setLoading(false);
    });
  }, [myTeamOnly, typeFilter, user.team]);

  useEffect(() => { load(); }, [load]);

  // filter in frontend
  const filtered = allTickets.filter(t => {
    if (statusFilter && t.status !== statusFilter) return false;
    if (search.trim()) {
      const q = search.toLowerCase();
      if (!(t.description||'').toLowerCase().includes(q)
        && !(t.outlet_name||'').toLowerCase().includes(q)
        && !(t.account_name||'').toLowerCase().includes(q)
        && !(t.ticket_no||'').toLowerCase().includes(q)
        && !String(t.id).includes(q)) return false;
    }
    return true;
  });

  const allCounts = allTickets.reduce((acc, t) => {
    acc[t.status] = (acc[t.status]||0)+1;
    acc[''] = (acc['']||0)+1;
    return acc;
  }, {});


  return (
    <div className="p-6">
      {/* Header */}
      <div className="flex items-center justify-between mb-4">
        <h2 className="text-xl font-bold" style={{color:'var(--primary)'}}>🎫 All Cases</h2>
        <button className="btn btn-secondary text-sm" onClick={load}>🔄 Refresh</button>
      </div>

      {/* Status tabs */}
      <div className="flex border-b mb-4 overflow-x-auto">
        {STATUS_TABS.map(tab => {
          const cnt = allCounts[tab.key] || 0;
          return (
            <div key={tab.key}
              className={`tab whitespace-nowrap ${statusFilter===tab.key?'active':''}`}
              onClick={()=>setStatusFilter(tab.key)}>
              {tab.label}
              {cnt > 0 && <span className="ml-1.5 text-xs bg-gray-200 text-gray-600 px-1.5 py-0.5 rounded-full"
                style={statusFilter===tab.key?{background:'var(--primary)',color:'#fff'}:{}}>{cnt}</span>}
            </div>
          );
        })}
      </div>

      {/* Filter bar */}
      <div className="flex items-center gap-3 mb-4 flex-wrap">
        <div className="flex-1 min-w-48 relative">
          <span className="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm">🔍</span>
          <input value={search} onChange={e=>setSearch(e.target.value)}
            placeholder="ค้นหา outlet, description, case #..."
            style={{paddingLeft:32}}/>
        </div>
        <select value={typeFilter} onChange={e=>setTypeFilter(e.target.value)} style={{width:'auto'}}>
          <option value="">All types</option>
          {CASE_TYPES.map(t => <option key={t} value={t}>{t}</option>)}
        </select>
        <label className="flex items-center gap-2 text-sm cursor-pointer whitespace-nowrap px-3 py-2 border border-gray-200 rounded-lg hover:bg-gray-50"
          style={myTeamOnly?{borderColor:'var(--primary)',background:'var(--primary-bg)',color:'var(--primary)'}:{}}>
          <input type="checkbox" checked={myTeamOnly} onChange={e=>setMyTeamOnly(e.target.checked)} className="hidden"/>
          <span>{myTeamOnly?'✓':''}</span>
          My team only ({user.team})
        </label>
      </div>

      {/* Cards */}
      {loading
        ? <div className="text-center py-10 text-gray-400"><Spinner/></div>
        : filtered.length === 0
          ? <div className="text-center py-10 text-gray-400">No cases found</div>
          : <div className="space-y-3">
              {filtered.map(t => (
                <div key={t.id} className="card cursor-pointer hover:shadow-md transition-all hover:border-teal-200 border border-transparent"
                  onClick={()=>onSelect(t.id)}>
                  <div className="p-4 flex items-start gap-3">
                    <div className="flex-1 min-w-0">
                      {/* Top row: id + type + priority + date */}
                      <div className="flex items-center gap-2 flex-wrap mb-1.5">
                        <span className="font-mono text-xs text-gray-400 font-semibold">#{t.id}</span>
                        <span className="text-xs bg-gray-100 text-gray-600 px-2 py-0.5 rounded-full font-medium">{t.case_type}</span>
                        {t.case_subtype && <span className="text-xs text-gray-400">{t.case_subtype}</span>}
                        <span className={`text-xs font-semibold priority-${t.priority}`}>{t.priority}</span>
                        <span className="ml-auto text-xs text-gray-400">🕐 {fmtDt(t.created_at)}</span>
                      </div>
                      {/* Outlet + Account — prominent */}
                      {(t.outlet_name || t.account_name) && (
                        <div className="mb-1">
                          {t.outlet_name && <span className="font-semibold text-sm text-gray-900">{t.outlet_name}</span>}
                          {t.account_name && <span className="text-xs text-gray-400 ml-2">({t.account_name})</span>}
                        </div>
                      )}
                      {/* Description */}
                      <p className="text-gray-600 text-sm line-clamp-2 mb-2">{t.description}</p>
                      {/* Bottom row: status + team flow */}
                      <div className="flex items-center gap-2 flex-wrap">
                        <span className={`status-${t.status}`}>{STATUS_LABELS[t.status]||t.status}</span>
                        <span className="text-xs text-gray-400">
                          {TEAM_ICONS[t.opener_team]||'👥'} {t.opener_team}
                          <span className="mx-1">→</span>
                          {TEAM_ICONS[t.current_team]||'👥'} {t.current_team}
                        </span>
                      </div>
                    </div>
                    {t.latest_image_url && (
                      <img src={t.latest_image_url} alt="img"
                        className="w-16 h-16 object-cover rounded-lg border border-gray-200 shrink-0"
                        onClick={e=>{ e.stopPropagation(); window.open(t.latest_image_url,'_blank'); }}/>
                    )}
                  </div>
                </div>
              ))}
            </div>
      }
    </div>
  );
}

// ── Timeline ──────────────────────────────────────────────────────────────────
function Timeline({ ticketId, user, isClosed }) {
  const [logs, setLogs] = useState([]);
  const [loading, setLoading] = useState(true);
  const [noteText, setNoteText] = useState('');
  const [noteImage, setNoteImage] = useState('');
  const [saving, setSaving] = useState(false);
  const [noteMsg, setNoteMsg] = useState('');

  const loadLogs = () => {
    api(`/api/tickets/${ticketId}/log`).then(d => { setLogs(d || []); setLoading(false); });
  };

  useEffect(() => { loadLogs(); }, [ticketId]);

  const submitNote = async () => {
    if (!noteText.trim()) return;
    setSaving(true); setNoteMsg('');
    try {
      const res = await api(`/api/tickets/${ticketId}/note`, {
        method: 'POST', body: JSON.stringify({ note: noteText, image_url: noteImage })
      });
      if (res && res.ok) { setNoteText(''); setNoteImage(''); loadLogs(); }
      else setNoteMsg(res?.error || 'เกิดข้อผิดพลาด');
    } catch(ex) { setNoteMsg('Error: ' + ex.message); }
    finally { setSaving(false); }
  };

  const ACTION_COLORS = {
    created: '#16a34a', forwarded: '#2563eb', completed: '#7c3aed',
    acknowledged: '#0891b2', closed: '#6b7280', fault_attributed: '#dc2626',
    note: '#d97706'
  };

  const ACTION_ICONS = {
    created: '🟢', forwarded: '➡️', completed: '✅',
    acknowledged: '👍', closed: '🔒', fault_attributed: '⚠️', note: '💬'
  };

  if (loading) return <div className="text-center py-6 text-gray-400"><Spinner/></div>;

  return (
    <div>
      <div className="space-y-1">
        {logs.length === 0
          ? <div className="text-center py-6 text-gray-400">No history yet</div>
          : logs.map((log, i) => (
            <div key={log.id} className="flex gap-3 relative">
              {i < logs.length - 1 && <div className="timeline-line"/>}
              <div className="tl-dot" style={{background: (ACTION_COLORS[log.action]||'#9ca3af')+'22', border:`2px solid ${ACTION_COLORS[log.action]||'#9ca3af'}`}}>
                <span style={{fontSize:13}}>{ACTION_ICONS[log.action]||'📌'}</span>
              </div>
              <div className="flex-1 pb-4">
                <div className="flex items-center gap-2 flex-wrap">
                  <span className="font-medium text-sm text-gray-800">
                    {log.user_display_name || log.created_by || '—'}
                  </span>
                  {(log.user_team || log.from_team) && (
                    <span className="text-xs px-2 py-0.5 rounded-full font-medium"
                      style={{background:'#f0fdfa', color:'#0f766e', border:'1px solid #99f6e4'}}>
                      {TEAM_ICONS[log.user_team || log.from_team]||'👥'} {log.user_team || log.from_team}
                    </span>
                  )}
                  <span className="text-xs text-gray-400">{fmtDt(log.created_at)}</span>
                  {log.duration_seconds != null && (
                    <span className="text-xs bg-amber-100 text-amber-700 px-2 py-0.5 rounded-full">
                      ⏱ {fmtDuration(log.duration_seconds)}
                    </span>
                  )}
                </div>
                {log.note && (
                  <div className="mt-1.5 text-sm text-gray-700 bg-gray-50 rounded-lg p-3 border border-gray-100">
                    {log.note}
                  </div>
                )}
                {log.image_url && (
                  <img src={log.image_url} alt="attachment" className="mt-2 max-w-xs rounded-lg border border-gray-200 cursor-pointer"
                    onClick={()=>window.open(log.image_url,'_blank')}/>
                )}
              </div>
            </div>
          ))
        }
      </div>

      {!isClosed && (
        <div className="card p-4 mt-4 border-l-4 border-amber-400">
          <h4 className="font-semibold text-sm text-gray-700 mb-2">💬 Add note</h4>
          <textarea rows={2} value={noteText} onChange={e=>setNoteText(e.target.value)}
            placeholder="พิมข้อความ..." className="mb-2 text-sm"/>
          {noteImage && <img src={noteImage} alt="preview" className="max-w-xs rounded mb-2 border"/>}
          <div className="flex items-center justify-between">
            <ImageUploader onUploaded={url=>setNoteImage(url)}/>
            <button className="btn btn-primary text-sm" disabled={saving||!noteText.trim()}
              onClick={submitNote}>{saving?<Spinner/>:'Add note'}</button>
          </div>
          {noteMsg && <p className="text-xs text-red-500 mt-1">{noteMsg}</p>}
        </div>
      )}
    </div>
  );
}

// ── TicketDetail ──────────────────────────────────────────────────────────────
function TicketDetail({ ticketId, user, onBack }) {
  const [ticket, setTicket] = useState(null);
  const [employees, setEmployees] = useState([]);
  const [assignments, setAssignments] = useState([]);
  const [tab, setTab] = useState('detail');
  const [loading, setLoading] = useState(true);
  const [saving, setSaving] = useState(false);
  const [msg, setMsg] = useState('');

  // action forms
  const [note, setNote] = useState('');
  const [imageUrl, setImageUrl] = useState('');
  const [forwardTeam, setForwardTeam] = useState('');
  const [ackEmployee, setAckEmployee] = useState('');
  const [faultTeam, setFaultTeam] = useState('');
  const [faultEmployee, setFaultEmployee] = useState('');

  const load = () => {
    setLoading(true);
    Promise.all([
      api(`/api/tickets/${ticketId}`),
      api('/api/employees'),
      api(`/api/tickets/${ticketId}/assignments`),
    ]).then(([t, e, a]) => {
      setTicket(t);
      setEmployees(e || []);
      setAssignments(a || []);
      setLoading(false);
    });
  };

  useEffect(() => { load(); }, [ticketId]);

  const act = async (endpoint, body) => {
    setSaving(true); setMsg('');
    try {
      const res = await api(`/api/tickets/${ticketId}/${endpoint}`, { method:'POST', body: JSON.stringify(body) });
      if (res && res.ok) { setNote(''); setImageUrl(''); setFaultTeam(''); setFaultEmployee(''); setAckEmployee(''); load(); }
      else setMsg(res?.error || 'An error occurred');
    } catch(ex) {
      setMsg('Error: ' + ex.message);
    } finally {
      setSaving(false);
    }
  };

  if (loading) return <div className="p-8 text-center text-gray-400"><Spinner/></div>;
  if (!ticket) return <div className="p-8 text-center text-gray-400">Case not found</div>;

  const isMyTeam = user.team === ticket.current_team;
  const isCX = user.team === 'CX';
  const isOpenerTeam = user.team === ticket.opener_team;
  const isPendingAck = ticket.status === 'pending_ack' || ticket.current_team === 'pending_ack';
  const isPendingFault = ticket.status === 'pending_fault';
  // For Complain: check if this user's team has an unacknowledged assignment
  const myAssignment = assignments.find(a => a.team === user.team && !a.acknowledged_at);
  const hasMyAssignment = !!myAssignment;

  const teamEmployees = employees.filter(e => e.team === user.team);
  const faultTeamEmployees = employees.filter(e => e.team === ticket.fault_team);

  const claimItemsParsed = (() => {
    try { return ticket.claim_items ? JSON.parse(ticket.claim_items) : []; }
    catch(e) { return []; }
  })();

  const downloadPDF = () => {
    const items = claimItemsParsed;
    const itemRows = items.map((item, i) => `
      <tr>
        <td style="border:1px solid #000;padding:5px 8px;text-align:center">${i+1}</td>
        <td style="border:1px solid #000;padding:5px 8px">${item.product_name || ''}</td>
        <td style="border:1px solid #000;padding:5px 8px;text-align:center">${item.claimed_qty || ''}</td>
        <td style="border:1px solid #000;padding:5px 8px;text-align:center">${item.unit || ''}</td>
        <td style="border:1px solid #000;padding:5px 8px"></td>
      </tr>`).join('');
    const emptyRows = Array.from({length: Math.max(0, 15 - items.length)}).map(() => `
      <tr>
        <td style="border:1px solid #000;padding:5px 8px;height:24px"></td>
        <td style="border:1px solid #000;padding:5px 8px"></td>
        <td style="border:1px solid #000;padding:5px 8px"></td>
        <td style="border:1px solid #000;padding:5px 8px"></td>
        <td style="border:1px solid #000;padding:5px 8px"></td>
      </tr>`).join('');
    const dateStr = ticket.created_at ? new Date(ticket.created_at).toLocaleDateString('th-TH') : '';
    const win = window.open('', '_blank');
    if (!win) { alert('กรุณาอนุญาต popup ในเบราว์เซอร์ก่อน แล้วลองใหม่อีกครั้ง'); return; }
    win.document.write(`<!DOCTYPE html><html><head>
      <meta charset="UTF-8">
      <title>claim-${ticket.ticket_no || ticketId}</title>
      <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; font-size: 11px; color: #000; padding: 20px; }
        @media print {
          body { padding: 10mm; }
          @page { size: A4 portrait; margin: 10mm; }
        }
        table { width: 100%; border-collapse: collapse; font-size: 10px; }
        .header-row { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; }
        .company-addr { font-size: 8px; line-height: 1.5; }
        .title { text-align: center; font-size: 16px; font-weight: bold; margin: 10px 0; }
        .shop-row { display: flex; justify-content: space-between; border-bottom: 1px solid #000; padding-bottom: 6px; margin-bottom: 10px; }
        .resolution { margin-bottom: 8px; font-size: 10px; }
        .footer { margin-top: 60px; display: flex; justify-content: space-around; }
        .sig { text-align: center; }
        .sig-line { margin-bottom: 6px; }
      </style>
    </head><body>
      <div class="header-row">
        <div class="company-addr">
          บริษัท ดอนเมืองพัฒนา จำกัด<br>
          355/115-116 หมู่ที่ 15 ถนน พหลโยธิน ตำบล คูคต อำเภอ ลำลูกกา จังหวัดปทุมธานี 12130
        </div>
        <div>สำหรับลูกค้า</div>
      </div>
      <div class="title">Product Testing</div>
      <div class="shop-row">
        <div>ชื่อร้าน: <strong>${ticket.outlet_name || '—'}</strong></div>
        <div>${ticket.invoice_number ? 'Invoice: <strong>' + ticket.invoice_number + '</strong> &nbsp;' : ''}${dateStr}</div>
      </div>
      ${ticket.resolution_type ? `<div class="resolution">วิธีจัดส่ง: <strong>${ticket.resolution_type}</strong></div>` : ''}
      <table>
        <thead>
          <tr style="background:#D9D9D9">
            <th style="border:1px solid #000;padding:5px 8px;width:7%;text-align:center">ลำดับ</th>
            <th style="border:1px solid #000;padding:5px 8px;width:55%;text-align:center">รายละเอียดสินค้า</th>
            <th style="border:1px solid #000;padding:5px 8px;width:12%;text-align:center">จำนวน</th>
            <th style="border:1px solid #000;padding:5px 8px;width:12%;text-align:center">หน่วย</th>
            <th style="border:1px solid #000;padding:5px 8px;width:14%;text-align:center">หมายเหตุ</th>
          </tr>
        </thead>
        <tbody>${itemRows}${emptyRows}</tbody>
      </table>
      <div class="footer">
        <div class="sig"><div class="sig-line">…………………………………………</div>ผู้รับสินค้า</div>
        <div class="sig"><div class="sig-line">…………………………………………</div>ผู้ส่งสินค้า</div>
      </div>
      <script>window.onload = function(){ window.print(); window.onafterprint = function(){ window.close(); }; }<\/script>
    </body></html>`);
    win.document.close();
  };

  return (
    <div className="p-6 max-w-3xl">
      <div className="flex items-center gap-3 mb-5">
        <button onClick={onBack} className="btn btn-secondary text-sm">← Back</button>
        <h2 className="text-lg font-bold" style={{color:'var(--primary)'}}>Case #{ticket.id}</h2>
        {ticket.case_type === 'Claim' && claimItemsParsed.length > 0 && (
          <button onClick={downloadPDF} className="btn btn-primary text-sm ml-auto">
            📄 Download PDF
          </button>
        )}
      </div>

      {/* Header card */}
      <div className="card p-5 mb-4">
        <div className="flex items-start justify-between flex-wrap gap-3">
          <div>
            <div className="flex items-center gap-2 flex-wrap mb-2">
              <span className={`status-${ticket.status}`}>{STATUS_LABELS[ticket.status]||ticket.status}</span>
              <span className={`text-sm font-medium priority-${ticket.priority}`}>{ticket.priority}</span>
              <span className="text-sm bg-gray-100 text-gray-600 px-2 py-0.5 rounded-full">{ticket.case_type}</span>
              {ticket.case_subtype && <span className="text-xs text-gray-500 bg-gray-50 px-2 py-0.5 rounded-full">{ticket.case_subtype}</span>}
            </div>
            {ticket.account_name && <p className="text-gray-600 text-sm mb-1">👤 {ticket.account_name}</p>}
            {ticket.root_cause && <p className="text-gray-500 text-xs">Root cause: {ticket.root_cause}</p>}
          </div>
          <div className="text-right text-sm text-gray-500">
            <div>Opened by: {TEAM_ICONS[ticket.opener_team]||'👥'} {ticket.opener_team}</div>
            <div>Current team: {TEAM_ICONS[ticket.current_team]||'👥'} <strong>{ticket.current_team}</strong></div>
            <div className="text-xs mt-1">{fmtDt(ticket.created_at)}</div>
          </div>
        </div>
        <p className="mt-3 text-gray-800">{ticket.description}</p>
        {ticket.resolution_type && (
          <div className="mt-2 text-sm text-teal-700 bg-teal-50 px-3 py-1.5 rounded-lg">
            🔧 Resolution: <strong>{ticket.resolution_type}</strong>
          </div>
        )}
        {ticket.claim_items && (() => {
          try {
            const items = JSON.parse(ticket.claim_items);
            if (!items || items.length === 0) return null;
            return (
              <div className="mt-2">
                <div className="text-xs font-medium text-gray-500 mb-1">Claim Items:</div>
                <div className="border border-gray-200 rounded-lg overflow-hidden">
                  <table className="w-full text-xs">
                    <thead><tr className="bg-gray-50 border-b text-gray-400">
                      <th className="p-2 text-left">Product</th>
                      <th className="p-2 text-center">Claim Qty</th>
                    </tr></thead>
                    <tbody>
                      {items.map((item, i) => (
                        <tr key={i} className="border-b last:border-0">
                          <td className="p-2">
                            <div className="font-medium text-gray-700">{item.product_name}</div>
                            <div className="text-gray-400 font-mono">{item.sku_code}</div>
                          </td>
                          <td className="p-2 text-center text-gray-700">{item.claimed_qty} {item.unit}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            );
          } catch(e) { return null; }
        })()}
        {ticket.fault_team && (
          <div className="mt-3 text-xs text-red-600 bg-red-50 px-3 py-1.5 rounded-lg">
            ⚠️ Fault attributed to: <strong>{ticket.fault_team}</strong>
            {ticket.fault_employee_name && <> → {ticket.fault_employee_name}</>}
          </div>
        )}
      </div>

      {/* Tabs */}
      <div className="flex border-b mb-4">
        {[{id:'detail',label:'Actions'},{id:'timeline',label:'⏱ Timeline'}].map(t=>(
          <div key={t.id} className={`tab ${tab===t.id?'active':''}`} onClick={()=>setTab(t.id)}>{t.label}</div>
        ))}
      </div>

      {tab === 'timeline' && <Timeline ticketId={ticketId} user={user} isClosed={ticket.status==='closed'}/>}

      {tab === 'detail' && (
        <div className="space-y-4">

          {/* 1. Acknowledge (Complain, pending_ack) */}
          {isPendingAck && hasMyAssignment && (
            <div className="card p-4 border-l-4 border-purple-500">
              <h4 className="font-semibold text-gray-700 mb-3">👍 Acknowledge</h4>
              <p className="text-sm text-gray-500 mb-3">
                This Complain case has been assigned to team <strong>{user.team}</strong> for acknowledgement
              </p>
              <textarea rows={2} value={note} onChange={e=>setNote(e.target.value)} placeholder="Acknowledgement note *" className="mb-2"/>
              {imageUrl && <img src={imageUrl} alt="preview" className="max-w-xs rounded mb-2 border"/>}
              <div className="mb-3">
                <label className="text-sm font-medium text-gray-700 block mb-1">Acknowledging employee *</label>
                <select value={ackEmployee} onChange={e=>setAckEmployee(e.target.value)}>
                  <option value="">-- Select employee --</option>
                  {teamEmployees.map(e=><option key={e.id} value={e.id}>{e.name}</option>)}
                </select>
              </div>
              <div className="flex items-center gap-2">
                <ImageUploader onUploaded={url=>setImageUrl(url)}/>
                <button className="btn btn-primary ml-auto" disabled={saving||!note||!ackEmployee}
                  onClick={()=>act('acknowledge',{note,image_url:imageUrl,employee_id:ackEmployee})}>
                  {saving?<Spinner/>:'✅ Acknowledge'}
                </button>
              </div>
            </div>
          )}

          {/* 2a. Quick note (any team, any open status) */}
          {ticket.status !== 'closed' && (
            <div className="card p-4 border-l-4 border-amber-400">
              <h4 className="font-semibold text-gray-700 mb-2">💬 Save note</h4>
              <textarea rows={2} value={note} onChange={e=>setNote(e.target.value)} placeholder="บันทึกข้อความ..." className="mb-2"/>
              {imageUrl && <img src={imageUrl} alt="preview" className="max-w-xs rounded mb-2 border"/>}
              <div className="flex items-center justify-between">
                <ImageUploader onUploaded={url=>setImageUrl(url)}/>
                <button className="btn btn-secondary text-sm" disabled={saving||(!note.trim()&&!imageUrl)}
                  onClick={async()=>{
                    setSaving(true); setMsg('');
                    try {
                      const res = await api(`/api/tickets/${ticketId}/note`, {method:'POST', body:JSON.stringify({note,image_url:imageUrl})});
                      if(res&&res.ok){setNote('');setImageUrl('');}
                      else setMsg(res?.error||'เกิดข้อผิดพลาด');
                    } catch(ex){setMsg('Error: '+ex.message);}
                    finally{setSaving(false);}
                  }}>
                  {saving?<Spinner/>:'💾 Save'}
                </button>
              </div>
              {msg && <p className="text-xs text-red-500 mt-1">{msg}</p>}
            </div>
          )}

          {/* 2b. Forward / Complete (sequential, in_progress/open) */}
          {!isPendingAck && !isPendingFault && ticket.status !== 'closed' && isMyTeam && (
            <div className="card p-4 border-l-4 border-blue-400">
              <h4 className="font-semibold text-gray-700 mb-3">📤 Actions</h4>
              <div className="flex gap-3 flex-wrap">
                {/* Complete → back to opener */}
                {ticket.opener_team !== ticket.current_team && (
                  <button className="btn btn-secondary flex-1" disabled={saving}
                    onClick={()=>act('complete',{note:'',image_url:''})}>
                    {saving?<Spinner/>:`✅ Return to ${ticket.opener_team}`}
                  </button>
                )}
                {/* Forward to another team */}
                <div className="flex gap-2 flex-1">
                  <select value={forwardTeam} onChange={e=>setForwardTeam(e.target.value)} style={{flex:1}}>
                    <option value="">-- Forward to team --</option>
                    {TEAMS.filter(t=>t!==ticket.current_team).map(t=>(
                      <option key={t} value={t}>{TEAM_ICONS[t]} {t}</option>
                    ))}
                  </select>
                  <button className="btn btn-primary" disabled={saving||!forwardTeam}
                    onClick={()=>act('forward',{note:'',image_url:imageUrl,to_team:forwardTeam})}>
                    {saving?<Spinner/>:'Forward →'}
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* 3. Close with fault attribution (opener team only, not Complain — Complain auto-closes) */}
          {!isPendingAck && !isPendingFault && ticket.status !== 'closed' && isOpenerTeam && ticket.case_type !== 'Complain' && (
            <div className="card p-4 border-l-4 border-red-400">
              <h4 className="font-semibold text-gray-700 mb-3">🔒 Close Case</h4>
              <textarea rows={2} value={note} onChange={e=>setNote(e.target.value)} placeholder="Closing note *" className="mb-3"/>
              <div className="mb-3">
                <label className="text-sm font-medium text-gray-700 block mb-2">Responsible team *</label>
                <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
                  {FAULT_TEAMS.map(t => (
                    <div key={t} className={`fault-btn ${faultTeam===t?'selected':''}`} onClick={()=>setFaultTeam(t)}>
                      <div className="text-lg">{TEAM_ICONS[t]||'👥'}</div>
                      <div className="text-xs mt-1">{t}</div>
                    </div>
                  ))}
                </div>
              </div>
              {imageUrl && <img src={imageUrl} alt="preview" className="max-w-xs rounded mb-2 border"/>}
              <div className="flex items-center gap-2">
                <ImageUploader onUploaded={url=>setImageUrl(url)}/>
                <button className="btn btn-danger ml-auto" disabled={saving||!note||!faultTeam}
                  onClick={()=>act('close',{note,image_url:imageUrl,fault_team:faultTeam})}>
                  {saving?<Spinner/>:'🔒 Close Case'}
                </button>
              </div>
            </div>
          )}

          {/* 4. Attribute fault (fault team, pending_fault) */}
          {isPendingFault && ticket.fault_team === user.team && (
            <div className="card p-4 border-l-4 border-pink-500">
              <h4 className="font-semibold text-gray-700 mb-3">⚠️ Attribute Fault</h4>
              <p className="text-sm text-gray-500 mb-3">
                Team <strong>{ticket.fault_team}</strong> has been identified as responsible. Please select the employee involved.
              </p>
              <select value={faultEmployee} onChange={e=>setFaultEmployee(e.target.value)} className="mb-3">
                <option value="">-- Select employee --</option>
                {faultTeamEmployees.map(e=><option key={e.id} value={e.id}>{e.name}</option>)}
              </select>
              <textarea rows={2} value={note} onChange={e=>setNote(e.target.value)} placeholder="Additional note" className="mb-3"/>
              <button className="btn btn-primary w-full" disabled={saving||!faultEmployee}
                onClick={()=>act('attribute-fault',{employee_id:faultEmployee,note})}>
                {saving?<Spinner/>:'✅ Confirm'}
              </button>
            </div>
          )}

          {/* Closed state */}
          {ticket.status === 'closed' && (
            <div className="card p-4 text-center text-gray-400">
              <div className="text-3xl mb-2">🔒</div>
              <p>This case is closed</p>
              {ticket.closed_at && <p className="text-xs mt-1">Closed on {fmtDt(ticket.closed_at)}</p>}
            </div>
          )}

          {msg && <div className="text-red-600 text-sm bg-red-50 p-3 rounded">{msg}</div>}
        </div>
      )}
    </div>
  );
}

// ── Users (admin) ─────────────────────────────────────────────────────────────
function Users({ currentUser }) {
  const [users, setUsers] = useState([]);
  const [loading, setLoading] = useState(true);
  const [form, setForm] = useState({ username:'', display_name:'', password:'', team:'CX', role:'user' });
  const [editId, setEditId] = useState(null);
  const [msg, setMsg] = useState('');
  const [saving, setSaving] = useState(false);
  const [resetPw, setResetPw] = useState({});

  const load = () => {
    setLoading(true);
    api('/api/users').then(d => { setUsers(d || []); setLoading(false); });
  };

  useEffect(() => { load(); }, []);

  const set = (k,v) => setForm(f=>({...f,[k]:v}));

  const save = async e => {
    e.preventDefault();
    setSaving(true); setMsg('');
    const method = editId ? 'PUT' : 'POST';
    const path = editId ? `/api/users/${editId}` : '/api/users';
    const res = await api(path, { method, body: JSON.stringify(form) });
    setSaving(false);
    if (res && (res.id || res.success)) {
      setForm({ username:'', display_name:'', password:'', team:'CX', role:'user' });
      setEditId(null); load();
    } else setMsg(res?.error || 'An error occurred');
  };

  const startEdit = u => {
    setEditId(u.id);
    setForm({ username: u.username, display_name: u.display_name, password:'', team: u.team, role: u.role });
  };

  const doResetPw = async (uid) => {
    const pw = resetPw[uid];
    if (!pw) return;
    const res = await api(`/api/users/${uid}/password`, { method:'PUT', body: JSON.stringify({new_password:pw}) });
    if (res && res.success) { setResetPw(r=>({...r,[uid]:''})); alert('Password reset successful'); }
    else alert(res?.error || 'An error occurred');
  };

  if (currentUser.role !== 'admin') return <div className="p-8 text-center text-gray-400">Access denied</div>;

  return (
    <div className="p-6 max-w-4xl">
      <h2 className="text-xl font-bold mb-5" style={{color:'var(--primary)'}}>👥 User Management</h2>

      {/* Form */}
      <div className="card p-5 mb-5">
        <h3 className="font-semibold text-gray-700 mb-3">{editId ? '✏️ Edit User' : '➕ Add New User'}</h3>
        <form onSubmit={save} className="grid grid-cols-2 gap-3">
          <div>
            <label className="text-sm font-medium text-gray-700 block mb-1">Username</label>
            <input value={form.username} onChange={e=>set('username',e.target.value)} required disabled={!!editId}/>
          </div>
          <div>
            <label className="text-sm font-medium text-gray-700 block mb-1">Display Name</label>
            <input value={form.display_name} onChange={e=>set('display_name',e.target.value)} required/>
          </div>
          {!editId && (
            <div>
              <label className="text-sm font-medium text-gray-700 block mb-1">Initial Password</label>
              <input type="password" value={form.password} onChange={e=>set('password',e.target.value)} required={!editId}/>
            </div>
          )}
          <div>
            <label className="text-sm font-medium text-gray-700 block mb-1">Team</label>
            <select value={form.team} onChange={e=>set('team',e.target.value)}>
              {TEAMS.map(t=><option key={t} value={t}>{t}</option>)}
            </select>
          </div>
          <div>
            <label className="text-sm font-medium text-gray-700 block mb-1">Role</label>
            <select value={form.role} onChange={e=>set('role',e.target.value)}>
              <option value="user">user</option>
              <option value="admin">admin</option>
            </select>
          </div>
          {msg && <div className="col-span-2 text-red-600 text-sm">{msg}</div>}
          <div className="col-span-2 flex gap-2">
            <button type="submit" className="btn btn-primary" disabled={saving}>{saving?<Spinner/>:(editId?'Save':'Add')}</button>
            {editId && <button type="button" className="btn btn-secondary" onClick={()=>{setEditId(null);setForm({username:'',display_name:'',password:'',team:'CX',role:'user'});}}>Cancel</button>}
          </div>
        </form>
      </div>

      {/* List */}
      {loading ? <Spinner/> : (
        <div className="card overflow-hidden">
          <table className="w-full text-sm">
            <thead className="bg-gray-50 text-gray-600 text-left">
              <tr>
                <th className="p-3">Username</th>
                <th className="p-3">Display Name</th>
                <th className="p-3">Team</th>
                <th className="p-3">Role</th>
                <th className="p-3">Reset PW</th>
                <th className="p-3"></th>
              </tr>
            </thead>
            <tbody>
              {users.map(u => (
                <tr key={u.id} className="border-t">
                  <td className="p-3 font-mono">{u.username}</td>
                  <td className="p-3">{u.display_name}</td>
                  <td className="p-3">{TEAM_ICONS[u.team]||''} {u.team}</td>
                  <td className="p-3"><span className={`px-2 py-0.5 rounded-full text-xs ${u.role==='admin'?'bg-purple-100 text-purple-700':'bg-gray-100 text-gray-600'}`}>{u.role}</span></td>
                  <td className="p-3">
                    <div className="flex gap-1">
                      <input type="password" placeholder="New password" style={{width:100}} value={resetPw[u.id]||''}
                        onChange={e=>setResetPw(r=>({...r,[u.id]:e.target.value}))}/>
                      <button className="btn btn-secondary text-xs px-2" onClick={()=>doResetPw(u.id)}>Reset</button>
                    </div>
                  </td>
                  <td className="p-3">
                    <button className="btn btn-secondary text-xs" onClick={()=>startEdit(u)}>Edit</button>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

// ── Accounts (3-level drill-down) ────────────────────────────────────────────
function Accounts({ onSelectTicket }) {
  const [accounts, setAccounts] = useState([]);
  const [loading, setLoading] = useState(true);
  const [selectedAccount, setSelectedAccount] = useState(null);
  const [outlets, setOutlets] = useState([]);
  const [loadingOutlets, setLoadingOutlets] = useState(false);
  const [selectedOutlet, setSelectedOutlet] = useState(null);
  const [outletTickets, setOutletTickets] = useState([]);
  const [loadingTickets, setLoadingTickets] = useState(false);

  useEffect(() => {
    api('/api/accounts').then(d => { setAccounts(d || []); setLoading(false); });
  }, []);

  const openAccount = acc => {
    setSelectedAccount(acc);
    setSelectedOutlet(null);
    setOutletTickets([]);
    setLoadingOutlets(true);
    api(`/api/accounts/${acc.id}/outlets`).then(d => {
      setOutlets(d || []);
      setLoadingOutlets(false);
    });
  };

  const openOutlet = outlet => {
    setSelectedOutlet(outlet);
    setLoadingTickets(true);
    api(`/api/outlets/${outlet.id}/tickets`).then(d => {
      setOutletTickets(d || []);
      setLoadingTickets(false);
    });
  };

  if (loading) return <div className="p-8 text-center text-gray-400"><Spinner/></div>;

  // Level 3: Ticket list for outlet
  if (selectedOutlet) return (
    <div className="p-6">
      {/* Breadcrumb */}
      <div className="flex items-center gap-2 text-sm text-gray-400 mb-5 flex-wrap">
        <span className="cursor-pointer hover:text-gray-600" onClick={()=>{ setSelectedAccount(null); setSelectedOutlet(null); }}>👤 Account</span>
        <span>›</span>
        <span className="cursor-pointer hover:text-gray-600" onClick={()=>setSelectedOutlet(null)}>{selectedAccount.name}</span>
        <span>›</span>
        <span className="text-gray-700 font-medium">🏪 {selectedOutlet.name}</span>
      </div>

      {loadingTickets ? <div className="text-center py-6 text-gray-400"><Spinner/></div> : (
        outletTickets.length === 0
          ? <div className="text-center py-10 text-gray-400">No cases for this outlet</div>
          : <div className="space-y-3">
              {outletTickets.map(t => (
                <div key={t.id} className="card p-4 cursor-pointer hover:shadow-md transition-shadow"
                  onClick={()=>onSelectTicket(t.id)}>
                  <div className="flex items-center gap-2 flex-wrap mb-1">
                    <span className="font-mono text-xs text-gray-400">#{t.id}</span>
                    <span className={`status-${t.status}`}>{STATUS_LABELS[t.status]||t.status}</span>
                    <span className={`text-xs font-medium priority-${t.priority}`}>{t.priority}</span>
                    <span className="text-xs bg-gray-100 text-gray-600 px-2 py-0.5 rounded-full">{t.case_type}</span>
                  </div>
                  <p className="text-sm text-gray-800">{t.description}</p>
                  <div className="mt-1 text-xs text-gray-400">{fmtDt(t.created_at)}</div>
                </div>
              ))}
            </div>
      )}
    </div>
  );

  // Level 2: Outlet list for account
  if (selectedAccount) return (
    <div className="p-6">
      {/* Breadcrumb */}
      <div className="flex items-center gap-2 text-sm text-gray-400 mb-5">
        <span className="cursor-pointer hover:text-gray-600" onClick={()=>setSelectedAccount(null)}>👤 Account</span>
        <span>›</span>
