function StatCard({ label, value, sub, color }) {
  return (
    <div className="card" style={{padding:'18px 20px'}}>
      <div style={{fontSize:11,color:'#6b7280',fontWeight:600,textTransform:'uppercase',letterSpacing:'.05em',marginBottom:8}}>{label}</div>
      <div style={{fontSize:30,fontWeight:700,color,lineHeight:1,marginBottom:4}}>{value}</div>
      <div style={{fontSize:11,color:'#9ca3af'}}>{sub}</div>
    </div>
  );
}

function SalesDashboard({ user }) {
  const isAdmin = user.role === 'admin';

  // ── Period filter ────────────────────────────────────────────────────────────
  const [period, setPeriod]       = useState('this_month');
  const [startDate, setStartDate] = useState('');
  const [endDate, setEndDate]     = useState('');

  // ── Summary data ─────────────────────────────────────────────────────────────
  const [data, setData]     = useState(null);
  const [loading, setLoading] = useState(true);

  // ── Rep table (admin only) ───────────────────────────────────────────────────
  const [reps, setReps]           = useState([]);
  const [repsLoading, setRepsLoading] = useState(false);
  const [sortCol, setSortCol]     = useState('total');
  const [sortDir, setSortDir]     = useState('desc');
  const [expandedRep, setExpandedRep] = useState(null);   // user_id
  const [repLeads, setRepLeads]   = useState([]);
  const [repLeadsLoading, setRepLeadsLoading] = useState(false);

  // ── Drill-down (Lead Detail) ─────────────────────────────────────────────────
  const [drillLead, setDrillLead] = useState(null);

  // ── Fetch summary ────────────────────────────────────────────────────────────
  useEffect(() => {
    if (period === 'custom' && (!startDate || !endDate)) return;
    setLoading(true);
    const p = new URLSearchParams({ period });
    if (period === 'custom') { p.append('start_date', startDate); p.append('end_date', endDate); }
    api('/api/sales-dashboard?' + p)
      .then(d => { setData(d); setLoading(false); })
      .catch(() => setLoading(false));
  }, [period, startDate, endDate]);

  // ── Fetch reps (admin) ───────────────────────────────────────────────────────
  useEffect(() => {
    if (!isAdmin) return;
    setRepsLoading(true);
    api('/api/sales-dashboard/reps')
      .then(d => { setReps(d || []); setRepsLoading(false); });
  }, [isAdmin]);

  // ── Sort reps ────────────────────────────────────────────────────────────────
  const doSort = col => {
    if (sortCol === col) setSortDir(d => d === 'desc' ? 'asc' : 'desc');
    else { setSortCol(col); setSortDir('desc'); }
  };
  const sortedReps = [...reps].sort((a,b) => {
    const av = a[sortCol] ?? (typeof a[sortCol]==='string' ? '' : 0);
    const bv = b[sortCol] ?? (typeof b[sortCol]==='string' ? '' : 0);
    if (typeof av === 'string') return sortDir==='asc' ? av.localeCompare(bv) : bv.localeCompare(av);
    return sortDir === 'desc' ? bv - av : av - bv;
  });

  // ── Toggle rep expand ────────────────────────────────────────────────────────
  const toggleRep = uid => {
    if (expandedRep === uid) { setExpandedRep(null); setRepLeads([]); return; }
    setExpandedRep(uid);
    setRepLeadsLoading(true);
    api(`/api/leads?owner_user_id=${uid}`)
      .then(d => { setRepLeads(Array.isArray(d) ? d : []); setRepLeadsLoading(false); });
  };

  // ── Helpers ──────────────────────────────────────────────────────────────────
  const STAGE_ORDER = ['Cold Call/Email', 'Meeting', 'Follow Up', 'Closed Win', 'Closed Lost'];
  const byStage = (data?.by_stage || []).slice().sort((a,b) =>
    STAGE_ORDER.indexOf(a.stage) - STAGE_ORDER.indexOf(b.stage));
  const total = data?.total_leads || 0;
  const periodLabel = period==='today' ? 'Today' : period==='yesterday' ? 'Yesterday' : period==='this_month' ? 'This Month' : period==='last_month' ? 'Last Month' : period==='custom' ? `${startDate} – ${endDate}` : period;

  const lastActiveLabel = ts => {
    if (!ts) return { text: 'No activity', warn: true };
    const days = Math.floor((Date.now() - new Date(ts)) / 86400000);
    if (days === 0) return { text: 'Today',     warn: false };
    if (days === 1) return { text: 'Yesterday', warn: false };
    return { text: `${days}d ago`, warn: days >= 7 };
  };

  const Th = ({ col, label, right }) => {
    const active = sortCol === col;
    return (
      <th onClick={() => doSort(col)}
        style={{padding:'9px 12px', fontSize:11, fontWeight:600, color: active?'#111827':'#6b7280',
          textAlign: right?'right':'left', cursor:'pointer', userSelect:'none',
          whiteSpace:'nowrap', background:'#f9fafb', borderBottom:'1px solid #e5e7eb'}}>
        {label} {active ? (sortDir==='desc'?'↓':'↑') : ''}
      </th>
    );
  };

  // ── Drill-down: show LeadDetail replacing dashboard ──────────────────────────
  if (drillLead) {
    return <LeadDetail lead={drillLead} user={user}
      onBack={() => setDrillLead(null)}
      onUpdated={() => setDrillLead(null)}/>;
  }

  return (
    <div style={{padding:24, overflowY:'auto', height:'100%'}}>
      {/* Header + Period filter */}
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:20,flexWrap:'wrap',gap:12}}>
        <div>
          <h1 style={{fontSize:20,fontWeight:700,color:'#111827',margin:0}}>Sales Dashboard</h1>
          <p style={{fontSize:13,color:'#6b7280',marginTop:3}}>
            {isAdmin ? 'All team data' : `Your data — ${user.display_name}`}
          </p>
        </div>
        <div style={{display:'flex',gap:6,alignItems:'center',flexWrap:'wrap'}}>
          {[['today','Today'],['yesterday','Yesterday'],['this_month','This Month'],['last_month','Last Month'],['custom','Custom']].map(([v,l])=>(
            <button key={v} onClick={()=>setPeriod(v)}
              style={{padding:'5px 14px',fontSize:12,borderRadius:6,border:'1px solid',cursor:'pointer',
                background:period===v?'#111827':'#fff', color:period===v?'#fff':'#6b7280',
                borderColor:period===v?'#111827':'#e5e7eb'}}>{l}
            </button>
          ))}
          {period==='custom' && (
            <>
              <input type="date" value={startDate} onChange={e=>setStartDate(e.target.value)}
                style={{fontSize:12,padding:'4px 8px',border:'1px solid #e5e7eb',borderRadius:6,width:130}}/>
              <span style={{fontSize:12,color:'#9ca3af'}}>–</span>
              <input type="date" value={endDate} onChange={e=>setEndDate(e.target.value)}
                style={{fontSize:12,padding:'4px 8px',border:'1px solid #e5e7eb',borderRadius:6,width:130}}/>
            </>
          )}
        </div>
      </div>

      {loading ? <div style={{display:'flex',justifyContent:'center',padding:48}}><Spinner/></div> : (<>
        {/* Summary Cards */}
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(180px,1fr))',gap:14,marginBottom:24}}>
          <StatCard label="Total Leads"  value={total}                     sub="all time"            color="#3b82f6"/>
          <StatCard label="Closed Win"   value={data?.closed_wins||0}      sub={periodLabel}         color="#22c55e"/>
          <StatCard label="Activities"   value={data?.activities_week||0}  sub="last 7 days"         color="#f59e0b"/>
          <StatCard label="Win Rate"     value={total>0?Math.round((data?.closed_wins||0)/total*100)+'%':'—'} sub="Win / Total" color="#8b5cf6"/>
        </div>

        {/* Leads by Stage */}
        <div className="card" style={{padding:20, marginBottom:24}}>
          <div style={{fontWeight:600,fontSize:14,color:'#111827',marginBottom:16}}>Leads by Stage</div>
          {byStage.length === 0
            ? <p style={{color:'#9ca3af',fontSize:13,textAlign:'center',padding:16}}>No data yet</p>
            : <div style={{display:'flex',flexDirection:'column',gap:12}}>
                {byStage.map(s => {
                  const c   = STAGE_COLORS[s.stage] || {bg:'#f3f4f6',border:'#9ca3af',text:'#374151'};
                  const pct = total > 0 ? Math.round(s.cnt/total*100) : 0;
                  return (
                    <div key={s.stage}>
                      <div style={{display:'flex',justifyContent:'space-between',fontSize:13,marginBottom:5}}>
                        <span style={{color:c.text,fontWeight:500}}>{s.stage}</span>
                        <span style={{color:'#374151',fontWeight:600}}>
                          {s.cnt} <span style={{color:'#9ca3af',fontWeight:400}}>({pct}%)</span>
                        </span>
                      </div>
                      <div style={{height:8,background:'#f3f4f6',borderRadius:4,overflow:'hidden'}}>
                        <div style={{height:'100%',background:c.border,borderRadius:4,width:pct+'%',transition:'width .4s'}}/>
                      </div>
                    </div>
                  );
                })}
              </div>
          }
        </div>

        {/* ── Rep Performance Table (admin only) ─────────────────────────────── */}
        {isAdmin && (
          <div className="card" style={{padding:0, overflow:'hidden'}}>
            <div style={{padding:'16px 20px', borderBottom:'1px solid #e5e7eb'}}>
              <div style={{fontWeight:600,fontSize:14,color:'#111827'}}>Rep Performance</div>
              <div style={{fontSize:12,color:'#9ca3af',marginTop:2}}>คลิกแถวเพื่อดู leads ของแต่ละคน · Activities = 7 วันล่าสุด</div>
            </div>
            {repsLoading
              ? <div style={{display:'flex',justifyContent:'center',padding:32}}><Spinner/></div>
              : <table style={{width:'100%',borderCollapse:'collapse'}}>
                  <thead>
                    <tr>
                      <Th col="display_name" label="Rep"/>
                      <Th col="total"        label="Leads"    right/>
                      <Th col="cold_call"    label="Cold Call" right/>
                      <Th col="meeting"      label="Meeting"  right/>
                      <Th col="follow_up"    label="Follow Up" right/>
                      <Th col="won"          label="Won"      right/>
                      <Th col="lost"         label="Lost"     right/>
                      <Th col="activities_week" label="Act/wk" right/>
                      <Th col="last_active"  label="Last Active"/>
                    </tr>
                  </thead>
                  <tbody>
                    {sortedReps.map(rep => {
                      const la  = lastActiveLabel(rep.last_active);
                      const isOpen = expandedRep === rep.user_id;
                      return (<React.Fragment key={rep.user_id}>
                        <tr onClick={() => toggleRep(rep.user_id)}
                          style={{borderBottom: isOpen ? 'none' : '1px solid #f3f4f6', cursor:'pointer',
                            background: isOpen ? '#f0f9ff' : 'transparent'}}
                          onMouseEnter={e => { if(!isOpen) e.currentTarget.style.background='#f9fafb'; }}
                          onMouseLeave={e => { if(!isOpen) e.currentTarget.style.background='transparent'; }}>
                          <td style={{padding:'11px 12px',fontSize:13,fontWeight:600,color:'#111827'}}>
                            {isOpen ? '▾ ' : '▸ '}{rep.display_name}
                          </td>
                          <td style={{padding:'11px 12px',fontSize:13,textAlign:'right',color:'#374151'}}>{rep.total}</td>
                          <td style={{padding:'11px 12px',fontSize:13,textAlign:'right',color:'#6b7280'}}>{rep.cold_call}</td>
                          <td style={{padding:'11px 12px',fontSize:13,textAlign:'right',color:'#6b7280'}}>{rep.meeting}</td>
                          <td style={{padding:'11px 12px',fontSize:13,textAlign:'right',color:'#6b7280'}}>{rep.follow_up}</td>
                          <td style={{padding:'11px 12px',fontSize:13,textAlign:'right',fontWeight:600,color:'#16a34a'}}>{rep.won}</td>
                          <td style={{padding:'11px 12px',fontSize:13,textAlign:'right',fontWeight:600,color:'#dc2626'}}>{rep.lost}</td>
                          <td style={{padding:'11px 12px',fontSize:13,textAlign:'right',color:'#374151'}}>{rep.activities_week}</td>
                          <td style={{padding:'11px 12px',fontSize:12,color: la.warn?'#dc2626':'#6b7280'}}>{la.text}</td>
                        </tr>
                        {isOpen && (
                          <tr>
                            <td colSpan={9} style={{padding:0, background:'#f0f9ff', borderBottom:'1px solid #e5e7eb'}}>
                              {repLeadsLoading
                                ? <div style={{display:'flex',justifyContent:'center',padding:20}}><Spinner/></div>
                                : repLeads.length === 0
                                  ? <div style={{padding:'16px 24px',fontSize:13,color:'#9ca3af'}}>ไม่มี lead</div>
                                  : <table style={{width:'100%',borderCollapse:'collapse'}}>
                                      <thead>
                                        <tr style={{background:'#e0f2fe'}}>
                                          {['Lead No','Company','Stage','Last Activity','Outlet(s)','Contact'].map(h=>(
                                            <th key={h} style={{padding:'7px 16px',fontSize:11,fontWeight:600,color:'#0369a1',textAlign:'left'}}>{h}</th>
                                          ))}
                                        </tr>
                                      </thead>
                                      <tbody>
                                        {repLeads.map(l => {
                                          const la2 = lastActiveLabel(l.last_activity_date || l.created_at);
                                          return (
                                            <tr key={l.id} onClick={e=>{e.stopPropagation();setDrillLead(l);}}
                                              style={{borderBottom:'1px solid #e0f2fe',cursor:'pointer'}}
                                              onMouseEnter={e=>e.currentTarget.style.background='#bae6fd'}
                                              onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
                                              <td style={{padding:'8px 16px',fontSize:12,fontFamily:'monospace',color:'#0369a1'}}>{l.lead_no}</td>
                                              <td style={{padding:'8px 16px',fontSize:13,fontWeight:500,color:'#111827'}}>{l.company_name}</td>
                                              <td style={{padding:'8px 16px'}}><StageBadge stage={l.stage}/></td>
                                              <td style={{padding:'8px 16px',fontSize:12,color:la2.warn?'#dc2626':'#6b7280'}}>{la2.text}</td>
                                              <td style={{padding:'8px 16px',fontSize:13,color:'#374151'}}>{l.branch||'-'}</td>
                                              <td style={{padding:'8px 16px',fontSize:12,color:'#6b7280'}}>{l.contact_name||'-'}</td>
                                            </tr>
                                          );
                                        })}
                                      </tbody>
                                    </table>
                              }
                            </td>
                          </tr>
                        )}
                      </React.Fragment>);
                    })}
                  </tbody>
                </table>
            }
          </div>
        )}
      </>)}
    </div>
  );
}

// ── RevenueBoard ─────────────────────────────────────────────────────────────
const REP_COLORS = ['#3b82f6','#22c55e','#f59e0b','#ef4444','#8b5cf6','#ec4899','#06b6d4','#f97316','#84cc16','#6366f1'];

function RevenueBoard({ user }) {
  const now0 = new Date();
  const today     = localISO(now0);
  const thisMonthStart = localISO(new Date(now0.getFullYear(), now0.getMonth(), 1));
  const [start, setStart]   = useState(thisMonthStart);
  const [end,   setEnd]     = useState(today);
  const [data,  setData]    = useState(null);
  const [loading, setLoading] = useState(false);
  const [expandedOwner, setExpandedOwner] = useState(null);
  const [ownerAccounts, setOwnerAccounts] = useState([]);
  const [acctLoading, setAcctLoading]     = useState(false);

  const load = (s, e) => {
    const s0 = (s !== undefined ? s : start);
    const e0 = (e !== undefined ? e : end);
    if (!s0 || !e0) return;
    setLoading(true);
    api(`/api/revenue/owners?start=${s0}&end=${e0}`)
      .then(d => { setData(d); setLoading(false); })
      .catch(err => { console.error('Revenue API error:', err); setData({rows:[], total_revenue:0}); setLoading(false); });
  };

  const setRange = (s, e) => { setStart(s); setEnd(e); load(s, e); };

  useEffect(() => { load(start, end); }, []);

  const toggleOwner = owner => {
    if (expandedOwner === owner) { setExpandedOwner(null); setOwnerAccounts([]); return; }
    setExpandedOwner(owner);
    setAcctLoading(true);
    api(`/api/revenue/owner-accounts?owner=${encodeURIComponent(owner)}&start=${start}&end=${end}`)
      .then(d => { setOwnerAccounts(Array.isArray(d)?d:[]); setAcctLoading(false); });
  };

  const fmtTHB = n => '฿' + Math.round(n||0).toLocaleString('th-TH');
  const fmtKg  = n => parseFloat(n||0).toLocaleString('en',{minimumFractionDigits:1,maximumFractionDigits:1});
  const fmtN   = n => (n||0).toLocaleString();

  const rows = data?.rows || [];
  const maxRev = rows.length > 0 ? rows[0].revenue : 1;

  return (
    <div style={{padding:24, overflowY:'auto', height:'100%'}}>
      {/* Header */}
      <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', flexWrap:'wrap', gap:12, marginBottom:20}}>
        <div>
          <h1 style={{fontSize:20, fontWeight:700, color:'#111827', margin:0}}>Revenue / ยอดขาย</h1>
          <p style={{fontSize:13, color:'#6b7280', marginTop:2}}>ข้อมูลจาก ERP · ตั้งแต่มีข้อมูล ERP</p>
        </div>
        {/* Date filter — inline compact */}
        <div style={{display:'flex', alignItems:'center', gap:6, flexWrap:'wrap',
          background:'#f9fafb', border:'1px solid #e5e7eb', borderRadius:10, padding:'6px 10px'}}>
          {(()=>{
            const _now = new Date();
            const _today     = localISO(_now);
            const _yesterday = localISO(new Date(_now.getFullYear(),_now.getMonth(),_now.getDate()-1));
            const _thisStart = localISO(new Date(_now.getFullYear(),_now.getMonth(),1));
            const _lastStart = localISO(new Date(_now.getFullYear(),_now.getMonth()-1,1));
            const _lastEnd   = localISO(new Date(_now.getFullYear(),_now.getMonth(),0));
            return [
              ['Today',      _today,     _today],
              ['Yesterday',  _yesterday, _yesterday],
              ['This Month', _thisStart, _today],
              ['Last Month', _lastStart, _lastEnd],
            ].map(([l,s,e]) => (
              <button key={l} type="button" onClick={()=>setRange(s,e)}
                style={{fontSize:12,padding:'4px 10px',border:'none',borderRadius:6,cursor:'pointer',
                  background: start===s&&end===e ? '#111827' : 'transparent',
                  color:      start===s&&end===e ? '#fff'    : '#6b7280',
                  fontWeight: start===s&&end===e ? 600 : 400}}>
                {l}
              </button>
            ));
          })()}
          <div style={{width:1, height:18, background:'#e5e7eb', margin:'0 2px'}}/>
          <input type="date" value={start} onChange={e=>setStart(e.target.value)}
            style={{fontSize:12,padding:'3px 6px',border:'1px solid #e5e7eb',borderRadius:5,width:120,background:'#fff'}}/>
          <span style={{color:'#9ca3af',fontSize:12}}>–</span>
          <input type="date" value={end} onChange={e=>setEnd(e.target.value)}
            style={{fontSize:12,padding:'3px 6px',border:'1px solid #e5e7eb',borderRadius:5,width:120,background:'#fff'}}/>
          <button onClick={()=>load()}
            style={{fontSize:12,padding:'4px 12px',borderRadius:6,border:'none',cursor:'pointer',
              background:'#111827',color:'#fff',fontWeight:600}}>Apply</button>
        </div>
      </div>

      {loading ? <div style={{display:'flex',justifyContent:'center',padding:60}}><Spinner size={28}/></div> : rows.length === 0 ? (
        <div style={{textAlign:'center', padding:60, color:'#9ca3af'}}>ไม่มีข้อมูลในช่วงเวลานี้</div>
      ) : (<>

        {/* ── Horizontal Bar Chart ─────────────────────────────────────── */}
        <div className="card" style={{padding:'20px 24px', marginBottom:20}}>
          <div style={{fontWeight:700, fontSize:14, color:'#111827', marginBottom:4}}>Revenue per Sales Rep / ยอดขายต่อเซลล์ (บาท)</div>
          <div style={{fontSize:12, color:'#9ca3af', marginBottom:16}}>เรียงตามยอดขายสูง-ต่ำ</div>
          {rows.map((row, i) => {
            const color = REP_COLORS[i % REP_COLORS.length];
            const pct   = maxRev > 0 ? row.revenue / maxRev * 100 : 0;
            return (
              <div key={row.owner} style={{display:'flex', alignItems:'center', gap:12, marginBottom:10}}>
                <div style={{width:90, textAlign:'right', fontSize:13, color:'#374151', fontWeight:500, flexShrink:0}}>{row.owner}</div>
                <div style={{flex:1, height:26, background:'#f3f4f6', borderRadius:4, overflow:'hidden'}}>
                  <div style={{width:pct+'%', height:'100%', background:color, borderRadius:4, transition:'width .5s'}}/>
                </div>
                <div style={{width:100, fontSize:12, fontWeight:600, color:'#111827', flexShrink:0}}>{fmtTHB(row.revenue)}</div>
              </div>
            );
          })}
          {/* X-axis labels */}
          <div style={{display:'flex', justifyContent:'space-between', marginLeft:102, marginTop:6}}>
            {[0,1,2,3,4].map(i => {
              const val = Math.round(maxRev / 4 * i);
              return <span key={i} style={{fontSize:10, color:'#9ca3af'}}>{'฿'+val.toLocaleString('th-TH')}</span>;
            })}
          </div>
        </div>

        {/* ── Performance Summary Table ─────────────────────────────────── */}
        <div className="card" style={{padding:0, overflow:'hidden'}}>
          <div style={{padding:'16px 20px', borderBottom:'1px solid #e5e7eb'}}>
            <div style={{fontWeight:700, fontSize:14, color:'#111827'}}>Owner Performance Summary / ตารางสรุปผลเซลล์</div>
            <div style={{fontSize:12, color:'#9ca3af', marginTop:2}}>รายละเอียดยอดขาย จำนวนสั่งซื้อ และลูกค้า · คลิกแถวเพื่อดู account</div>
          </div>
          <table style={{width:'100%', borderCollapse:'collapse'}}>
            <thead>
              <tr style={{background:'#111827'}}>
                {['#','OWNER','REVENUE / ยอดขาย','% SHARE','VOLUME / QTY (KG)','ORDERS / ออเดอร์','ACCOUNTS / ลูกค้า','AVG/ORDER'].map(h => (
                  <th key={h} style={{padding:'10px 14px', fontSize:11, fontWeight:600, color:'#9ca3af',
                    textAlign: h==='#'||h==='OWNER' ? 'left':'right', whiteSpace:'nowrap', letterSpacing:'.04em'}}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {rows.map((row, i) => {
                const color  = REP_COLORS[i % REP_COLORS.length];
                const isOpen = expandedOwner === row.owner;
                const barPct = maxRev > 0 ? row.revenue / maxRev * 100 : 0;
                return (<React.Fragment key={row.owner}>
                  <tr onClick={() => toggleOwner(row.owner)}
                    style={{borderBottom: isOpen?'none':'1px solid #f3f4f6', cursor:'pointer',
                      background: isOpen?'#f0f9ff':'transparent'}}
                    onMouseEnter={e=>{if(!isOpen)e.currentTarget.style.background='#f9fafb';}}
                    onMouseLeave={e=>{if(!isOpen)e.currentTarget.style.background='transparent';}}>
                    <td style={{padding:'12px 14px', fontSize:13, color:'#9ca3af', fontWeight:600}}>{i+1}</td>
                    <td style={{padding:'12px 14px'}}>
                      <span style={{background:color+'22', color, border:`1px solid ${color}55`,
                        borderRadius:6, padding:'3px 10px', fontSize:12, fontWeight:600}}>
                        {isOpen ? '▾ ' : ''}{row.owner}
                      </span>
                    </td>
                    <td style={{padding:'12px 14px', textAlign:'right'}}>
                      <div style={{display:'flex', alignItems:'center', justifyContent:'flex-end', gap:8}}>
                        <div style={{width:70, height:5, background:'#f3f4f6', borderRadius:3, flexShrink:0}}>
                          <div style={{width:barPct+'%', height:'100%', background:color, borderRadius:3}}/>
                        </div>
                        <span style={{fontSize:13, fontWeight:700, color:'#111827'}}>{fmtTHB(row.revenue)}</span>
                      </div>
                    </td>
                    <td style={{padding:'12px 14px', fontSize:13, textAlign:'right', color:'#374151'}}>{row.share}%</td>
                    <td style={{padding:'12px 14px', fontSize:13, textAlign:'right', color:'#374151'}}>{fmtKg(row.volume)}</td>
                    <td style={{padding:'12px 14px', fontSize:13, textAlign:'right', color:'#374151'}}>{fmtN(row.orders)}</td>
                    <td style={{padding:'12px 14px', fontSize:13, textAlign:'right', color:'#374151'}}>{row.accounts}</td>
                    <td style={{padding:'12px 14px', fontSize:13, textAlign:'right', color:'#374151', fontWeight:500}}>{fmtTHB(row.avg_order)}</td>
                  </tr>
                  {isOpen && (
                    <tr>
                      <td colSpan={8} style={{padding:0, background:'#f0f9ff', borderBottom:'1px solid #e5e7eb'}}>
                        {acctLoading
                          ? <div style={{display:'flex',justifyContent:'center',padding:20}}><Spinner/></div>
                          : ownerAccounts.length === 0
                            ? <div style={{padding:'14px 24px', fontSize:13, color:'#9ca3af'}}>ไม่มีข้อมูล account</div>
                            : <table style={{width:'100%', borderCollapse:'collapse'}}>
                                <thead>
                                  <tr style={{background:'#e0f2fe'}}>
                                    {['Account','Outlets','Revenue','Volume (KG)','Orders','Avg/Order'].map(h=>(
                                      <th key={h} style={{padding:'7px 16px', fontSize:11, fontWeight:600, color:'#0369a1',
                                        textAlign: h==='Account'?'left':'right'}}>{h}</th>
                                    ))}
                                  </tr>
                                </thead>
                                <tbody>
                                  {ownerAccounts.map(a => (
                                    <tr key={a.account_id} style={{borderBottom:'1px solid #e0f2fe'}}>
                                      <td style={{padding:'8px 16px', fontSize:13, fontWeight:500, color:'#111827'}}>{a.account_name}</td>
                                      <td style={{padding:'8px 16px', fontSize:13, textAlign:'right', color:'#374151'}}>{a.outlet_count}</td>
                                      <td style={{padding:'8px 16px', fontSize:13, textAlign:'right', fontWeight:600, color:'#111827'}}>{fmtTHB(a.revenue)}</td>
                                      <td style={{padding:'8px 16px', fontSize:13, textAlign:'right', color:'#374151'}}>{fmtKg(a.volume)}</td>
                                      <td style={{padding:'8px 16px', fontSize:13, textAlign:'right', color:'#374151'}}>{fmtN(a.orders)}</td>
                                      <td style={{padding:'8px 16px', fontSize:13, textAlign:'right', color:'#374151'}}>{fmtTHB(a.avg_order)}</td>
                                    </tr>
                                  ))}
                                </tbody>
                              </table>
                        }
                      </td>
                    </tr>
                  )}
                </React.Fragment>);
              })}
            </tbody>
          </table>
          {/* Footer total */}
          <div style={{padding:'12px 14px', background:'#f9fafb', borderTop:'2px solid #e5e7eb',
            display:'flex', justifyContent:'flex-end', gap:8, fontSize:13, fontWeight:700, color:'#111827'}}>
            <span>Total:</span>
            <span>{fmtTHB(data?.total_revenue||0)}</span>
          </div>
        </div>
      </>)}
    </div>
  );
}

// ── App ───────────────────────────────────────────────────────────────────────
function App() {
  const [user, setUser] = useState(null);
  const [checking, setChecking] = useState(true);
  const [moduleChoice, setModuleChoice] = useState(null); // 'leads' | 'cases'
  const [page, setPage] = useState('tickets');
  const [selectedTicket, setSelectedTicket] = useState(null);
  const [creating, setCreating] = useState(false);

  // ── Notification state ──────────────────────────────────────────────────────
  const [myTeamCount, setMyTeamCount] = useState(0);
  const [myTeamUnread, setMyTeamUnread] = useState(0);
  const [toasts, setToasts] = useState([]);
  const knownCaseIds = useRef(null); // null = not initialised yet
  const knownDisputeLogIds = useRef(null);
  const toastCounter = useRef(0);

  const removeToast = (tid) => setToasts(prev => prev.filter(t => t.id !== tid));

  // Poll for new team cases every 30 s
  useEffect(() => {
    if (!user || !user.team) return;

    // Request browser notification permission once
    if ('Notification' in window && Notification.permission === 'default') {
      Notification.requestPermission();
    }

    const poll = async () => {
      try {
        const data = await api('/api/my-team/active');
        if (!data || !Array.isArray(data.cases)) return;

        setMyTeamCount(data.count || 0);
        const currentIds = new Set(data.cases.map(c => c.id));

        if (knownCaseIds.current === null) {
          // First poll — just record IDs, no notification
          knownCaseIds.current = currentIds;
          return;
        }

        const newCases = data.cases.filter(c => !knownCaseIds.current.has(c.id));
        knownCaseIds.current = currentIds;

        newCases.slice(0, 3).forEach(c => {
          const tid = ++toastCounter.current;
          const body = `${c.case_type}${c.outlet_name ? ' — ' + c.outlet_name : ''}`;

          // In-app toast
          setToasts(prev => [...prev, { id: tid, body, caseId: c.id, ticket_no: c.ticket_no }]);
          setTimeout(() => removeToast(tid), 8000);

          // Browser push notification
          if ('Notification' in window && Notification.permission === 'granted') {
            const n = new Notification(`🔔 New case for team ${user.team}`, {
              body, tag: String(c.id),
            });
            n.onclick = () => { window.focus(); setSelectedTicket(c.id); setPage('tickets'); n.close(); };
          }
        });

        // Dispute notifications (CX only)
        const disputed = data.disputed_cases || [];
        const disputedLogIds = new Set(disputed.map(d => d.log_id));
        if (knownDisputeLogIds.current === null) {
          knownDisputeLogIds.current = disputedLogIds;
        } else {
          const newDisputes = disputed.filter(d => !knownDisputeLogIds.current.has(d.log_id));
          knownDisputeLogIds.current = disputedLogIds;
          newDisputes.slice(0, 3).forEach(d => {
            const tid = ++toastCounter.current;
            const body = `Team ${d.from_team} disputed — ${d.outlet_name || d.case_type}`;
            setToasts(prev => [...prev, { id: tid, body, caseId: d.ticket_id, ticket_no: d.ticket_no, isDispute: true }]);
            setTimeout(() => removeToast(tid), 10000);
            if ('Notification' in window && Notification.permission === 'granted') {
              const n = new Notification(`🔄 Responsibility Disputed`, { body, tag: 'dispute-' + d.log_id });
              n.onclick = () => { window.focus(); setSelectedTicket(d.ticket_id); setPage('tickets'); n.close(); };
            }
          });
        }
      } catch(_) { /* silent fail */ }
    };

    poll();
    const iv = setInterval(poll, 30000);
    return () => clearInterval(iv);
  }, [user]);

  useEffect(() => {
    const token = getToken();
    if (!token) { setChecking(false); return; }
    api('/api/auth/me').then(d => {
      if (d && d.id) {
        setUser(d);
        const saved = localStorage.getItem('crm_module_choice');
        if (saved) {
          setModuleChoice(saved);
          setPage(saved === 'leads' ? 'leads' : 'tickets');
        }
      } else clearToken();
      setChecking(false);
    }).catch(() => { clearToken(); setChecking(false); });
  }, []);

  const logout = () => {
    clearToken(); setUser(null); setModuleChoice(null); setPage('tickets');
  };

  const handleLogin = (u) => {
    setUser(u);
    const saved = localStorage.getItem('crm_module_choice');
    if (saved) {
      setModuleChoice(saved);
      setPage(saved === 'leads' ? 'leads' : 'tickets');
    }
  };

  const chooseModule = (m) => {
    localStorage.setItem('crm_module_choice', m);
    setModuleChoice(m);
    setPage(m === 'leads' ? 'leads' : 'tickets');
  };

  const switchToOther = () => {
    const other = moduleChoice === 'leads' ? 'cases' : 'leads';
    localStorage.setItem('crm_module_choice', other);
    setModuleChoice(other);
    setPage(other === 'leads' ? 'leads' : 'tickets');
    setSelectedTicket(null); setCreating(false);
  };

  if (checking) return <div className="min-h-screen flex items-center justify-center text-gray-400"><Spinner/></div>;
  if (!user) return <Login onLogin={handleLogin}/>;
  if (!moduleChoice) return <LandingPage user={user} onChoose={chooseModule} onLogout={logout}/>;

  const navItems = moduleChoice === 'leads'
    ? [
        { id:'leads', label:'Leads', icon:'trending-up' },
        { id:'sales-dashboard', label:'Dashboard', icon:'grid' },
        { id:'revenue', label:'Revenue', icon:'bar-chart-2' },
      ]
    : [
        { id:'dashboard', label:'Dashboard', icon:'grid' },
        { id:'tickets', label:'Cases', icon:'file-text' },
        { id:'accounts', label:'Account', icon:'building' },
        { id:'suppliers', label:'Supplier', icon:'factory' },
        { id:'employees', label:'Employees', icon:'hard-hat' },
        ...(user.role === 'admin' ? [{ id:'users', label:'Users', icon:'users' }] : []),
      ];

  const renderPage = () => {
    if (selectedTicket) return <TicketDetail ticketId={selectedTicket} user={user} onBack={()=>setSelectedTicket(null)}/>;
    if (creating) return <CreateTicket user={user} onCreated={id=>{ setCreating(false); setSelectedTicket(id); }}/>;
    switch(page) {
      case 'dashboard': return <Dashboard/>;
      case 'sales-dashboard': return <SalesDashboard user={user}/>;
      case 'revenue': return <RevenueBoard user={user}/>;
      case 'leads': return <PipelineErrorBoundary><Pipeline user={user}/></PipelineErrorBoundary>;
      case 'tickets': return <TicketList user={user} onSelect={id=>setSelectedTicket(id)} onUnreadCount={setMyTeamUnread}/>;
      case 'accounts': return <Accounts onSelectTicket={id=>setSelectedTicket(id)}/>;
      case 'suppliers': return <SimpleList title="🏭 Supplier" endpoint="/api/suppliers" columns={[{key:'name',label:'Name'},{key:'supplier_type',label:'Type'},{key:'contact_person',label:'Contact'},{key:'phone',label:'Phone'}]}/>;
      case 'employees': return <Employees/>;
      case 'import': return <ImportERP/>;
      case 'users': return <Users currentUser={user}/>;
      default: return moduleChoice === 'leads'
        ? <PipelineErrorBoundary><Pipeline user={user}/></PipelineErrorBoundary>
        : <TicketList user={user} onSelect={id=>setSelectedTicket(id)} onUnreadCount={setMyTeamUnread}/>;
    }
  };

  return (
    <div style={{display:'flex',height:'100vh',overflow:'hidden'}}>
      {/* Sidebar */}
      <div className="sidebar">
        <div className="sidebar-brand">
          <div className="sidebar-logo">SMM</div>
          <div>
            <div className="sidebar-title">SMM CRM</div>
            <div className="sidebar-subtitle">Sales Operations</div>
          </div>
        </div>

        <div className="sidebar-nav">
          <div className="sidebar-section-label">Navigation</div>
          {navItems.map(n => (
            <button key={n.id} className={'nav-btn'+(page===n.id&&!selectedTicket&&!creating?' active':'')}
              onClick={()=>{ setPage(n.id); setSelectedTicket(null); setCreating(false); }}>
              <Icon name={n.icon} size={15}/>
              {n.label}
              {n.id === 'tickets' && myTeamUnread > 0 && (
                <span style={{
                  marginLeft:'auto', background:'#2563eb', color:'#fff',
                  fontSize:10, fontWeight:700, borderRadius:10,
                  padding:'1px 7px', minWidth:18, textAlign:'center', lineHeight:'16px',
                }} title={`${myTeamUnread} unread cases`}>{myTeamUnread > 99 ? '99+' : myTeamUnread}</span>
              )}
            </button>
          ))}
          {moduleChoice === 'cases' && (
            <>
              <div className="sidebar-section-label" style={{marginTop:8}}>Actions</div>
              <button className="nav-btn" onClick={()=>{ setCreating(true); setSelectedTicket(null); setPage('tickets'); }}>
                <Icon name="plus" size={15}/>
                New Case
              </button>
            </>
          )}
          <div style={{borderTop:'1px solid var(--sidebar-border)',marginTop:10,paddingTop:6}}>
            <button className="nav-btn" onClick={switchToOther} style={{color:'var(--text-muted)',fontSize:12}}>
              <Icon name={moduleChoice==='leads'?'file-text':'trending-up'} size={14}/>
              Switch to {moduleChoice==='leads'?'Cases':'Leads'}
            </button>
          </div>
        </div>

        <div className="sidebar-footer">
          <div className="sidebar-avatar">
            {user.display_name ? user.display_name.substring(0,2).toUpperCase() : (user.username||'U').substring(0,2).toUpperCase()}
          </div>
          <div style={{flex:1,minWidth:0}}>
            <div className="sidebar-user-name">{user.display_name || user.username}</div>
            <div className="sidebar-user-role">{user.role} {user.team ? '· '+user.team : ''}</div>
          </div>
          <button className="sidebar-logout-btn" onClick={logout} title="Sign out">
            <Icon name="log-out" size={14}/>
          </button>
        </div>
      </div>

      {/* Main */}
      <div style={{flex:1,overflow:'auto',background:'#f9fafb'}}>
        {renderPage()}
      </div>

      {/* Toast container — top-right fixed */}
      {toasts.length > 0 && (
        <div style={{position:'fixed',top:16,right:16,zIndex:9999,display:'flex',flexDirection:'column',gap:8,maxWidth:320}}>
          {toasts.map(t => (
            <div key={t.id} className="toast-item" style={{
              background: t.isDispute ? '#7f1d1d' : '#111827', color:'#fff', borderRadius:10,
              boxShadow:'0 4px 16px rgba(0,0,0,0.25)',
              display:'flex', alignItems:'flex-start', gap:10, padding:'12px 14px',
            }}>
              <span style={{fontSize:18,flexShrink:0}}>{t.isDispute ? '🔄' : '🔔'}</span>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:12,fontWeight:700,marginBottom:2}}>
                  {t.isDispute ? 'Responsibility Disputed' : `New case for team ${user.team}`}
                </div>
                <div style={{fontSize:11,color:'#9ca3af',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
                  {t.ticket_no} · {t.body}
                </div>
              </div>
              <div style={{display:'flex',flexDirection:'column',gap:4,flexShrink:0}}>
                <button onClick={()=>{ setSelectedTicket(t.caseId); setPage('tickets'); removeToast(t.id); }}
                  style={{fontSize:11,color:'#60a5fa',background:'none',border:'none',cursor:'pointer',padding:0,textAlign:'right'}}>
                  View case →
                </button>
                <button onClick={()=>removeToast(t.id)}
                  style={{fontSize:12,color:'#6b7280',background:'none',border:'none',cursor:'pointer',padding:0,textAlign:'right'}}>
                  ✕
                </button>
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
