        <span className="text-gray-700 font-medium">{selectedAccount.name}</span>
        {selectedAccount.owner && <span className="text-gray-400 text-xs ml-1">({selectedAccount.owner})</span>}
      </div>

      {loadingOutlets ? <div className="text-center py-6 text-gray-400"><Spinner/></div> : (
        outlets.length === 0
          ? <div className="text-center py-10 text-gray-400">No outlets</div>
          : <div className="space-y-2">
              {outlets.map(o => (
                <div key={o.id} className="card p-4 cursor-pointer hover:shadow-md transition-shadow flex items-center justify-between"
                  onClick={()=>openOutlet(o)}>
                  <div>
                    <p className="font-medium text-gray-800">🏪 {o.name}</p>
                    <div className="flex gap-3 mt-1 text-xs text-gray-400">
                      {o.csc_code && <span>CSC: {o.csc_code}</span>}
                      {o.erp_customer_id && <span>ERP: {o.erp_customer_id}</span>}
                    </div>
                  </div>
                  <div className="flex items-center gap-3">
                    {(o.open_tickets > 0)
                      ? <span className="text-xs bg-red-100 text-red-600 px-2 py-1 rounded-full font-semibold">🎫 {o.open_tickets} open cases</span>
                      : <span className="text-xs text-gray-300">No open cases</span>
                    }
                    <span className="text-gray-300">›</span>
                  </div>
                </div>
              ))}
            </div>
      )}
    </div>
  );

  // Level 1: Account list
  return (
    <div className="p-6">
      <h2 className="text-xl font-bold mb-4" style={{color:'var(--primary)'}}>👤 Account</h2>
      {accounts.length === 0
        ? <div className="text-center py-10 text-gray-400">No data yet — import ERP first</div>
        : <div className="space-y-2">
            {accounts.map(a => (
              <div key={a.id} className="card p-4 cursor-pointer hover:shadow-md transition-shadow flex items-center justify-between"
                onClick={()=>openAccount(a)}>
                <div>
                  <p className="font-medium text-gray-800">{a.name}</p>
                  {a.owner && <p className="text-xs text-gray-400 mt-0.5">{a.owner}</p>}
                </div>
                <div className="flex items-center gap-3 text-sm">
                  <span className="text-gray-400">{a.outlet_count || 0} outlet</span>
                  {(a.open_tickets > 0) &&
                    <span className="text-xs bg-red-100 text-red-600 px-2 py-1 rounded-full font-semibold">🎫 {a.open_tickets} cases</span>
                  }
                  <span className="text-gray-300">›</span>
                </div>
              </div>
            ))}
          </div>
      }
    </div>
  );
}

// ── ImportERP ─────────────────────────────────────────────────────────────────
function ImportERP() {
  const [file, setFile] = useState(null);
  const [uploading, setUploading] = useState(false);
  const [result, setResult] = useState(null);
  const [err, setErr] = useState('');
  const ref = useRef();

  const submit = async e => {
    e.preventDefault();
    if (!file) return;
    setUploading(true); setResult(null); setErr('');
    const fd = new FormData();
    fd.append('file', file);
    const res = await apiUpload('/api/import/erp', fd);
    setUploading(false);
    if (res && res.inserted !== undefined) setResult(res);
    else setErr(res?.error || 'An error occurred');
  };

  return (
    <div className="p-6 max-w-xl">
      <h2 className="text-xl font-bold mb-5" style={{color:'var(--primary)'}}>📥 Import ERP</h2>
      <div className="card p-5">
        <form onSubmit={submit} className="space-y-4">
          <div>
            <label className="text-sm font-medium text-gray-700 block mb-1">Select Excel file (.xlsx)</label>
            <input ref={ref} type="file" accept=".xlsx,.xls"
              onChange={e=>{ setFile(e.target.files[0]); setResult(null); setErr(''); }}/>
          </div>
          {err && <div className="text-red-600 text-sm bg-red-50 p-3 rounded">{err}</div>}
          {result && (
            <div className="bg-green-50 border border-green-200 rounded-lg p-4 text-sm space-y-1">
              <p className="font-semibold text-green-700">✅ Import successful</p>
              <p>Total rows: <strong>{result.total_rows}</strong></p>
              <p>Inserted: <strong>{result.inserted}</strong></p>
              <p>Duplicates (skipped): <strong>{result.skipped}</strong></p>
              {result.errors > 0 && <p className="text-orange-600">Errors: {result.errors} rows</p>}
            </div>
          )}
          <button type="submit" className="btn btn-primary w-full" disabled={uploading || !file}>
            {uploading ? <><Spinner/> Importing...</> : '📤 Import'}
          </button>
        </form>
      </div>
      <div className="card p-4 mt-4 text-sm text-gray-500">
        <p className="font-medium text-gray-700 mb-2">Required columns:</p>
        <ul className="space-y-1 list-disc list-inside">
          <li>order_item_id, order_id, invoice_number</li>
          <li>doc_date, account_name, outlet_name</li>
          <li>sku_code, product_name, qty, unit, unit_price, total_sales</li>
        </ul>
      </div>
    </div>
  );
}

function SimpleList({ title, endpoint, columns }) {

  useEffect(() => {
    api(endpoint).then(d => { setData(d || []); setLoading(false); });
  }, [endpoint]);

  return (
    <div className="p-6">
      <h2 className="text-xl font-bold mb-4" style={{color:'var(--primary)'}}>{title}</h2>

        data.length === 0 ? <p className="text-gray-400">No data</p> : (
          <div className="card overflow-auto">
            <table className="w-full text-sm">
              <thead className="bg-gray-50 text-gray-600">

// ── Employees ─────────────────────────────────────────────────────────────────
function Employees() {
  const EMPTY = { name:'', employee_code:'', department:'', team:'CX', role:'', phone:'', email:'', status:'active' };
  const [data, setData] = useState([]);
  const [loading, setLoading] = useState(true);
  const [form, setForm] = useState(EMPTY);
  const [editId, setEditId] = useState(null);
  const [saving, setSaving] = useState(false);
  const [msg, setMsg] = useState('');

  const load = () => {
    setLoading(true);
    api('/api/employees').then(d => { setData(d || []); setLoading(false); });
  };
  useEffect(() => { load(); }, []);

  const set = (k, v) => setForm(f => ({ ...f, [k]: v }));

  const save = async e => {
    e.preventDefault();
    if (!form.name.trim()) return setMsg('กรุณาใส่ชื่อ');
    setSaving(true); setMsg('');
    const method = editId ? 'PUT' : 'POST';
    const path = editId ? `/api/employees/${editId}` : '/api/employees';
    const res = await api(path, { method, body: JSON.stringify(form) });
    setSaving(false);
    if (res && (res.id || res.ok)) { setForm(EMPTY); setEditId(null); load(); }
    else setMsg(res?.error || 'เกิดข้อผิดพลาด');
  };

  const startEdit = emp => {
    setEditId(emp.id);
    setForm({ name: emp.name||'', employee_code: emp.employee_code||'', department: emp.department||'',
      team: emp.team||'CX', role: emp.role||'', phone: emp.phone||'', email: emp.email||'', status: emp.status||'active' });

    <div className="p-6 max-w-4xl">
      <h2 className="text-xl font-bold mb-5" style={{color:'var(--primary)'}}>👷 Employees</h2>

      <div className="card p-5 mb-5">

          <div>
            <label className="text-sm font-medium text-gray-700 block mb-1">Employee Code</label>
            <input value={form.employee_code} onChange={e=>set('employee_code',e.target.value)} placeholder="รหัสพนักงาน"/>
          </div>
          <div>
            <label className="text-sm font-medium text-gray-700 block mb-1">Team *</label>
            <select value={form.team} onChange={e=>set('team',e.target.value)}>
              {TEAMS.map(t=><option key={t} value={t}>{t}</option>)}
            </select>
          </div>
          <div>
            <label className="text-sm font-medium text-gray-700 block mb-1">Position / Role</label>
            <input value={form.role} onChange={e=>set('role',e.target.value)} placeholder="เช่น Supervisor, Staff"/>
          </div>
          <div>
            <label className="text-sm font-medium text-gray-700 block mb-1">Department</label>
            <input value={form.department} onChange={e=>set('department',e.target.value)} placeholder="แผนก"/>
          </div>
          <div>
            <label className="text-sm font-medium text-gray-700 block mb-1">Phone</label>
            <input value={form.phone} onChange={e=>set('phone',e.target.value)} placeholder="เบอร์โทร"/>
          </div>
          <div>
            <label className="text-sm font-medium text-gray-700 block mb-1">Email</label>
            <input type="email" value={form.email} onChange={e=>set('email',e.target.value)} placeholder="email@example.com"/>
          </div>
          <div>
            <label className="text-sm font-medium text-gray-700 block mb-1">Status</label>

          {msg && <div className="col-span-2 text-red-600 text-sm">{msg}</div>}

// ── App ───────────────────────────────────────────────────────────────────────
function App() {
  const [user, setUser] = useState(null);
  const [checking, setChecking] = useState(true);
  const [page, setPage] = useState('tickets');
  const [selectedTicket, setSelectedTicket] = useState(null);
  const [creating, setCreating] = useState(false);

  useEffect(() => {
    const token = getToken();
    if (!token) { setChecking(false); return; }
    api('/api/auth/me').then(d => {
      if (d && d.id) setUser(d);
      else clearToken();
      setChecking(false);
    }).catch(() => { clearToken(); setChecking(false); });
  }, []);

  const logout = () => { clearToken(); setUser(null); setPage('tickets'); };

  if (checking) return <div className="min-h-screen flex items-center justify-center text-gray-400"><Spinner/></div>;
  if (!user) return <Login onLogin={u => setUser(u)}/>;

  const navItems = [
    { id:'dashboard', label:'Dashboard', icon:'📊' },
    { id:'tickets', label:'Cases', icon:'🎫' },
    { id:'accounts', label:'Account', icon:'👤' },
    { id:'suppliers', label:'Supplier', icon:'🏭' },
    { id:'employees', label:'Employees', icon:'👷' },
    { id:'import', label:'Import ERP', icon:'📥' },
    ...(user.role === 'admin' ? [{ id:'users', label:'Users', icon:'👥' }] : []),
  ];

  const renderPage = () => {
    if (selectedTicket) return <TicketDetail ticketId={selectedTicket} user={user} onBack={()=>setSelectedTicket(null)}/>;
    if (creating) return <CreateTicket user={user} onCreated={id=>{ setCreating(false); setSelectedTicket(id); }}/>;
    switch(page) {
      case 'dashboard': return <Dashboard/>;
      case 'tickets': return <TicketList user={user} onSelect={id=>setSelectedTicket(id)}/>;
      case 'accounts': return <Accounts onSelectTicket={id=>setSelectedTicket(id)}/>;
      case 'suppliers': return <SimpleList title="🏭 Supplier" endpoint="/api/suppliers" columns={[{key:'name',label:'Name'},{key:'supplier_type',label:'Type'},{key:'contact_person',label:'Contact'},{key:'phone',label:'Phone'}]}/>;
      case 'employees': return <Employees/>;
      case 'import': return <ImportERP/>;
      case 'users': return <Users currentUser={user}/>;
      default: return <TicketList user={user} onSelect={id=>setSelectedTicket(id)}/>;
    }
  };

  return (
    <div className="flex min-h-screen">
      {/* Sidebar */}
      <div className="sidebar flex flex-col py-4 px-2">
        <div className="px-3 mb-6">
          <div className="text-white font-bold text-lg">📋 SMM CRM</div>
          <div className="text-teal-300 text-xs mt-0.5">{TEAM_ICONS[user.team]||''} {user.display_name} · {user.team}</div>
        </div>

        <nav className="flex-1 space-y-1">
          {navItems.map(n => (
            <a key={n.id} className={page===n.id&&!selectedTicket&&!creating?'active':''} onClick={()=>{ setPage(n.id); setSelectedTicket(null); setCreating(false); }}>
              {n.icon} {n.label}
            </a>
          ))}
        </nav>

        <div className="mt-4 px-1 space-y-1">
          <a onClick={()=>{ setCreating(true); setSelectedTicket(null); setPage('tickets'); }} className="cursor-pointer" style={{background:'rgba(255,255,255,0.1)'}}>
            ➕ New Case
          </a>
          <a onClick={logout} style={{color:'#f87171'}}>🚪 Sign Out</a>
        </div>
      </div>

      {/* Main */}
      <div className="flex-1 overflow-auto">
        {renderPage()}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
