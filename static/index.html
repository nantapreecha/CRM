<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>SMM Sourcing CRM</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root { --primary: #0F4C45; --primary-light: #1a6b62; --primary-bg: #e8f5f3; }
  body { font-family: 'Segoe UI', sans-serif; background: #f5f7fa; }
  .sidebar { background: var(--primary); min-height: 100vh; width: 220px; }
  .sidebar a { color: #c8e6e3; transition: all .2s; }
  .sidebar a:hover, .sidebar a.active { background: var(--primary-light); color: #fff; }
  .badge { background:#ef4444; color:#fff; border-radius:9999px; padding:1px 7px; font-size:11px; }
  .btn-primary { background: var(--primary); color:#fff; }
  .btn-primary:hover { background: var(--primary-light); }
  .card { background:#fff; border-radius:12px; box-shadow:0 1px 4px rgba(0,0,0,.08); }
  .status-open { color:#2563eb; background:#eff6ff; }
  .status-in_progress { color:#d97706; background:#fffbeb; }
  .status-resolved { color:#16a34a; background:#f0fdf4; }
  .status-closed { color:#6b7280; background:#f9fafb; }
  .priority-Urgent { color:#dc2626; }
  .priority-High { color:#ea580c; }
  .priority-Medium { color:#d97706; }
  .priority-Low { color:#16a34a; }
  input, select, textarea { border:1px solid #d1d5db; border-radius:6px; padding:6px 10px; width:100%; outline:none; }
  input:focus, select:focus, textarea:focus { border-color:var(--primary); box-shadow:0 0 0 2px rgba(15,76,69,.15); }
  .tab { padding:8px 16px; cursor:pointer; border-bottom:2px solid transparent; color:#6b7280; }
  .tab.active { color:var(--primary); border-color:var(--primary); font-weight:600; }
  .star { color:#f59e0b; }
  .step-dot { width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:600; }
  .step-done { background:#dcfce7; color:#16a34a; border:2px solid #16a34a; }
  .step-active { background:var(--primary); color:#fff; }
  .step-pending { background:#f3f4f6; color:#9ca3af; border:2px solid #e5e7eb; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .spin { animation: spin 1s linear infinite; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;
const API = '';

// ── helpers ──────────────────────────────────────────────────────────────────
async function api(path, opts={}) {
  const res = await fetch(API + path, {
    headers: {'Content-Type':'application/json'},
    ...opts
  });
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

function fmt(v) {
  if (!v) return '—';
  const d = new Date(v);
  if (isNaN(d)) return v;
  return d.toLocaleDateString('th-TH', {day:'2-digit',month:'short',year:'numeric'});
}
function fmtDT(v) {
  if (!v) return '—';
  const d = new Date(v);
  if (isNaN(d)) return v;
  return d.toLocaleString('th-TH', {day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
}
function num(v) { return v == null ? '—' : Number(v).toLocaleString(); }
function money(v) { return v == null ? '—' : Number(v).toLocaleString('th-TH',{minimumFractionDigits:2}); }

const STATUS_LABELS = { open:'เปิด', in_progress:'กำลังดำเนินการ', resolved:'แก้ไขแล้ว', closed:'ปิดแล้ว' };
const TEAMS = ['CX','Sales Co','Merchandise','Inbound/QC','Outbound/Logistics','Management'];
const CASE_TYPES = ['Claim','น้ำหนักไม่ครบ','ตกหล่น','คุณภาพไม่ผ่าน/ผิดสเปค','Sales Co Error'];
const ROOT_CAUSES = ['สินค้าเสียหาย/คุณภาพไม่ผ่าน','ส่งผิด SKU/ผิดจำนวน','เอกสารผิดพลาด','ความล่าช้า','Supplier ผิดพลาด','Customer แจ้งผิด','ระบบ/IT','อื่นๆ'];
const FAULT_TEAMS = ['CX','Sales Co','Merchandise','Inbound/QC','Outbound/Logistics','Supplier','Management'];
const PRIORITIES = ['Urgent','High','Medium','Low'];

// ── Spinner ───────────────────────────────────────────────────────────────────
function Spinner() {
  return <div className="flex justify-center py-10"><div className="w-8 h-8 border-4 border-gray-200 border-t-green-700 rounded-full spin"/></div>;
}

// ── Modal ─────────────────────────────────────────────────────────────────────
function Modal({title, onClose, children, wide}) {
  return (
    <div className="fixed inset-0 bg-black/40 z-50 flex items-start justify-center pt-16 px-4" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className={`card p-6 w-full ${wide?'max-w-3xl':'max-w-lg'} max-h-[80vh] overflow-y-auto`}>
        <div className="flex justify-between items-center mb-4">
          <h2 className="font-bold text-lg" style={{color:'var(--primary)'}}>{title}</h2>
          <button onClick={onClose} className="text-gray-400 hover:text-gray-600 text-xl leading-none">×</button>
        </div>
        {children}
      </div>
    </div>
  );
}

// ── Stars ─────────────────────────────────────────────────────────────────────
function Stars({value, onChange}) {
  return <div className="flex gap-1">
    {[1,2,3,4,5].map(i=>(
      <span key={i} className={`cursor-pointer text-xl ${i<=value?'star':'text-gray-300'}`}
        onClick={()=>onChange&&onChange(i)}>★</span>
    ))}
  </div>;
}

// ── StatusBadge ───────────────────────────────────────────────────────────────
function StatusBadge({status}) {
  return <span className={`px-2 py-0.5 rounded text-xs font-medium status-${status}`}>{STATUS_LABELS[status]||status}</span>;
}

// ── PriorityBadge ─────────────────────────────────────────────────────────────
function PriorityBadge({priority}) {
  const icons = {Urgent:'🔴',High:'🟠',Medium:'🟡',Low:'🟢'};
  return <span className={`text-sm font-medium priority-${priority}`}>{icons[priority]||''} {priority}</span>;
}

// ── WorkflowTimeline ──────────────────────────────────────────────────────────
function WorkflowTimeline({caseType, currentStep, branch, workflows}) {
  const steps = workflows[caseType] || [];
  const effective = steps.filter(s => !s.branch || s.branch === branch || s.is_branch);
  return (
    <div className="flex items-center gap-1 flex-wrap">
      {effective.map((s,i)=>{
        const done = i < currentStep;
        const active = i === currentStep;
        return <React.Fragment key={i}>
          {i>0 && <div className="w-4 h-0.5 bg-gray-300"/>}
          <div className="flex flex-col items-center gap-1">
            <div className={`step-dot ${done?'step-done':active?'step-active':'step-pending'}`}>
              {done?'✓':i+1}
            </div>
            <div className="text-center" style={{fontSize:'10px',maxWidth:'60px',lineHeight:'1.2'}}>
              <div className="font-medium">{s.team}</div>
              <div className="text-gray-500">{s.label}</div>
            </div>
          </div>
        </React.Fragment>;
      })}
    </div>
  );
}

// ── DateRangeFilter ───────────────────────────────────────────────────────────
function DateRangeFilter({value, onChange}) {
  const [start, setStart] = useState(value?.start||'');
  const [end, setEnd] = useState(value?.end||'');
  function preset(days) {
    const e = new Date(); e.setHours(23,59,59);
    const s = new Date(); s.setDate(s.getDate()-days+1); s.setHours(0,0,0);
    const fmt = d => d.toISOString().slice(0,10);
    setStart(fmt(s)); setEnd(fmt(e));
    onChange({start:fmt(s), end:fmt(e)});
  }
  function presetMonth(offset=0) {
    const now = new Date();
    const y = now.getFullYear(), m = now.getMonth()+offset;
    const s = new Date(y,m,1), e = new Date(y,m+1,0);
    const fmt = d => d.toISOString().slice(0,10);
    setStart(fmt(s)); setEnd(fmt(e));
    onChange({start:fmt(s), end:fmt(e)});
  }
  function apply() { onChange({start,end}); }
  return (
    <div className="flex flex-wrap gap-2 items-center">
      {[['7 วัน',7],['14 วัน',14],['30 วัน',30],['90 วัน',90]].map(([l,d])=>(
        <button key={l} onClick={()=>preset(d)} className="px-3 py-1 rounded-full text-sm border border-gray-300 hover:border-green-700 hover:text-green-800">{l}</button>
      ))}
      <button onClick={()=>presetMonth(0)} className="px-3 py-1 rounded-full text-sm border border-gray-300 hover:border-green-700">เดือนนี้</button>
      <button onClick={()=>presetMonth(-1)} className="px-3 py-1 rounded-full text-sm border border-gray-300 hover:border-green-700">เดือนที่แล้ว</button>
      <div className="flex gap-1 items-center">
        <input type="date" value={start} onChange={e=>{setStart(e.target.value);}} style={{width:'130px'}}/>
        <span className="text-gray-500">–</span>
        <input type="date" value={end} onChange={e=>{setEnd(e.target.value);}} style={{width:'130px'}}/>
        <button onClick={apply} className="btn-primary px-3 py-1 rounded text-sm">ค้นหา</button>
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════════════════════════════════════
// DASHBOARD
// ══════════════════════════════════════════════════════════════════════════════
function Dashboard() {
  const [tab, setTab] = useState('overview');
  const [dr, setDr] = useState(()=>{
    const e=new Date(),s=new Date(); s.setDate(s.getDate()-6);
    return {start:s.toISOString().slice(0,10), end:e.toISOString().slice(0,10)};
  });
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(false);

  useEffect(() => {
    setLoading(true);
    setData(null);
    const qs = dr ? `?start=${dr.start}&end=${dr.end}` : '';
    const endpoints = {
      overview: `/api/dashboard/overview${qs}`,
      'sku-problems': `/api/dashboard/sku-problems${qs}`,
      'by-employee': `/api/dashboard/by-employee${qs}`,
      'by-customer': `/api/dashboard/by-customer${qs}`,
    };
    api(endpoints[tab]).then(d=>{ setData(d); setLoading(false); }).catch(()=>setLoading(false));
  }, [tab, dr]);

  const tabs = [['overview','ภาพรวมทีม'],['sku-problems','SKU ปัญหา'],['by-employee','รายพนักงาน'],['by-customer','รายลูกค้า']];

  return (
    <div>
      <h1 className="text-2xl font-bold mb-4" style={{color:'var(--primary)'}}>Dashboard — Team Efficiency</h1>
      <div className="card p-4 mb-4">
        <DateRangeFilter value={dr} onChange={setDr}/>
      </div>
      <div className="flex gap-4 mb-4 border-b">
        {tabs.map(([k,l])=>(
          <div key={k} className={`tab ${tab===k?'active':''}`} onClick={()=>setTab(k)}>{l}</div>
        ))}
      </div>
      {loading ? <Spinner/> : <DashboardTab tab={tab} data={data}/>}
    </div>
  );
}

function StatCard({label, value, sub}) {
  return (
    <div className="card p-4">
      <div className="text-sm text-gray-500 mb-1">{label}</div>
      <div className="text-3xl font-bold" style={{color:'var(--primary)'}}>{value}</div>
      {sub && <div className="text-xs text-gray-400 mt-1">{sub}</div>}
    </div>
  );
}

function BarChart({data, labelKey, valueKey, color='var(--primary)'}) {
  if (!data||!data.length) return <div className="text-gray-400 text-sm py-4 text-center">ไม่มีข้อมูล</div>;
  const max = Math.max(...data.map(d=>d[valueKey]||0));
  return (
    <div className="space-y-2">
      {data.map((d,i)=>(
        <div key={i} className="flex items-center gap-2">
          <div className="text-sm text-gray-600 w-32 truncate" title={d[labelKey]}>{d[labelKey]||'—'}</div>
          <div className="flex-1 bg-gray-100 rounded h-5 overflow-hidden">
            <div className="h-full rounded transition-all" style={{width:`${max?((d[valueKey]||0)/max*100):0}%`,background:color}}/>
          </div>
          <div className="text-sm font-medium w-8 text-right">{d[valueKey]||0}</div>
        </div>
      ))}
    </div>
  );
}

function DashboardTab({tab, data}) {
  if (!data) return null;
  if (tab==='overview') {
    const d = data;
    const statusMap = Object.fromEntries((d.by_status||[]).map(s=>[s.status,s.cnt]));
    return (
      <div className="space-y-4">
        <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
          <StatCard label="เคสทั้งหมด" value={d.total||0}/>
          <StatCard label="เปิดอยู่" value={statusMap.open||0}/>
          <StatCard label="กำลังดำเนินการ" value={statusMap.in_progress||0}/>
          <StatCard label="ปิดแล้ว" value={(statusMap.resolved||0)+(statusMap.closed||0)}/>
        </div>
        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div className="card p-4">
            <h3 className="font-semibold mb-3 text-gray-700">Case Type</h3>
            <BarChart data={d.by_case_type} labelKey="case_type" valueKey="cnt"/>
          </div>
          <div className="card p-4">
            <h3 className="font-semibold mb-3 text-gray-700">Fault Team</h3>
            <BarChart data={d.by_fault_team} labelKey="fault_team" valueKey="cnt" color="#ef4444"/>
          </div>
          <div className="card p-4">
            <h3 className="font-semibold mb-3 text-gray-700">Priority</h3>
            <BarChart data={d.by_priority} labelKey="priority" valueKey="cnt" color="#f59e0b"/>
          </div>
        </div>
      </div>
    );
  }
  if (tab==='sku-problems') {
    const rows1 = Array.isArray(data) ? data : [];
    return (
      <div className="card overflow-hidden">
        <table className="w-full text-sm">
          <thead><tr className="bg-gray-50 text-left">
            <th className="px-4 py-3 text-gray-600">SKU</th>
            <th className="px-4 py-3 text-gray-600">ชื่อสินค้า</th>
            <th className="px-4 py-3 text-gray-600 text-center">เคส</th>
            <th className="px-4 py-3 text-gray-600">Case Types</th>
            <th className="px-4 py-3 text-gray-600">Fault Teams</th>
          </tr></thead>
          <tbody>
            {rows1.map((r,i)=>(
              <tr key={i} className={i%2===0?'':'bg-gray-50'}>
                <td className="px-4 py-2 font-mono text-xs">{r.sku_code}</td>
                <td className="px-4 py-2">{r.product_name}</td>
                <td className="px-4 py-2 text-center font-bold text-red-600">{r.cnt}</td>
                <td className="px-4 py-2 text-xs text-gray-500">{r.case_types}</td>
                <td className="px-4 py-2 text-xs text-gray-500">{r.fault_teams}</td>
              </tr>
            ))}
          </tbody>
        </table>
        {(!data||!data.length)&&<div className="text-center py-8 text-gray-400">ไม่มีข้อมูล</div>}
      </div>
    );
  }
  if (tab==='by-employee') {
    return (
      <div className="card overflow-hidden">
        <table className="w-full text-sm">
          <thead><tr className="bg-gray-50 text-left">
            <th className="px-4 py-3 text-gray-600">พนักงาน</th>
            <th className="px-4 py-3 text-gray-600">ทีม</th>
            <th className="px-4 py-3 text-gray-600 text-center">เคส</th>
            <th className="px-4 py-3 text-gray-600 text-center">% ของทีม</th>
            <th className="px-4 py-3 text-gray-600">Case Types บ่อย</th>
          </tr></thead>
          <tbody>
            {(data||[]).map((r,i)=>(
              <tr key={i} className={i%2===0?'':'bg-gray-50'}>
                <td className="px-4 py-2 font-medium">{r.name}</td>
                <td className="px-4 py-2 text-gray-500">{r.team}</td>
                <td className="px-4 py-2 text-center font-bold">{r.cnt}</td>
                <td className="px-4 py-2 text-center">{r.pct}%</td>
                <td className="px-4 py-2 text-xs text-gray-500">{r.case_types||'—'}</td>
              </tr>
            ))}
          </tbody>
        </table>
        {(!data||!data.length)&&<div className="text-center py-8 text-gray-400">ไม่มีข้อมูล</div>}
      </div>
    );
  }
  if (tab==='by-customer') {
    return (
      <div className="card overflow-hidden">
        <table className="w-full text-sm">
          <thead><tr className="bg-gray-50 text-left">
            <th className="px-4 py-3 text-gray-600">Outlet</th>
            <th className="px-4 py-3 text-gray-600">Account</th>
            <th className="px-4 py-3 text-gray-600 text-center">เคส</th>
            <th className="px-4 py-3 text-gray-600">Case Types บ่อย</th>
          </tr></thead>
          <tbody>
            {(data||[]).map((r,i)=>(
              <tr key={i} className={i%2===0?'':'bg-gray-50'}>
                <td className="px-4 py-2 font-medium">{r.outlet_name}</td>
                <td className="px-4 py-2 text-gray-500">{r.account_name}</td>
                <td className="px-4 py-2 text-center font-bold">{r.cnt}</td>
                <td className="px-4 py-2 text-xs text-gray-500">{r.case_types||'—'}</td>
              </tr>
            ))}
          </tbody>
        </table>
        {(!data||!data.length)&&<div className="text-center py-8 text-gray-400">ไม่มีข้อมูล</div>}
      </div>
    );
  }
  return null;
}

// ══════════════════════════════════════════════════════════════════════════════
// ACCOUNTS
// ══════════════════════════════════════════════════════════════════════════════
function Accounts({onNavigate}) {
  const [accounts, setAccounts] = useState([]);
  const [loading, setLoading] = useState(true);
  const [showForm, setShowForm] = useState(false);
  const [form, setForm] = useState({name:'',owner:'',status:'active'});
  const [search, setSearch] = useState('');

  const load = () => api('/api/accounts').then(d=>{setAccounts(d);setLoading(false);});
  useEffect(()=>{load();},[]);

  const filtered = accounts.filter(a=>
    a.name.toLowerCase().includes(search.toLowerCase()) ||
    (a.owner||'').toLowerCase().includes(search.toLowerCase())
  );

  async function submit(e) {
    e.preventDefault();
    await api('/api/accounts', {method:'POST', body:JSON.stringify(form)});
    setShowForm(false); setForm({name:'',owner:'',status:'active'}); load();
  }

  return (
    <div>
      <div className="flex justify-between items-center mb-4">
        <h1 className="text-2xl font-bold" style={{color:'var(--primary)'}}>Accounts</h1>
        <button onClick={()=>setShowForm(true)} className="btn-primary px-4 py-2 rounded-lg text-sm font-medium">+ เพิ่ม Account</button>
      </div>
      <div className="card p-4 mb-4">
        <input placeholder="ค้นหา Account หรือ Owner..." value={search} onChange={e=>setSearch(e.target.value)}/>
      </div>
      {loading ? <Spinner/> : (
        <div className="card overflow-hidden">
          <table className="w-full text-sm">
            <thead><tr className="bg-gray-50 text-left">
              <th className="px-4 py-3 text-gray-600">Account</th>
              <th className="px-4 py-3 text-gray-600">Owner (Sales)</th>
              <th className="px-4 py-3 text-gray-600 text-center">Outlets</th>
              <th className="px-4 py-3 text-gray-600 text-center">Ticket เปิด</th>
              <th className="px-4 py-3 text-gray-600">สถานะ</th>
            </tr></thead>
            <tbody>
              {filtered.map((a,i)=>(
                <tr key={a.id} className={`cursor-pointer hover:bg-green-50 ${i%2===0?'':'bg-gray-50'}`}
                  onClick={()=>onNavigate('account-detail',{id:a.id})}>
                  <td className="px-4 py-3 font-medium text-green-800">{a.name}</td>
                  <td className="px-4 py-3 text-gray-600">{a.owner||'—'}</td>
                  <td className="px-4 py-3 text-center">{a.outlet_count||0}</td>
                  <td className="px-4 py-3 text-center">
                    {a.open_tickets>0 && <span className="badge">{a.open_tickets}</span>}
                    {!a.open_tickets && '—'}
                  </td>
                  <td className="px-4 py-3"><span className={`px-2 py-0.5 rounded text-xs ${a.status==='active'?'bg-green-100 text-green-700':'bg-gray-100 text-gray-500'}`}>{a.status}</span></td>
                </tr>
              ))}
            </tbody>
          </table>
          {!filtered.length&&<div className="text-center py-8 text-gray-400">ไม่พบ Account</div>}
        </div>
      )}
      {showForm && (
        <Modal title="เพิ่ม Account ใหม่" onClose={()=>setShowForm(false)}>
          <form onSubmit={submit} className="space-y-3">
            <div><label className="text-sm font-medium text-gray-700">ชื่อ Account *</label>
              <input required value={form.name} onChange={e=>setForm({...form,name:e.target.value})} placeholder="เช่น Kam's Roast"/></div>
            <div><label className="text-sm font-medium text-gray-700">Owner (Sales)</label>
              <input value={form.owner} onChange={e=>setForm({...form,owner:e.target.value})}/></div>
            <div><label className="text-sm font-medium text-gray-700">สถานะ</label>
              <select value={form.status} onChange={e=>setForm({...form,status:e.target.value})}>
                <option value="active">Active</option><option value="inactive">Inactive</option>
              </select></div>
            <div className="flex gap-2 justify-end pt-2">
              <button type="button" onClick={()=>setShowForm(false)} className="px-4 py-2 rounded border text-sm">ยกเลิก</button>
              <button type="submit" className="btn-primary px-4 py-2 rounded text-sm">บันทึก</button>
            </div>
          </form>
        </Modal>
      )}
    </div>
  );
}

// ── Account Detail ────────────────────────────────────────────────────────────
function AccountDetail({id, onNavigate, onCreateTicket}) {
  const [account, setAccount] = useState(null);
  const [outlets, setOutlets] = useState([]);
  const [notes, setNotes] = useState([]);
  const [newNote, setNewNote] = useState('');
  const [tab, setTab] = useState('outlets');
  const [loading, setLoading] = useState(true);

  useEffect(()=>{
    Promise.all([
      api(`/api/accounts/${id}`),
      api(`/api/accounts/${id}/outlets`),

              <tr key={s.id} className={`cursor-pointer hover:bg-green-50 ${i%2===0?'':'bg-gray-50'}`}

              <div><label className="text-sm font-medium text-gray-700">วิธีชำระ</label>
                <input value={form.payment_method} onChange={e=>setForm({...form,payment_method:e.target.value})}/></div>
              <div><label className="text-sm font-medium text-gray-700">Credit Days</label>

function SupplierDetail({id, onNavigate}) {

  const [form, setForm] = useState(null);
  const [newNote, setNewNote] = useState('');
  const [editing, setEditing] = useState(false);
  const [tab, setTab] = useState('info');

  useEffect(()=>{
    api(`/api/suppliers/${id}`).then(d=>{setSupplier(d);setForm({...d});});
    api(`/api/suppliers/${id}/notes`).then(setNotes);
  },[id]);

  async function save() {
    await api(`/api/suppliers/${id}`, {method:'PUT', body:JSON.stringify(form)});
    setEditing(false);
    api(`/api/suppliers/${id}`).then(d=>{setSupplier(d);setForm({...d});});
  }
  async function addNote() {
    if (!newNote.trim()) return;
    await api(`/api/suppliers/${id}/notes`, {method:'POST', body:JSON.stringify({note:newNote,created_by:'CX'})});
    setNewNote(''); api(`/api/suppliers/${id}/notes`).then(setNotes);
  }

  if (!supplier||!form) return <Spinner/>;
  return (
    <div>
      <button onClick={()=>onNavigate('suppliers')} className="text-sm text-green-700 mb-3">← กลับ Suppliers</button>

        <div className="flex justify-between">
          <h1 className="text-xl font-bold" style={{color:'var(--primary)'}}>{supplier.name}</h1>
          <div className="flex gap-2">
            {editing
              ? <><button onClick={save} className="btn-primary px-3 py-1 rounded text-sm">บันทึก</button>
                  <button onClick={()=>setEditing(false)} className="px-3 py-1 rounded border text-sm">ยกเลิก</button></>
              : <button onClick={()=>setEditing(true)} className="px-3 py-1 rounded border text-sm">แก้ไข</button>}

      </div>
      <div className="flex gap-4 border-b mb-4">
        {[['info','ข้อมูล'],['notes','Notes']].map(([k,l])=>(
          <div key={k} className={`tab ${tab===k?'active':''}`} onClick={()=>setTab(k)}>{l}</div>
        ))}
      </div>
      {tab==='info' && (
        <div className="card p-5 space-y-3">
          {editing ? (
            <div className="grid grid-cols-2 gap-3">
              {[['name','ชื่อ'],['supplier_type','ประเภท'],['contact_person','Contact Person'],['phone','เบอร์โทร'],['line_id','LINE ID'],['email','Email'],['payment_method','วิธีชำระ']].map(([k,l])=>(
                <div key={k}><label className="text-sm font-medium text-gray-700">{l}</label>
                  <input value={form[k]||''} onChange={e=>setForm({...form,[k]:e.target.value})}/></div>

              <div><label className="text-sm font-medium text-gray-700">Credit Days</label>
                <input type="number" value={form.credit_days||0} onChange={e=>setForm({...form,credit_days:+e.target.value})}/></div>
              <div><label className="text-sm font-medium text-gray-700">Rating</label>
                <Stars value={form.rating||0} onChange={v=>setForm({...form,rating:v})}/></div>
              <div><label className="text-sm font-medium text-gray-700">สถานะ</label>
                <select value={form.status} onChange={e=>setForm({...form,status:e.target.value})}>
                  <option value="active">Active</option><option value="inactive">Inactive</option>
                </select></div>
            </div>
          ) : (
            <div className="grid grid-cols-2 gap-4">
              {[['ประเภท',supplier.supplier_type],['Contact',supplier.contact_person],['เบอร์',supplier.phone],['LINE',supplier.line_id],['Email',supplier.email],['วิธีชำระ',supplier.payment_method],['Credit Days',supplier.credit_days+' วัน']].map(([l,v])=>(
                <div key={l}><div className="text-xs text-gray-500">{l}</div><div className="font-medium">{v||'—'}</div></div>

            <div key={n.id} className="card p-4">
              <div className="text-sm text-gray-500 mb-1">{fmtDT(n.created_at)} — {n.created_by}</div>
              <div className="whitespace-pre-wrap text-gray-800">{n.note}</div>
            </div>
          ))}
        </div>
      )}
    </div>
  );

              <div><label className="text-sm font-medium text-gray-700">เบอร์โทร</label>
                <input value={form.phone} onChange={e=>setForm({...form,phone:e.target.value})}/></div>
              <div><label className="text-sm font-medium text-gray-700">Email</label>
                <input value={form.email} onChange={e=>setForm({...form,email:e.target.value})}/></div>
            </div>
            <div className="flex gap-2 justify-end pt-2">
              <button type="button" onClick={()=>setShowForm(false)} className="px-4 py-2 rounded border text-sm">ยกเลิก</button>
              <button type="submit" className="btn-primary px-4 py-2 rounded text-sm">บันทึก</button>
            </div>
          </form>
        </Modal>
      )}
    </div>
  );
}

// CREATE TICKET
// ══════════════════════════════════════════════════════════════════════════════
function CreateTicket({preOutletId, onClose, onCreated, currentUser}) {
  const [step, setStep] = useState(1);
  const [outlets, setOutlets] = useState([]);
  const [outletSearch, setOutletSearch] = useState('');
  const [selectedOutlet, setSelectedOutlet] = useState(null);
  const [invoices, setInvoices] = useState([]);
  const [selectedInvoice, setSelectedInvoice] = useState('');
  const [skus, setSkus] = useState([]);
  const [selectedSku, setSelectedSku] = useState(null);
  const [caseType, setCaseType] = useState('');
  const [faultCategory, setFaultCategory] = useState('');
  const [faultTeam, setFaultTeam] = useState('');
  const [priority, setPriority] = useState('Medium');
  const [description, setDescription] = useState('');
  const [submitting, setSubmitting] = useState(false);
  const [workflows, setWorkflows] = useState({});

  useEffect(()=>{
    api('/api/outlets?q=').then(setOutlets);
    api('/api/workflows').then(setWorkflows);
    if (preOutletId) {
      api(`/api/outlets/${preOutletId}`).then(o=>{
        setSelectedOutlet(o);
        setOutletSearch(o.name);
        api(`/api/outlets/${preOutletId}/invoices`).then(setInvoices);
        setStep(2);
      });
    }
  },[preOutletId]);

  const filteredOutlets = outlets.filter(o=>
    o.name.toLowerCase().includes(outletSearch.toLowerCase()) ||
    (o.account_name||'').toLowerCase().includes(outletSearch.toLowerCase())
  ).slice(0,20);

  function selectOutlet(o) {
    setSelectedOutlet(o);
    setOutletSearch(o.name);
    api(`/api/outlets/${o.id}/invoices`).then(setInvoices);
    setStep(2);
  }

  function selectInvoice(inv) {
    setSelectedInvoice(inv);
    api(`/api/invoices/${inv}/skus`).then(setSkus);
    setStep(3);
  }

  async function submit() {
    if (!selectedSku||!caseType) return;
    setSubmitting(true);
    const res = await api('/api/tickets', {method:'POST', body:JSON.stringify({
      outlet_id: selectedOutlet.id,
      invoice_number: selectedInvoice,
      sku_code: selectedSku.sku_code,
      product_name: selectedSku.product_name,
      case_type: caseType,
      fault_category: faultCategory,
      fault_team: faultTeam,
      priority, description,
      created_by: currentUser,
    })});
    setSubmitting(false);
    onCreated(res.ticket_no, res.id);
  }

  const wf = workflows[caseType] || [];

  return (
    <Modal title="สร้าง Ticket ใหม่" onClose={onClose} wide>
      {/* Steps indicator */}
      <div className="flex gap-2 mb-5">
        {['Outlet','Invoice','SKU','รายละเอียด'].map((l,i)=>(
          <div key={i} className="flex items-center gap-1">
            <div className={`w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
              ${step>i+1?'bg-green-500 text-white':step===i+1?'bg-green-800 text-white':'bg-gray-200 text-gray-500'}`}>
              {step>i+1?'✓':i+1}
            </div>
            <span className={`text-xs ${step===i+1?'font-semibold text-green-800':'text-gray-400'}`}>{l}</span>
            {i<3&&<div className="w-4 h-0.5 bg-gray-300"/>}
          </div>
        ))}
      </div>

      {/* Step 1: Outlet */}
      {step>=1 && (
        <div className="mb-4">
          <label className="text-sm font-semibold text-gray-700 mb-1 block">1. เลือก Outlet</label>
          <input value={outletSearch} onChange={e=>{setOutletSearch(e.target.value);setSelectedOutlet(null);}}
            placeholder="ค้นหา Outlet หรือ Account..."/>
          {!selectedOutlet && outletSearch && (
            <div className="border rounded mt-1 max-h-40 overflow-y-auto bg-white shadow">
              {filteredOutlets.map(o=>(
                <div key={o.id} className="px-3 py-2 hover:bg-green-50 cursor-pointer text-sm"
                  onClick={()=>selectOutlet(o)}>
                  <span className="font-medium">{o.name}</span>
                  <span className="text-gray-400 ml-2 text-xs">{o.account_name}</span>
                </div>
              ))}
              {!filteredOutlets.length&&<div className="px-3 py-2 text-gray-400 text-sm">ไม่พบ</div>}
            </div>
          )}
          {selectedOutlet && <div className="text-xs text-green-700 mt-1">✓ {selectedOutlet.name} ({selectedOutlet.account_name})</div>}
        </div>
      )}

      {/* Step 2: Invoice */}
      {step>=2 && (
        <div className="mb-4">
          <label className="text-sm font-semibold text-gray-700 mb-1 block">2. เลือก Invoice</label>
          <select value={selectedInvoice} onChange={e=>e.target.value&&selectInvoice(e.target.value)}>
            <option value="">-- เลือก Invoice --</option>
            {invoices.map(inv=>(
              <option key={inv.invoice_number} value={inv.invoice_number}>
                {inv.invoice_number} ({fmt(inv.doc_date)}) — {inv.sku_count} SKU
              </option>
            ))}
          </select>
        </div>
      )}

      {/* Step 3: SKU */}
      {step>=3 && skus.length>0 && (
        <div className="mb-4">
          <label className="text-sm font-semibold text-gray-700 mb-1 block">3. เลือก SKU ที่มีปัญหา</label>
          <div className="border rounded overflow-hidden max-h-48 overflow-y-auto">
            {skus.map(s=>(
              <div key={s.sku_code} className={`px-3 py-2 cursor-pointer flex justify-between text-sm
                ${selectedSku?.sku_code===s.sku_code?'bg-green-100 border-l-4 border-green-600':'hover:bg-gray-50'}`}
                onClick={()=>{setSelectedSku(s);setStep(4);}}>
                <span>{s.product_name}</span>
                <span className="text-gray-400 font-mono text-xs">{s.sku_code}</span>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* Step 4: Details */}
      {step>=4 && selectedSku && (
        <div className="space-y-3">
          <div className="bg-green-50 rounded p-3 text-sm">
            <span className="font-medium">SKU:</span> {selectedSku.product_name} ({selectedSku.sku_code})
          </div>
          <div>
            <label className="text-sm font-semibold text-gray-700 mb-1 block">4. Case Type *</label>
            <select value={caseType} onChange={e=>setCaseType(e.target.value)}>
              <option value="">-- เลือก Case Type --</option>
              {CASE_TYPES.map(c=><option key={c} value={c}>{c}</option>)}
            </select>
          </div>
          {caseType && wf.length>0 && (
            <div className="bg-blue-50 p-3 rounded">
              <div className="text-xs font-semibold text-blue-700 mb-2">Workflow Preview:</div>
              <div className="flex flex-wrap gap-1 items-center">
                {wf.map((s,i)=>(
                  <React.Fragment key={i}>
                    {i>0&&<span className="text-gray-400 text-xs">→</span>}
                    <span className="bg-white border border-blue-200 rounded px-2 py-0.5 text-xs">{s.team}: {s.label}</span>
                  </React.Fragment>
                ))}
              </div>
            </div>
          )}
          <div className="grid grid-cols-2 gap-3">
            <div>
              <label className="text-sm font-semibold text-gray-700 mb-1 block">Root Cause</label>
              <select value={faultCategory} onChange={e=>setFaultCategory(e.target.value)}>
                <option value="">-- เลือก --</option>
                {ROOT_CAUSES.map(r=><option key={r} value={r}>{r}</option>)}
              </select>
            </div>
            <div>
              <label className="text-sm font-semibold text-gray-700 mb-1 block">Fault Team</label>
              <select value={faultTeam} onChange={e=>setFaultTeam(e.target.value)}>
                <option value="">-- เลือก --</option>
                {FAULT_TEAMS.map(t=><option key={t} value={t}>{t}</option>)}
              </select>
            </div>
          </div>
          <div>
            <label className="text-sm font-semibold text-gray-700 mb-1 block">Priority</label>
            <select value={priority} onChange={e=>setPriority(e.target.value)}>
              {PRIORITIES.map(p=><option key={p} value={p}>{p}</option>)}
            </select>
          </div>
          <div>
            <label className="text-sm font-semibold text-gray-700 mb-1 block">รายละเอียด</label>
            <textarea rows={3} value={description} onChange={e=>setDescription(e.target.value)} placeholder="อธิบายปัญหา..."/>
          </div>
          <div className="flex gap-2 justify-end pt-2">
            <button onClick={onClose} className="px-4 py-2 rounded border text-sm">ยกเลิก</button>
            <button onClick={submit} disabled={!caseType||submitting}
              className="btn-primary px-5 py-2 rounded text-sm disabled:opacity-50">
              {submitting?'กำลังสร้าง...':'สร้าง Ticket'}
            </button>
          </div>
        </div>
      )}
    </Modal>
  );
}

// TICKET LIST
// ══════════════════════════════════════════════════════════════════════════════
function TicketList({onNavigate, currentTeam, onCreateTicket}) {
  const [tickets, setTickets] = useState([]);
  const [loading, setLoading] = useState(true);
  const [statusFilter, setStatusFilter] = useState('');
  const [search, setSearch] = useState('');

  const load = () => {
    const qs = new URLSearchParams();
    if (currentTeam && currentTeam!=='Management') qs.set('team',currentTeam);
    if (statusFilter) qs.set('status',statusFilter);
    api(`/api/tickets?${qs}`).then(d=>{setTickets(d);setLoading(false);});
  };
  useEffect(()=>{setLoading(true);load();},[currentTeam,statusFilter]);

  const filtered = tickets.filter(t=>
    !search ||
    t.ticket_no.toLowerCase().includes(search.toLowerCase()) ||
    (t.outlet_name||'').toLowerCase().includes(search.toLowerCase()) ||
    (t.product_name||'').toLowerCase().includes(search.toLowerCase())
  );

  return (
    <div>
      <div className="flex justify-between items-center mb-4">
        <h1 className="text-2xl font-bold" style={{color:'var(--primary)'}}>
          Tickets {currentTeam && currentTeam!=='Management' && <span className="text-lg text-gray-500">— {currentTeam}</span>}
        </h1>
        <button onClick={onCreateTicket} className="btn-primary px-4 py-2 rounded-lg text-sm font-medium">+ สร้าง Ticket</button>
      </div>
      <div className="card p-4 mb-4 flex gap-3 flex-wrap">
        <input className="flex-1" placeholder="ค้นหา ticket no / outlet / สินค้า..." value={search} onChange={e=>setSearch(e.target.value)} style={{minWidth:'200px'}}/>
        <select value={statusFilter} onChange={e=>setStatusFilter(e.target.value)} style={{width:'150px'}}>
          <option value="">ทุก status</option>
          {Object.entries(STATUS_LABELS).map(([k,v])=><option key={k} value={k}>{v}</option>)}
        </select>
      </div>
      {loading ? <Spinner/> : (
        <div className="card overflow-hidden">
          <table className="w-full text-sm">
            <thead><tr className="bg-gray-50 text-left">
              <th className="px-4 py-3 text-gray-600">Ticket</th>
              <th className="px-4 py-3 text-gray-600">Outlet</th>
              <th className="px-4 py-3 text-gray-600">สินค้า</th>
              <th className="px-4 py-3 text-gray-600">Case Type</th>
              <th className="px-4 py-3 text-gray-600">Priority</th>
              <th className="px-4 py-3 text-gray-600">Status</th>
              <th className="px-4 py-3 text-gray-600">ทีมปัจจุบัน</th>
              <th className="px-4 py-3 text-gray-600">วันที่</th>
            </tr></thead>
            <tbody>
              {filtered.map((t,i)=>(
                <tr key={t.id} className={`cursor-pointer hover:bg-green-50 ${i%2===0?'':'bg-gray-50'}`}
                  onClick={()=>onNavigate('ticket-detail',{id:t.id})}>
                  <td className="px-4 py-3 font-mono font-medium text-green-800">{t.ticket_no}</td>
                  <td className="px-4 py-3">
                    <div className="font-medium">{t.outlet_name}</div>
                    <div className="text-xs text-gray-400">{t.account_name}</div>
                  </td>
                  <td className="px-4 py-3 text-sm">{t.product_name||'—'}</td>
                  <td className="px-4 py-3"><span className="px-2 py-0.5 bg-blue-50 text-blue-700 rounded text-xs">{t.case_type}</span></td>
                  <td className="px-4 py-3"><PriorityBadge priority={t.priority}/></td>
                  <td className="px-4 py-3"><StatusBadge status={t.status}/></td>
                  <td className="px-4 py-3 text-gray-600">{t.current_team}</td>
                  <td className="px-4 py-3 text-gray-400 text-xs">{fmt(t.created_at)}</td>
                </tr>
              ))}
            </tbody>
          </table>
          {!filtered.length&&<div className="text-center py-8 text-gray-400">ไม่มี Ticket</div>}
        </div>
      )}
    </div>
  );
}

// TICKET DETAIL
// ══════════════════════════════════════════════════════════════════════════════
function TicketDetail({id, onNavigate, currentUser, currentTeam}) {
  const [ticket, setTicket] = useState(null);
  const [log, setLog] = useState([]);
  const [comments, setComments] = useState([]);
  const [employees, setEmployees] = useState([]);
  const [newComment, setNewComment] = useState('');
  const [advanceNote, setAdvanceNote] = useState('');
  const [advanceBranch, setAdvanceBranch] = useState('');
  const [selectedEmployee, setSelectedEmployee] = useState('');
  const [workflows, setWorkflows] = useState({});
  const [tab, setTab] = useState('detail');

  const load = () => Promise.all([
    api(`/api/tickets/${id}`),
    api(`/api/tickets/${id}/log`),
    api(`/api/tickets/${id}/comments`),
    api('/api/workflows'),
    api('/api/employees'),
  ]).then(([t,l,c,w,e])=>{setTicket(t);setLog(l);setComments(c);setWorkflows(w);setEmployees(e);});

  useEffect(()=>{load();},[id]);

  async function addComment() {
    if (!newComment.trim()) return;
    await api(`/api/tickets/${id}/comments`, {method:'POST', body:JSON.stringify({comment:newComment,created_by:currentUser})});
    setNewComment(''); api(`/api/tickets/${id}/comments`).then(setComments);
  }

  async function acknowledge() {
    await api(`/api/tickets/${id}/acknowledge`, {method:'POST', body:JSON.stringify({employee_id:+selectedEmployee||null,created_by:currentUser})});
    load();
  }

  async function advance(action) {
    const wf = workflows[ticket.case_type]||[];
    const needsBranch = wf[ticket.workflow_step]?.branches;
    if (needsBranch && !advanceBranch) { alert('กรุณาเลือกแนวทาง'); return; }
    await api(`/api/tickets/${id}/advance`, {method:'POST', body:JSON.stringify({
      action, note:advanceNote, created_by:currentUser,
      branch: advanceBranch||ticket.workflow_branch,
      employee_id:+selectedEmployee||null
    })});
    setAdvanceNote(''); setAdvanceBranch('');
    load();
  }

  async function closeTicket() {
    await api(`/api/tickets/${id}/close`, {method:'POST', body:JSON.stringify({created_by:currentUser})});
    load();
  }

  if (!ticket) return <Spinner/>;

  const wf = workflows[ticket.case_type]||[];
  const currentStep = wf[ticket.workflow_step];
  const branches = currentStep?.branches || [];
  const isMyTeam = currentTeam === ticket.current_team || currentTeam === 'Management';
  const isClosed = ticket.status==='closed'||ticket.status==='resolved';
  const isCX = ticket.current_team==='CX';
  const teamEmps = employees.filter(e=>e.team===ticket.current_team && e.status==='active');

  return (
    <div>
      <button onClick={()=>onNavigate('tickets')} className="text-sm text-green-700 mb-3">← กลับ Tickets</button>
      {/* Header */}
      <div className="card p-5 mb-4">
        <div className="flex justify-between items-start">
          <div>
            <div className="flex items-center gap-3 mb-1">
              <h1 className="text-2xl font-bold font-mono" style={{color:'var(--primary)'}}>{ticket.ticket_no}</h1>
              <StatusBadge status={ticket.status}/>
              <PriorityBadge priority={ticket.priority}/>
            </div>
            <div className="text-gray-600">{ticket.outlet_name} <span className="text-gray-400">({ticket.account_name})</span></div>
            <div className="text-gray-600 text-sm mt-1">Invoice: <span className="font-mono">{ticket.invoice_number||'—'}</span> | SKU: {ticket.product_name} ({ticket.sku_code})</div>
            <div className="text-gray-500 text-sm">Case: <span className="font-medium text-blue-700">{ticket.case_type}</span> | Fault: {ticket.fault_team} | Root Cause: {ticket.fault_category}</div>
            <div className="text-gray-400 text-xs mt-1">เปิดโดย {ticket.created_by} เมื่อ {fmtDT(ticket.created_at)}</div>
          </div>
          <div className="text-right text-sm">
            <div className="font-medium text-gray-700">ทีมปัจจุบัน</div>
            <div className="text-xl font-bold" style={{color:'var(--primary)'}}>{ticket.current_team}</div>
            {ticket.assigned_employee_name && <div className="text-gray-500 text-xs">รับผิดชอบ: {ticket.assigned_employee_name}</div>}
          </div>
        </div>
        {/* Workflow */}
        {wf.length>0 && (
          <div className="mt-4 pt-4 border-t">
            <div className="text-xs text-gray-500 mb-2">Workflow Progress:</div>
            <WorkflowTimeline caseType={ticket.case_type} currentStep={ticket.workflow_step} branch={ticket.workflow_branch} workflows={workflows}/>
          </div>
        )}
      </div>

      <div className="flex gap-4 border-b mb-4">
        {[['detail','รายละเอียด'],['log','Log'],['comments','Comments']].map(([k,l])=>(
          <div key={k} className={`tab ${tab===k?'active':''}`} onClick={()=>setTab(k)}>{l}
            {k==='comments'&&comments.length>0&&<span className="ml-1 badge">{comments.length}</span>}
          </div>
        ))}
      </div>

      {tab==='detail' && (
        <div className="space-y-4">
          <div className="card p-4">
            <h3 className="font-semibold text-gray-700 mb-2">รายละเอียด</h3>
            <p className="text-gray-700 whitespace-pre-wrap">{ticket.description||'—'}</p>
          </div>
          {/* Action Panel */}
          {isMyTeam && !isClosed && (
            <div className="card p-4 border-2 border-green-200">
              <h3 className="font-semibold text-green-800 mb-3">ดำเนินการ</h3>
              {/* Acknowledge */}
              {ticket.status==='open' && (
                <div className="mb-3 flex gap-2 items-center">
                  <select value={selectedEmployee} onChange={e=>setSelectedEmployee(e.target.value)} style={{width:'200px'}}>
                    <option value="">-- เลือกพนักงาน --</option>
                    {teamEmps.map(e=><option key={e.id} value={e.id}>{e.name}</option>)}
                  </select>
                  <button onClick={acknowledge} className="btn-primary px-3 py-1.5 rounded text-sm">Acknowledge</button>
                </div>
              )}
              {/* Branch selection */}
              {branches.length>0 && (
                <div className="mb-3">
                  <label className="text-sm font-medium text-gray-700 mb-1 block">เลือกแนวทาง:</label>
                  <div className="flex gap-2">
                    {branches.map(b=>(
                      <button key={b} onClick={()=>setAdvanceBranch(b)}
                        className={`px-3 py-1.5 rounded border text-sm ${advanceBranch===b?'border-green-600 bg-green-50 text-green-700':'border-gray-300'}`}>
                        {b}
                      </button>
                    ))}
                  </div>
                </div>
              )}
              <div className="mb-3">
                <textarea rows={2} value={advanceNote} onChange={e=>setAdvanceNote(e.target.value)} placeholder="Note (optional)..."/>
              </div>
              <div className="flex gap-2">
                {!isCX && <button onClick={()=>advance('ดำเนินการแล้ว')} className="btn-primary px-4 py-2 rounded text-sm">ส่งต่อ →</button>}
                {isCX && ticket.status!=='open' && (
                  <button onClick={closeTicket} className="bg-gray-600 text-white px-4 py-2 rounded text-sm hover:bg-gray-700">ปิดเคส</button>
                )}
                {isCX && ticket.status==='open' && <button onClick={()=>advance('รับเรื่องแล้ว')} className="btn-primary px-4 py-2 rounded text-sm">รับเรื่อง + ส่งต่อ →</button>}
              </div>
            </div>
          )}
        </div>
      )}

      {tab==='log' && (
        <div className="space-y-2">
          {log.map(l=>(
            <div key={l.id} className="card p-3 flex gap-3">
              <div className="w-2 h-2 rounded-full bg-green-500 mt-1.5 flex-shrink-0"/>
              <div className="flex-1">
                <div className="text-sm"><span className="font-medium">{l.action}</span>
                  {l.from_team&&<span className="text-gray-400 text-xs ml-2">{l.from_team} → {l.to_team}</span>}
                </div>
                {l.note&&<div className="text-gray-500 text-xs mt-0.5">{l.note}</div>}
                <div className="text-gray-400 text-xs mt-0.5">{fmtDT(l.created_at)} {l.employee_name&&`— ${l.employee_name}`} {l.created_by&&`(${l.created_by})`}</div>
              </div>
            </div>
          ))}
          {!log.length&&<div className="text-center py-6 text-gray-400">ไม่มี Log</div>}
        </div>
      )}

      {tab==='comments' && (
        <div className="space-y-3">
          <div className="card p-4">
            <textarea rows={3} value={newComment} onChange={e=>setNewComment(e.target.value)} placeholder="เพิ่ม comment..."/>
            <div className="flex justify-end mt-2">
              <button onClick={addComment} className="btn-primary px-3 py-1 rounded text-sm">ส่ง</button>
            </div>
          </div>
          {comments.map(c=>(
            <div key={c.id} className="card p-3">
              <div className="text-sm text-gray-500 mb-1">{c.created_by} — {fmtDT(c.created_at)}</div>
              <div className="text-gray-800 whitespace-pre-wrap">{c.comment}</div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ══════════════════════════════════════════════════════════════════════════════
// ERP IMPORT
// ══════════════════════════════════════════════════════════════════════════════
function ERPImport() {
  const [file, setFile] = useState(null);
  const [result, setResult] = useState(null);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');

  async function upload(e) {
    e.preventDefault();
    if (!file) return;
    setLoading(true); setResult(null); setError('');
    const fd = new FormData();
    fd.append('file', file);
    try {
      const res = await fetch('/api/import/erp', {method:'POST', body:fd});
      const data = await res.json();
      if (!res.ok) setError(data.error||'เกิดข้อผิดพลาด');
      else setResult(data);
    } catch(err) { setError(err.message); }
    setLoading(false);
  }

  return (
    <div>
      <h1 className="text-2xl font-bold mb-4" style={{color:'var(--primary)'}}>Import ERP Data</h1>
      <div className="card p-6 max-w-lg">
        <div className="mb-4 text-sm text-gray-600 space-y-1">
          <div>• รองรับไฟล์ <code>.xlsx</code> export จาก ERP</div>
          <div>• Sheet name: <code>sheet1</code></div>
          <div>• Map columns by name (ไม่ใช่ position)</div>
          <div>• ตรวจ duplicate ด้วย <code>order_item_id</code></div>
          <div>• Auto-create Account และ Outlet ที่ยังไม่มี</div>
        </div>
        <form onSubmit={upload} className="space-y-4">
          <div>
            <label className="text-sm font-medium text-gray-700 mb-1 block">เลือกไฟล์ ERP (.xlsx)</label>
            <input type="file" accept=".xlsx" onChange={e=>setFile(e.target.files[0])}/>
          </div>
          <button type="submit" disabled={!file||loading} className="btn-primary w-full py-2 rounded disabled:opacity-50">
            {loading ? 'กำลัง Import...' : 'Import'}
          </button>
        </form>
        {error && <div className="mt-4 p-3 bg-red-50 text-red-700 rounded text-sm">{error}</div>}
        {result && (
          <div className="mt-4 p-4 bg-green-50 rounded space-y-1">
            <div className="font-semibold text-green-800">Import สำเร็จ</div>
            <div className="text-sm text-green-700">เพิ่มใหม่: <span className="font-bold">{result.inserted}</span> รายการ</div>
            <div className="text-sm text-gray-600">ข้ามซ้ำ: {result.skipped} รายการ</div>
          </div>
        )}
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════════════════════════════════════
// TEAM SELECTOR (on first visit)
// ══════════════════════════════════════════════════════════════════════════════
function TeamSelector({onSelect}) {
  return (
    <div className="min-h-screen flex items-center justify-center" style={{background:'var(--primary)'}}>
      <div className="card p-8 w-full max-w-md text-center">
        <div className="text-4xl mb-2">🌿</div>
        <h1 className="text-2xl font-bold mb-1" style={{color:'var(--primary)'}}>SMM Sourcing CRM</h1>
        <p className="text-gray-500 mb-6 text-sm">เลือกทีมของคุณเพื่อเข้าใช้งาน</p>
        <div className="space-y-2">
          {TEAMS.map(t=>(
            <button key={t} onClick={()=>onSelect(t)}
              className="w-full py-3 px-4 rounded-lg border-2 border-transparent hover:border-green-700 hover:bg-green-50 text-left font-medium text-gray-700 transition-all">
              {t==='Management'?'👔':t==='CX'?'📞':t==='Sales Co'?'💼':t==='Merchandise'?'📦':t==='Inbound/QC'?'🔍':'🚚'} {t}
            </button>
          ))}
        </div>
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════════════════════════════════════
// APP SHELL
// ══════════════════════════════════════════════════════════════════════════════
function App() {
  const [currentTeam, setCurrentTeam] = useState(null);
  const [currentUser, setCurrentUser] = useState('CX');
  const [page, setPage] = useState('dashboard');
  const [pageParams, setPageParams] = useState({});
  const [createTicketOutlet, setCreateTicketOutlet] = useState(null);
  const [showCreateTicket, setShowCreateTicket] = useState(false);
  const [ticketCounts, setTicketCounts] = useState({});

  useEffect(()=>{
    if (!currentTeam) return;
    // Load badge counts per team
    Promise.all(TEAMS.slice(0,-1).map(t=>api(`/api/tickets?team=${t}&status=open`))).then(results=>{
      const counts = {};
      TEAMS.slice(0,-1).forEach((t,i)=>{ counts[t]=results[i].length; });
      setTicketCounts(counts);
    });
  },[currentTeam, page]);

  function navigate(p, params={}) { setPage(p); setPageParams(params); }

  function openCreateTicket(outletId=null) {
    setCreateTicketOutlet(outletId);
    setShowCreateTicket(true);
  }

  if (!currentTeam) return <TeamSelector onSelect={t=>{setCurrentTeam(t);setCurrentUser(t);}}/>;

  const navItems = [
    {key:'dashboard', label:'Dashboard', icon:'📊'},
    {key:'tickets', label:'Tickets', icon:'🎫'},
    {key:'accounts', label:'Accounts', icon:'🏢'},
    {key:'suppliers', label:'Suppliers', icon:'🏭'},
    {key:'employees', label:'พนักงาน', icon:'👥'},
    {key:'import', label:'Import ERP', icon:'📥'},
  ];

  function renderPage() {
    switch(page) {
      case 'dashboard': return <Dashboard/>;
      case 'tickets': return <TicketList onNavigate={navigate} currentTeam={currentTeam} onCreateTicket={()=>openCreateTicket()}/>;
      case 'ticket-detail': return <TicketDetail id={pageParams.id} onNavigate={navigate} currentUser={currentUser} currentTeam={currentTeam}/>;
      case 'accounts': return <Accounts onNavigate={navigate}/>;
      case 'account-detail': return <AccountDetail id={pageParams.id} onNavigate={navigate} onCreateTicket={oid=>openCreateTicket(oid)}/>;
      case 'outlet-detail': return <OutletDetail id={pageParams.id} onNavigate={navigate} onCreateTicket={oid=>openCreateTicket(oid)}/>;
      case 'suppliers': return <Suppliers onNavigate={navigate}/>;
      case 'supplier-detail': return <SupplierDetail id={pageParams.id} onNavigate={navigate}/>;
      case 'employees': return <Employees/>;
      case 'import': return <ERPImport/>;
      default: return <Dashboard/>;
    }
  }

  return (
    <div className="flex min-h-screen">
      {/* Sidebar */}
      <div className="sidebar flex flex-col flex-shrink-0">
        <div className="p-4 border-b border-white/10">
          <div className="text-white font-bold text-lg">🌿 SMM CRM</div>
          <div className="text-white/60 text-xs mt-0.5">Sourcing Business Unit</div>
        </div>
        {/* Team badge */}
        <div className="px-4 py-2 border-b border-white/10">
          <div className="text-white/50 text-xs">ทีมของคุณ</div>
          <div className="text-white font-semibold text-sm">{currentTeam}</div>
        </div>
        <nav className="flex-1 py-2">
          {navItems.map(({key,label,icon})=>(
            <a key={key} href="#" className={`flex items-center justify-between px-4 py-2.5 text-sm ${(page===key||(page.startsWith(key.split('-')[0])&&key!=='dashboard'))?'active':''}`}
              onClick={e=>{e.preventDefault();navigate(key);}}>
              <span>{icon} {label}</span>
              {key==='tickets'&&ticketCounts[currentTeam]>0&&<span className="badge">{ticketCounts[currentTeam]}</span>}
            </a>
          ))}
        </nav>
        <div className="p-4 border-t border-white/10">
          <button onClick={()=>setCurrentTeam(null)} className="text-white/50 text-xs hover:text-white/80">↩ เปลี่ยนทีม</button>
        </div>
      </div>
      {/* Main */}
      <div className="flex-1 overflow-auto">
        <div className="max-w-7xl mx-auto px-6 py-6">
          {renderPage()}
        </div>
      </div>
      {/* Create Ticket Modal */}
      {showCreateTicket && (
        <CreateTicket
          preOutletId={createTicketOutlet}
          currentUser={currentUser}
          onClose={()=>setShowCreateTicket(false)}
          onCreated={(no,id)=>{setShowCreateTicket(false);navigate('ticket-detail',{id});}}
        />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
