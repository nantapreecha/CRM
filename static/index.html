// ── Employees ─────────────────────────────────────────────────────────────────
function Employees() {
  const EMPTY = { name:'', employee_code:'', department:'', team:'CX', role:'', phone:'', email:'', status:'active' };
  const [data, setData] = useState([]);
  const [loading, setLoading] = useState(true);
  const [form, setForm] = useState(EMPTY);
  const [editId, setEditId] = useState(null);
  const [saving, setSaving] = useState(false);
  const [msg, setMsg] = useState('');

  const load = () => {
    setLoading(true);
    api('/api/employees').then(d => { setData(d || []); setLoading(false); });
  };
  useEffect(() => { load(); }, []);

  const set = (k, v) => setForm(f => ({ ...f, [k]: v }));

  const save = async e => {
    e.preventDefault();
    if (!form.name.trim()) return setMsg('Please enter a name');
    setSaving(true); setMsg('');
    const method = editId ? 'PUT' : 'POST';
    const path = editId ? `/api/employees/${editId}` : '/api/employees';
    const res = await api(path, { method, body: JSON.stringify(form) });
    setSaving(false);
    if (res && (res.id || res.ok)) { setForm(EMPTY); setEditId(null); load(); }
    else setMsg(res?.error || 'An error occurred');
  };

  const startEdit = emp => {
    setEditId(emp.id);
    setForm({ name: emp.name||'', employee_code: emp.employee_code||'', department: emp.department||'',
      team: emp.team||'CX', role: emp.role||'', phone: emp.phone||'', email: emp.email||'', status: emp.status||'active' });
  };

  const deleteEmp = async (emp) => {
    if (!window.confirm(`Delete employee "${emp.name}"?\nResponsibility history will remain but the employee name will be removed.`)) return;
    const res = await api(`/api/employees/${emp.id}`, { method: 'DELETE' });
    if (res && res.ok) { load(); setMsg(''); }
    else setMsg('Delete failed: ' + (res?.error || 'Unknown error'));
  };

  return (
    <div className="p-6 max-w-4xl">
      <h2 className="text-xl font-bold mb-5" style={{color:'var(--primary)'}}>👷 Employees</h2>

      <div className="card p-5 mb-5">
        <h3 className="font-semibold text-gray-700 mb-3">{editId ? '✏️ Edit Employee' : '➕ Add Employee'}</h3>
        <form onSubmit={save} className="grid grid-cols-2 gap-3">
          <div>
            <label className="text-sm font-medium text-gray-700 block mb-1">Name *</label>
            <input value={form.name} onChange={e=>set('name',e.target.value)} required placeholder="Full Name"/>
          </div>
          <div>
            <label className="text-sm font-medium text-gray-700 block mb-1">Employee Code</label>
            <input value={form.employee_code} onChange={e=>set('employee_code',e.target.value)} placeholder="Employee ID"/>
          </div>
          <div>
            <label className="text-sm font-medium text-gray-700 block mb-1">Team *</label>
            <select value={form.team} onChange={e=>set('team',e.target.value)}>
              {TEAMS.map(t=><option key={t} value={t}>{t}</option>)}
            </select>
          </div>
          <div>
            <label className="text-sm font-medium text-gray-700 block mb-1">Position / Role</label>
            <input value={form.role} onChange={e=>set('role',e.target.value)} placeholder="เช่น Supervisor, Staff"/>
          </div>
          <div>
            <label className="text-sm font-medium text-gray-700 block mb-1">Department</label>
            <input value={form.department} onChange={e=>set('department',e.target.value)} placeholder="Department"/>
          </div>
          <div>
            <label className="text-sm font-medium text-gray-700 block mb-1">Phone</label>
            <input value={form.phone} onChange={e=>set('phone',e.target.value)} placeholder="Phone"/>
          </div>
          <div>
            <label className="text-sm font-medium text-gray-700 block mb-1">Email</label>
            <input type="email" value={form.email} onChange={e=>set('email',e.target.value)} placeholder="email@example.com"/>
          </div>
          <div>
            <label className="text-sm font-medium text-gray-700 block mb-1">Status</label>
            <select value={form.status} onChange={e=>set('status',e.target.value)}>
              <option value="active">Active</option>
              <option value="inactive">Inactive</option>
            </select>
          </div>
          {msg && <div className="col-span-2 text-red-600 text-sm">{msg}</div>}
          <div className="col-span-2 flex gap-2">
            <button type="submit" className="btn btn-primary" disabled={saving}>{saving?<Spinner/>:(editId?'Save changes':'Add Employee')}</button>
            {editId && <button type="button" className="btn btn-secondary" onClick={()=>{setEditId(null);setForm(EMPTY);}}>Cancel</button>}
          </div>
        </form>
      </div>

      {loading ? <Spinner/> : (
        <div className="card overflow-hidden">
          <table className="w-full text-sm">
            <thead className="bg-gray-50 text-gray-600 text-left">
              <tr>
                <th className="p-3">Name</th>
                <th className="p-3">Team</th>
                <th className="p-3">Position</th>
                <th className="p-3">Phone</th>
                <th className="p-3">Status</th>
                <th className="p-3"></th>
              </tr>
            </thead>
            <tbody>
              {data.length === 0
                ? <tr><td colSpan={6} className="p-6 text-center text-gray-400">No employees yet</td></tr>
                : data.map(emp => (
                <tr key={emp.id} className="border-t hover:bg-gray-50">
                  <td className="p-3 font-medium">{emp.name}</td>
                  <td className="p-3">{TEAM_ICONS[emp.team]||''} {emp.team}</td>
                  <td className="p-3 text-gray-500">{emp.role||'-'}</td>
                  <td className="p-3 text-gray-500">{emp.phone||'-'}</td>
                  <td className="p-3">
                    <span className={`px-2 py-0.5 rounded-full text-xs ${emp.status==='active'?'bg-green-100 text-green-700':'bg-gray-100 text-gray-500'}`}>
                      {emp.status}
                    </span>
                  </td>
                  <td className="p-3">
                    <div className="flex gap-2">
                      <button className="btn btn-secondary text-xs" onClick={()=>startEdit(emp)}>Edit</button>
                      <button className="btn text-xs" style={{background:'#fef2f2',color:'#dc2626',border:'1px solid #fca5a5'}}
                        onClick={()=>deleteEmp(emp)}>Delete</button>
                    </div>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

// ── Pipeline helpers ──────────────────────────────────────────────────────────
function isUntouched(lead) {
  const baseline = lead.last_activity_date || lead.created_at;
  if (!baseline) return false;
  return (Date.now() - new Date(baseline).getTime()) / 86400000 >= 30;
}

function lastActivityLabel(lead) {
  if (lead.last_activity_date) return (lead.last_activity_date||'').slice(0,10);
  return (lead.created_at||'').slice(0,10) + ' (created)';
}

function ReassignModal({ lead, users, onClose, onReassigned }) {
  const [newOwner, setNewOwner] = useState(String(lead.owner_user_id||''));
  const [saving, setSaving] = useState(false);
  const save = async () => {
    if (!newOwner) return;
    setSaving(true);
    await api(`/api/leads/${lead.id}`, { method:'PUT', body: JSON.stringify({
      company_name: lead.company_name, contact_name: lead.contact_name,
      contact_phone: lead.contact_phone, contact_email: lead.contact_email,
      stage: lead.stage, owner_user_id: newOwner, description: lead.description
    })});
    setSaving(false);
    onReassigned();
  };
  return (
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.4)',zIndex:1000,display:'flex',alignItems:'center',justifyContent:'center'}}>
      <div style={{background:'#fff',borderRadius:12,padding:24,width:380,boxShadow:'0 20px 40px rgba(0,0,0,0.15)'}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
          <h3 style={{fontSize:15,fontWeight:600,color:'#111827',margin:0}}>Reassign Lead</h3>
          <button onClick={onClose} style={{background:'none',border:'none',cursor:'pointer',color:'#9ca3af',fontSize:20,lineHeight:1}}>&times;</button>
        </div>
        <p style={{fontSize:13,color:'#6b7280',marginBottom:14}}><strong>{lead.company_name}</strong> — Change owner</p>
        <select value={newOwner} onChange={e=>setNewOwner(e.target.value)} style={{width:'100%',marginBottom:16}}>
          <option value="">— Select owner —</option>
          {users.filter(u=>u.role==='sales'||u.role==='admin').map(u=><option key={u.id} value={String(u.id)}>{u.display_name}</option>)}
        </select>
        <div style={{display:'flex',justifyContent:'flex-end',gap:8}}>
          <button onClick={onClose} className="btn btn-secondary">Cancel</button>
          <button onClick={save} className="btn btn-primary" disabled={saving||!newOwner}>{saving?<Spinner/>:'Reassign'}</button>
        </div>
      </div>
    </div>
  );
}

// ── Pipeline ──────────────────────────────────────────────────────────────────
const LEAD_STAGES = ['Cold Call/Email', 'Meeting', 'Follow Up', 'Closed Win', 'Closed Lost'];
const STAGE_COLORS = {
  'Cold Call/Email': { bg:'#eff6ff', border:'#3b82f6', text:'#1d4ed8', dot:'#3b82f6' },
  'Meeting':         { bg:'#fefce8', border:'#eab308', text:'#854d0e', dot:'#eab308' },
  'Follow Up':       { bg:'#fff7ed', border:'#f97316', text:'#9a3412', dot:'#f97316' },
  'Closed Win':      { bg:'#f0fdf4', border:'#22c55e', text:'#15803d', dot:'#22c55e' },
  'Closed Lost':     { bg:'#fef2f2', border:'#ef4444', text:'#991b1b', dot:'#ef4444' },
};

class PipelineErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { error: null }; }
  static getDerivedStateFromError(e) { return { error: e }; }
  render() {
    if (this.state.error) return (
      <div style={{padding:32,textAlign:'center',color:'#ef4444'}}>
        <p className="font-semibold mb-2">Pipeline Error</p>
        <pre style={{fontSize:12,textAlign:'left',background:'#fef2f2',padding:12,borderRadius:8,overflow:'auto'}}>
          {String(this.state.error)}
        </pre>
      </div>
    );
    return this.props.children;
  }
}

function StageBadge({ stage }) {
  const c = STAGE_COLORS[stage] || { bg:'#f3f4f6', border:'#9ca3af', text:'#374151', dot:'#9ca3af' };
  return (
    <span style={{ background:c.bg, border:`1px solid ${c.border}`, color:c.text,
      borderRadius:9999, padding:'2px 10px', fontSize:11, fontWeight:600, display:'inline-flex', alignItems:'center', gap:4 }}>
      <span style={{ width:6, height:6, borderRadius:'50%', background:c.dot, display:'inline-block' }}/>
      {stage}
    </span>
  );
}

function AddActivityModal({ leadId, onClose, onSaved }) {
  const [form, setForm] = useState({ activity_type:'call', subject:'', description:'' });
  const [saving, setSaving] = useState(false);
  const set = (k,v) => setForm(f=>({...f,[k]:v}));
  const typeIcon = { call:'📞', email:'✉️', meeting:'📅', note:'📝' };
  const submit = async e => {
    e.preventDefault(); setSaving(true);
    await api(`/api/leads/${leadId}/activities`, { method:'POST', body: JSON.stringify(form) });
    setSaving(false); onSaved();
  };
  return (
    <div style={{ position:'fixed', inset:0, background:'rgba(0,0,0,0.4)', zIndex:1000, display:'flex', alignItems:'center', justifyContent:'center' }}>
      <div style={{ background:'#fff', borderRadius:12, padding:24, width:400, boxShadow:'0 20px 40px rgba(0,0,0,0.15)' }}>
        <div className="flex justify-between items-center mb-4">
          <h3 className="text-base font-semibold text-gray-800">Add Activity</h3>
          <button onClick={onClose} className="text-gray-400 hover:text-gray-600 text-xl leading-none">&times;</button>
        </div>
        <form onSubmit={submit} className="space-y-3">
          <div>
            <label className="text-sm font-medium text-gray-700 block mb-1">Type</label>
            <select value={form.activity_type} onChange={e=>set('activity_type',e.target.value)} className="w-full">
              {['call','email','meeting','note'].map(t=><option key={t} value={t}>{typeIcon[t]} {t.charAt(0).toUpperCase()+t.slice(1)}</option>)}
            </select>
          </div>
          <div>
            <label className="text-sm font-medium text-gray-700 block mb-1">Subject</label>
            <input value={form.subject} onChange={e=>set('subject',e.target.value)} placeholder="e.g. Call to schedule meeting" className="w-full" required/>
          </div>
          <div>
            <label className="text-sm font-medium text-gray-700 block mb-1">Detail</label>
            <textarea value={form.description} onChange={e=>set('description',e.target.value)} rows={3} className="w-full" placeholder="Details..."/>
          </div>
          <div className="flex justify-end gap-2 pt-2">
            <button type="button" onClick={onClose} className="btn btn-secondary">Cancel</button>
            <button type="submit" className="btn btn-primary" disabled={saving}>{saving?<Spinner/>:'Save'}</button>
          </div>
        </form>
      </div>
    </div>
  );
}

function ConvertModal({ lead, onClose, onConverted }) {
  const [accounts, setAccounts] = useState([]);
  const [search, setSearch] = useState('');
  const [selected, setSelected] = useState(null);
  const [saving, setSaving] = useState(false);
  useEffect(()=>{ api('/api/accounts').then(d=>setAccounts(d||[])); },[]);
  const filtered = accounts.filter(a=>a.name.toLowerCase().includes(search.toLowerCase()));
  const confirm = async (accountId) => {
    setSaving(true);
    await api(`/api/leads/${lead.id}/convert`, { method:'POST', body: JSON.stringify({ account_id: accountId||null }) });
    setSaving(false); onConverted();
  };
  return (
    <div style={{ position:'fixed', inset:0, background:'rgba(0,0,0,0.4)', zIndex:1000, display:'flex', alignItems:'center', justifyContent:'center' }}>
      <div style={{ background:'#fff', borderRadius:12, padding:24, width:460, boxShadow:'0 20px 40px rgba(0,0,0,0.15)' }}>
        <div className="flex justify-between items-center mb-3">
          <h3 className="text-base font-semibold text-gray-800">🎉 Convert Lead</h3>
          <button onClick={onClose} className="text-gray-400 hover:text-gray-600 text-xl leading-none">&times;</button>
        </div>
        <p className="text-sm text-gray-500 mb-3">Link with an existing ERP Account (if not yet in ERP, click Skip)</p>
        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 Search account..." className="w-full mb-2"/>
        <div style={{ maxHeight:200, overflowY:'auto', border:'1px solid #e5e7eb', borderRadius:8 }}>
          {filtered.slice(0,30).map(a=>(
            <div key={a.id} onClick={()=>setSelected(a.id===selected?null:a.id)}
              style={{ padding:'8px 12px', cursor:'pointer', background: selected===a.id?'#eff6ff':'transparent',
                borderBottom:'1px solid #f3f4f6', fontSize:13 }}>
              {selected===a.id && '✓ '}{a.name}
            </div>
          ))}
          {filtered.length===0 && <div className="p-3 text-sm text-gray-400 text-center">No account found</div>}
        </div>
        <div className="flex justify-end gap-2 mt-4">
          <button onClick={onClose} className="btn btn-secondary">Cancel</button>
          <button onClick={()=>confirm(null)} className="btn btn-secondary" disabled={saving}>Skip (not linked yet)</button>
          <button onClick={()=>confirm(selected)} className="btn btn-primary" disabled={saving||!selected}>{saving?<Spinner/>:'Confirm & Link'}</button>
        </div>
      </div>
    </div>
  );
}

function LeadDetail({ lead: initLead, user, onBack, onUpdated }) {
  const [lead, setLead] = useState(initLead);
  const [activities, setActivities] = useState([]);
  const [users, setUsers] = useState([]);
  const [editing, setEditing] = useState(false);
  const [form, setForm] = useState({});
  const [showAddActivity, setShowAddActivity] = useState(false);
  const [showConvert, setShowConvert] = useState(false);
  const [saving, setSaving] = useState(false);
  const set = (k,v) => setForm(f=>({...f,[k]:v}));
  const typeIcon  = { call:'📞', email:'✉️', meeting:'📅', note:'📝' };
  const typeColor = { call:'#2563eb', email:'#7c3aed', meeting:'#16a34a', note:'#d97706' };
  const typeLabel = { call:'Call', email:'Email', meeting:'Meeting', note:'Note' };

  const reload = () => api(`/api/leads/${lead.id}`).then(d=>{ if(d&&d.id) setLead(d); });
  const reloadAct = () => api(`/api/leads/${lead.id}/activities`).then(d=>setActivities(d||[]));

  useEffect(()=>{
    reloadAct();
    api('/api/users').then(d=>setUsers(d||[]));
  },[lead.id]);

  const POSITIONS = ['Store Staff','Store Manager','Owner','Purchasing','Chef'];
  const startEdit = () => {
    setForm({ company_name:lead.company_name, contact_name:lead.contact_name||'',
      contact_phone:lead.contact_phone||'', contact_email:lead.contact_email||'',
      contact_position:lead.contact_position||'', branch:lead.branch||'',
      stage:lead.stage, owner_user_id:lead.owner_user_id||'', description:lead.description||'' });
    setEditing(true);
  };
  const saveEdit = async () => {
    setSaving(true);
    await api(`/api/leads/${lead.id}`, { method:'PUT', body: JSON.stringify({...form, owner_user_id: form.owner_user_id||null}) });
    setSaving(false); setEditing(false); reload(); onUpdated && onUpdated();
  };
  const deleteLead = async () => {
    if (!confirm(`Delete lead "${lead.company_name}"?`)) return;
    await api(`/api/leads/${lead.id}`, { method:'DELETE' });
    onBack(); onUpdated && onUpdated();
  };

  const fmt = ts => ts ? ts.replace('T',' ').slice(0,16) : '-';
  const isWon = lead.stage === 'Closed Win';
  const isLost = lead.stage === 'Closed Lost';
  const isClosed = isWon || isLost;

  return (
    <div style={{ padding:24, maxWidth:800, margin:'0 auto' }}>
      {showAddActivity && <AddActivityModal leadId={lead.id} onClose={()=>setShowAddActivity(false)} onSaved={()=>{ setShowAddActivity(false); reloadAct(); }}/>}
      {showConvert && <ConvertModal lead={lead} onClose={()=>setShowConvert(false)} onConverted={()=>{ setShowConvert(false); reload(); onUpdated&&onUpdated(); }}/>}

      <div className="flex items-center gap-3 mb-4">
        <button onClick={onBack} className="btn btn-secondary" style={{padding:'4px 12px'}}>← Back</button>
        <span className="text-gray-400 text-sm font-mono">{lead.lead_no}</span>
        <StageBadge stage={lead.stage}/>
        <div className="ml-auto flex gap-2">
          {!isClosed && <button onClick={startEdit} className="btn btn-secondary">Edit</button>}
          {isWon && !lead.converted_account_id && <button onClick={()=>setShowConvert(true)} className="btn btn-primary">🔗 Link ERP Account</button>}
          <button onClick={deleteLead} className="btn btn-secondary" style={{color:'#ef4444'}}>Delete</button>
        </div>
      </div>

      {editing ? (
        <div style={{ background:'#fff', border:'1px solid #e5e7eb', borderRadius:12, padding:20, marginBottom:20 }}>
          <div className="grid grid-cols-2 gap-4">
            <div className="col-span-2">
              <label className="text-sm font-medium text-gray-700 block mb-1">Company / Shop *</label>
              <input value={form.company_name} onChange={e=>set('company_name',e.target.value)} className="w-full" required/>
            </div>
            <div>
              <label className="text-sm font-medium text-gray-700 block mb-1">Contact Name</label>
              <input value={form.contact_name} onChange={e=>set('contact_name',e.target.value)} className="w-full"/>
            </div>
            <div>
              <label className="text-sm font-medium text-gray-700 block mb-1">Phone</label>
              <input value={form.contact_phone} onChange={e=>set('contact_phone',e.target.value)} className="w-full"/>
            </div>
            <div>
              <label className="text-sm font-medium text-gray-700 block mb-1">Position</label>
              <select value={form.contact_position} onChange={e=>set('contact_position',e.target.value)} className="w-full">
                <option value="">— Select position —</option>
                {POSITIONS.map(p=><option key={p} value={p}>{p}</option>)}
              </select>
            </div>
            <div>
              <label className="text-sm font-medium text-gray-700 block mb-1">Outlet(s)</label>
              <input type="number" min="1" value={form.branch} onChange={e=>set('branch',e.target.value)} className="w-full"/>
            </div>
            <div>
              <label className="text-sm font-medium text-gray-700 block mb-1">Email</label>
              <input value={form.contact_email} onChange={e=>set('contact_email',e.target.value)} className="w-full"/>
            </div>
            <div>
              <label className="text-sm font-medium text-gray-700 block mb-1">Stage</label>
              <select value={form.stage} onChange={e=>set('stage',e.target.value)} className="w-full">
                {LEAD_STAGES.map(s=><option key={s} value={s}>{s}</option>)}
              </select>
            </div>
            <div>
              <label className="text-sm font-medium text-gray-700 block mb-1">Owner</label>
              <select value={form.owner_user_id} onChange={e=>set('owner_user_id',e.target.value)} className="w-full">
                <option value="">— Unassigned —</option>
                {users.map(u=><option key={u.id} value={u.id}>{u.display_name}</option>)}
              </select>
            </div>
            <div className="col-span-2">
              <label className="text-sm font-medium text-gray-700 block mb-1">Notes</label>
              <textarea value={form.description} onChange={e=>set('description',e.target.value)} rows={3} className="w-full"/>
            </div>
          </div>
          <div className="flex gap-2 mt-3">
            <button onClick={saveEdit} className="btn btn-primary" disabled={saving}>{saving?<Spinner/>:'Save'}</button>
            <button onClick={()=>setEditing(false)} className="btn btn-secondary">Cancel</button>
          </div>
        </div>
      ) : (
        <div style={{ background:'#fff', border:'1px solid #e5e7eb', borderRadius:12, padding:20, marginBottom:20 }}>
          <h2 className="text-xl font-bold text-gray-800 mb-3">{lead.company_name}</h2>
          <div className="grid grid-cols-2 gap-x-8 gap-y-2 text-sm">
            <div><span className="text-gray-400">Contact:</span> <span className="text-gray-700 font-medium">{lead.contact_name||'-'}</span></div>
            <div><span className="text-gray-400">Phone:</span> <span className="text-gray-700 font-medium">{lead.contact_phone||'-'}</span></div>
            <div><span className="text-gray-400">Position:</span> <span className="text-gray-700 font-medium">{lead.contact_position||'-'}</span></div>
            <div><span className="text-gray-400">Outlet(s):</span> <span className="text-gray-700 font-medium">{lead.branch||'-'}</span></div>
            <div><span className="text-gray-400">Email:</span> <span className="text-gray-700 font-medium">{lead.contact_email||'-'}</span></div>
            <div><span className="text-gray-400">Owner:</span> <span className="text-gray-700 font-medium">{lead.owner_name||'-'}</span></div>
            <div><span className="text-gray-400">Created:</span> <span className="text-gray-700">{fmt(lead.created_at)}</span></div>
            {lead.converted_at && <div><span className="text-gray-400">Converted:</span> <span className="text-gray-700">{fmt(lead.converted_at)}</span></div>}
            {isLost && lead.lost_from_stage && (
              <div className="col-span-2">
                <span className="text-gray-400">Lost at stage:</span>{' '}
                <span className="font-semibold text-red-600">{lead.lost_from_stage}</span>
              </div>
            )}
          </div>
          {lead.description && <p className="mt-3 text-sm text-gray-600 border-t pt-3">{lead.description}</p>}
          {isWon && lead.converted_account_id && (
            <div className="mt-3 flex items-center gap-2 text-sm text-green-700 bg-green-50 rounded-lg px-3 py-2">
              <span>🔗 Linked ERP Account:</span><strong>{lead.converted_account_name}</strong>
            </div>
          )}
          {isWon && !lead.converted_account_id && (
            <div className="mt-3 flex items-center gap-2 text-sm text-amber-700 bg-amber-50 rounded-lg px-3 py-2">
              <span>⚠️ ERP Account not linked</span>
            </div>
          )}
        </div>
      )}

      {/* Activity Log */}
      <div style={{ background:'#fff', border:'1px solid #e5e7eb', borderRadius:12, padding:20 }}>
        <div className="flex justify-between items-center mb-4">
          <h3 className="text-base font-semibold text-gray-800">Activity Log</h3>
          <button onClick={()=>setShowAddActivity(true)} className="btn btn-primary" style={{fontSize:12,padding:'4px 12px'}}>+ Add Activity</button>
        </div>
        {activities.length === 0 && <p className="text-sm text-gray-400 text-center py-4">No activities yet</p>}
        <div className="space-y-1">
          {activities.map((a, i) => {
            const color = typeColor[a.activity_type] || '#9ca3af';
            return (
              <div key={a.id} className="flex gap-3 relative">
                {i < activities.length - 1 && <div className="timeline-line"/>}
                <div className="tl-dot" style={{background: color+'22', border:`2px solid ${color}`}}>
                  <span style={{fontSize:13}}>{typeIcon[a.activity_type]||'📌'}</span>
                </div>
                <div className="flex-1 pb-4">
                  <div className="flex items-center gap-2 flex-wrap">
                    <span className="font-semibold text-sm" style={{color}}>{typeLabel[a.activity_type]||a.activity_type}</span>
                    {a.subject && <span className="font-medium text-sm text-gray-800">{a.subject}</span>}
                    <span className="text-xs text-gray-400 ml-auto">{fmt(a.created_at)}</span>
                    {a.created_by && <span className="text-xs text-gray-400">· {a.created_by}</span>}
                  </div>
                  {a.description && (
                    <div className="mt-1.5 text-sm text-gray-700 bg-gray-50 rounded-lg p-3 border border-gray-100">
                      {a.description}
                    </div>
                  )}
                </div>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

function Pipeline({ user }) {
  const [leads, setLeads] = useState([]);
  const [loading, setLoading] = useState(true);
  const [view, setView] = useState('kanban');
  const [filterStage, setFilterStage] = useState('');
  const [filterOwner, setFilterOwner] = useState('');
  const [users, setUsers] = useState([]);
  const [selectedLead, setSelectedLead] = useState(null);
  const [showCreate, setShowCreate] = useState(false);
  const isAdmin = user.role === 'admin';

  const reload = () => {
    setLoading(true);
    const params = new URLSearchParams();
    if (filterStage) params.append('stage', filterStage);
    if (isAdmin && filterOwner) params.append('owner_user_id', filterOwner);
    api('/api/leads?' + params).then(d=>{ setLeads(Array.isArray(d)?d:[]); setLoading(false); }).catch(()=>setLoading(false));
  };

  useEffect(()=>{ if (isAdmin) api('/api/users?has_leads=1').then(d=>setUsers(d||[])); },[]);
  useEffect(()=>{ reload(); }, [filterStage, filterOwner]);

  if (selectedLead) return <LeadDetail lead={selectedLead} user={user} onBack={()=>setSelectedLead(null)} onUpdated={reload}/>;

  return (
    <div style={{ padding:24, height:'100%', overflowY:'auto' }}>
      {showCreate && <CreateLeadModal users={users} currentUser={user} onClose={()=>setShowCreate(false)} onCreated={()=>{ setShowCreate(false); reload(); }}/>}

      {/* Header */}
      <div className="flex justify-between items-center mb-4">
        <h1 className="text-xl font-bold text-gray-800">Leads</h1>
        <div className="flex gap-2 items-center">
          <div style={{ display:'flex', border:'1px solid #e5e7eb', borderRadius:8, overflow:'hidden' }}>
            <button onClick={()=>setView('kanban')} style={{ padding:'5px 14px', fontSize:13, background:view==='kanban'?'#1e40af':'#fff', color:view==='kanban'?'#fff':'#6b7280', border:'none', cursor:'pointer' }}>⊞ Kanban</button>
            <button onClick={()=>setView('list')} style={{ padding:'5px 14px', fontSize:13, background:view==='list'?'#1e40af':'#fff', color:view==='list'?'#fff':'#6b7280', border:'none', cursor:'pointer' }}>≡ List</button>
          </div>
          <button onClick={()=>setShowCreate(true)} className="btn btn-primary">+ New Lead</button>
        </div>
      </div>

      {/* Filters */}
      <div className="flex gap-3 mb-5">
        <select value={filterStage} onChange={e=>setFilterStage(e.target.value)} style={{ fontSize:13, padding:'5px 10px', border:'1px solid #e5e7eb', borderRadius:7 }}>
          <option value="">All Stages</option>
          {LEAD_STAGES.map(s=><option key={s} value={s}>{s}</option>)}
        </select>
        {isAdmin && (
          <select value={filterOwner} onChange={e=>setFilterOwner(e.target.value)} style={{ fontSize:13, padding:'5px 10px', border:'1px solid #e5e7eb', borderRadius:7 }}>
            <option value="">All Owners</option>
            {users.map(u=><option key={u.id} value={u.id}>{u.display_name}</option>)}
          </select>
        )}
      </div>

      {loading ? <div className="flex justify-center py-12"><Spinner/></div> : view === 'kanban'
        ? <KanbanView leads={leads} user={user} onSelect={setSelectedLead} onStageChange={reload} users={users}/>
        : <ListView leads={leads} user={user} onSelect={setSelectedLead} onReassigned={reload} users={users}/>
      }
    </div>
  );
}

function KanbanView({ leads, user, onSelect, onStageChange, users }) {
  const [reassignLead, setReassignLead] = useState(null);
  const isAdmin = user.role === 'admin';

  const changeStage = async (lead, newStage) => {
    await api(`/api/leads/${lead.id}`, { method:'PUT', body: JSON.stringify({
      company_name: lead.company_name, contact_name: lead.contact_name,
      contact_phone: lead.contact_phone, contact_email: lead.contact_email,
      stage: newStage, owner_user_id: lead.owner_user_id, description: lead.description
    })});
    onStageChange();
  };

  return (
    <>
      {reassignLead && <ReassignModal lead={reassignLead} users={users} onClose={()=>setReassignLead(null)} onReassigned={()=>{ setReassignLead(null); onStageChange(); }}/>}
      <div style={{ display:'flex', gap:12, overflowX:'auto', paddingBottom:16, alignItems:'flex-start' }}>
        {LEAD_STAGES.map(stage => {
          const c = STAGE_COLORS[stage];
          const stageLeads = leads.filter(l=>l.stage===stage);
          return (
            <div key={stage} style={{ minWidth:220, flex:'0 0 220px' }}>
              <div style={{ background:c.bg, border:`1px solid ${c.border}`, borderRadius:10, padding:'10px 12px', marginBottom:10 }}>
                <div style={{ fontWeight:700, color:c.text, fontSize:13 }}>{stage}</div>
                <div style={{ fontSize:11, color:c.text, opacity:0.7 }}>{stageLeads.length} lead{stageLeads.length!==1?'s':''}</div>
              </div>
              <div className="space-y-2">
                {stageLeads.map(lead=>{
                  const untouched = isUntouched(lead);
                  return (
                    <div key={lead.id} onClick={()=>onSelect(lead)}
                      style={{ background:'#fff', border:`1px solid ${untouched?'#fca5a5':'#e5e7eb'}`, borderRadius:10, padding:12,
                        cursor:'pointer', boxShadow:'0 1px 3px rgba(0,0,0,0.05)', transition:'box-shadow 0.15s' }}
                      onMouseEnter={e=>e.currentTarget.style.boxShadow='0 4px 12px rgba(0,0,0,0.1)'}
                      onMouseLeave={e=>e.currentTarget.style.boxShadow='0 1px 3px rgba(0,0,0,0.05)'}>
                      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', marginBottom:4 }}>
                        <div style={{ fontWeight:500, color:'#1f2937', fontSize:13 }}>{lead.company_name}</div>
                        {untouched && <span style={{ fontSize:10, background:'#fef2f2', color:'#dc2626', border:'1px solid #fca5a5', borderRadius:4, padding:'1px 5px', fontWeight:700, whiteSpace:'nowrap', marginLeft:4, flexShrink:0 }}>🔴 Untouched</span>}
                      </div>
                      {lead.contact_name && <div style={{ fontSize:11, color:'#9ca3af', marginBottom:4 }}>{lead.contact_name}</div>}
                      {stage === 'Closed Lost' && lead.lost_from_stage && (
                        <div style={{ marginBottom:6 }}>
                          <span style={{ fontSize:10, background:'#fef2f2', color:'#991b1b', border:'1px solid #fca5a5', borderRadius:4, padding:'1px 6px' }}>
                            Lost @ {lead.lost_from_stage}
                          </span>
                        </div>
                      )}
                      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:4 }}>
                        <span style={{ fontSize:11, color:'#6b7280' }}>{lead.owner_name||'—'}</span>
                        <span style={{ fontSize:11, color: untouched?'#dc2626':'#9ca3af' }}>{lastActivityLabel(lead)}</span>
                      </div>
                      {isAdmin && untouched && (
                        <div onClick={e=>e.stopPropagation()} style={{ marginBottom:6 }}>
                          <button onClick={()=>setReassignLead(lead)}
                            style={{ fontSize:11, padding:'2px 8px', border:'1px solid #fca5a5', borderRadius:4, background:'#fef2f2', color:'#dc2626', cursor:'pointer', width:'100%' }}>
                            Reassign
                          </button>
                        </div>
                      )}
                      <div onClick={e=>e.stopPropagation()}>
                        <select value={lead.stage} onChange={e=>changeStage(lead,e.target.value)}
                          style={{ fontSize:11, padding:'2px 6px', border:'1px solid #e5e7eb', borderRadius:5, width:'100%', color:'#6b7280' }}>
                          {LEAD_STAGES.map(s=><option key={s} value={s}>{s}</option>)}
                        </select>
                      </div>
                    </div>
                  );
                })}
                {stageLeads.length===0 && <div style={{ border:'1px dashed #e5e7eb', borderRadius:10, padding:'16px 0', textAlign:'center', fontSize:12, color:'#d1d5db' }}>No leads</div>}
              </div>
            </div>
          );
        })}
      </div>
    </>
  );
}

function ListView({ leads, user, onSelect, onReassigned, users }) {
  const [reassignLead, setReassignLead] = useState(null);
  const isAdmin = user.role === 'admin';
  const cols = ['Lead No','Company/Store','Contact','Stage','Owner','Last Activity', ...(isAdmin?['']:[] )];
  return (
    <>
      {reassignLead && <ReassignModal lead={reassignLead} users={users} onClose={()=>setReassignLead(null)} onReassigned={()=>{ setReassignLead(null); onReassigned(); }}/>}
      <div style={{ background:'#fff', border:'1px solid #e5e7eb', borderRadius:12, overflow:'hidden' }}>
        <table style={{ width:'100%', borderCollapse:'collapse' }}>
          <thead>
            <tr style={{ background:'#f9fafb', borderBottom:'1px solid #e5e7eb' }}>
              {cols.map(h=>(
                <th key={h} style={{ padding:'10px 16px', textAlign:'left', fontSize:12, fontWeight:600, color:'#6b7280' }}>{h}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {leads.length===0 && (
              <tr><td colSpan={cols.length} style={{ padding:32, textAlign:'center', color:'#9ca3af', fontSize:14 }}>No leads</td></tr>
            )}
            {leads.map(l=>{
              const untouched = isUntouched(l);
              return (
                <tr key={l.id} onClick={()=>onSelect(l)}
                  style={{ borderBottom:'1px solid #f3f4f6', cursor:'pointer', background: untouched?'#fffbfb':'transparent' }}
                  onMouseEnter={e=>e.currentTarget.style.background=untouched?'#fef2f2':'#f9fafb'}
                  onMouseLeave={e=>e.currentTarget.style.background=untouched?'#fffbfb':'transparent'}>
                  <td style={{ padding:'10px 16px', fontSize:13, fontFamily:'monospace', color:'#6b7280' }}>{l.lead_no}</td>
                  <td style={{ padding:'10px 16px', fontSize:13, fontWeight:500, color:'#1f2937' }}>
                    <div style={{ display:'flex', alignItems:'center', gap:6 }}>
                      {l.company_name}
                      {untouched && <span style={{ fontSize:10, background:'#fef2f2', color:'#dc2626', border:'1px solid #fca5a5', borderRadius:4, padding:'1px 5px', fontWeight:700, whiteSpace:'nowrap' }}>🔴 Untouched</span>}
                    </div>
                  </td>
                  <td style={{ padding:'10px 16px', fontSize:13, color:'#6b7280' }}>{l.contact_name||'-'}</td>
                  <td style={{ padding:'10px 16px' }}>
                    <StageBadge stage={l.stage}/>
                    {l.stage === 'Closed Lost' && l.lost_from_stage && (
                      <div style={{ fontSize:10, color:'#991b1b', marginTop:2 }}>@ {l.lost_from_stage}</div>
                    )}
                  </td>
                  <td style={{ padding:'10px 16px', fontSize:13, color:'#6b7280' }}>{l.owner_name||'-'}</td>
                  <td style={{ padding:'10px 16px', fontSize:12, color: untouched?'#dc2626':'#9ca3af' }}>{lastActivityLabel(l)}</td>
                  {isAdmin && <td onClick={e=>e.stopPropagation()} style={{ padding:'6px 16px' }}>
                    {untouched && <button onClick={()=>setReassignLead(l)}
                      style={{ fontSize:11, padding:'3px 10px', border:'1px solid #fca5a5', borderRadius:4, background:'#fef2f2', color:'#dc2626', cursor:'pointer', whiteSpace:'nowrap' }}>
                      Reassign
                    </button>}
                  </td>}
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    </>
  );
}

function CreateLeadModal({ users, currentUser, onClose, onCreated }) {
  const myId = currentUser.id || currentUser.user_id;
  const isAdmin = currentUser.role === 'admin';
  const salesUsers = users.filter(u => u.role === 'sales' || u.role === 'admin');
  const POSITIONS = ['Store Staff','Store Manager','Owner','Purchasing','Chef'];
  const [form, setForm] = useState({
    company_name:'', contact_name:'', contact_phone:'', contact_email:'',
    contact_position:'', branch:'',
    stage:'Cold Call/Email', owner_user_id: myId, description:''
  });
  const [saving, setSaving] = useState(false);
  const [err, setErr] = useState('');
  const set = (k,v) => setForm(f=>({...f,[k]:v}));
  const submit = async e => {
    e.preventDefault(); setSaving(true); setErr('');
    try {
      const res = await api('/api/leads', { method:'POST', body: JSON.stringify(form) });
      if (res && res.id) { onCreated(); }
      else { setErr(res?.error || 'An error occurred. Please try again.'); setSaving(false); }
    } catch(e) { setErr('Unable to connect to server. Please try again.'); setSaving(false); }
  };
  return (
    <div style={{ position:'fixed', inset:0, background:'rgba(0,0,0,0.4)', zIndex:1000, display:'flex', alignItems:'center', justifyContent:'center' }}>
      <div style={{ background:'#fff', borderRadius:12, padding:24, width:500, boxShadow:'0 20px 40px rgba(0,0,0,0.15)', maxHeight:'90vh', overflowY:'auto' }}>
        <div className="flex justify-between items-center mb-4">
          <h3 className="text-base font-semibold text-gray-800">New Lead</h3>
          <button onClick={onClose} className="text-gray-400 hover:text-gray-600 text-xl leading-none">&times;</button>
        </div>
        <form onSubmit={submit} className="space-y-3">
          <div>
            <label className="text-sm font-medium text-gray-700 block mb-1">Company / Shop *</label>
            <input value={form.company_name} onChange={e=>set('company_name',e.target.value)} className="w-full" required placeholder="Company or shop name"/>
          </div>
          <div className="grid grid-cols-2 gap-3">
            <div>
              <label className="text-sm font-medium text-gray-700 block mb-1">Contact Name *</label>
              <input value={form.contact_name} onChange={e=>set('contact_name',e.target.value)} className="w-full" required placeholder="Full name"/>
            </div>
            <div>
              <label className="text-sm font-medium text-gray-700 block mb-1">Phone *</label>
              <input value={form.contact_phone} onChange={e=>set('contact_phone',e.target.value)} className="w-full" required placeholder="0xx-xxx-xxxx"/>
            </div>
          </div>
          <div className="grid grid-cols-2 gap-3">
            <div>
              <label className="text-sm font-medium text-gray-700 block mb-1">Position *</label>
              <select value={form.contact_position} onChange={e=>set('contact_position',e.target.value)} className="w-full" required>
                <option value="">— Select position —</option>
                {POSITIONS.map(p=><option key={p} value={p}>{p}</option>)}
              </select>
            </div>
            <div>
              <label className="text-sm font-medium text-gray-700 block mb-1">Outlet(s) *</label>
              <input type="number" min="1" value={form.branch} onChange={e=>set('branch',e.target.value)} className="w-full" required placeholder="No. of outlets"/>
            </div>
          </div>
          <div>
            <label className="text-sm font-medium text-gray-700 block mb-1">Email</label>
            <input value={form.contact_email} onChange={e=>set('contact_email',e.target.value)} className="w-full" placeholder="email@example.com"/>
          </div>
          <div className="grid grid-cols-2 gap-3">
            <div>
              <label className="text-sm font-medium text-gray-700 block mb-1">Stage</label>
              <select value={form.stage} onChange={e=>set('stage',e.target.value)} className="w-full">
                {LEAD_STAGES.map(s=><option key={s} value={s}>{s}</option>)}
              </select>
            </div>
            <div>
              <label className="text-sm font-medium text-gray-700 block mb-1">Owner</label>
              {isAdmin
                ? <select value={form.owner_user_id} onChange={e=>set('owner_user_id',e.target.value)} className="w-full">
                    <option value="">— Unassigned —</option>
                    {salesUsers.map(u=><option key={u.id} value={u.id}>{u.display_name}</option>)}
                  </select>
                : <input value={currentUser.display_name||currentUser.username} disabled style={{background:'#f9fafb',color:'#6b7280'}}/>
              }
            </div>
          </div>
          <div>
            <label className="text-sm font-medium text-gray-700 block mb-1">Notes</label>
            <textarea value={form.description} onChange={e=>set('description',e.target.value)} rows={3} className="w-full" placeholder="Additional details..."/>
          </div>
          {err && <div style={{color:'#dc2626',fontSize:12,background:'#fef2f2',padding:'8px 12px',borderRadius:6}}>{err}</div>}
          <div className="flex justify-end gap-2 pt-2">
            <button type="button" onClick={onClose} className="btn btn-secondary">Cancel</button>
            <button type="submit" className="btn btn-primary" disabled={saving}>{saving?<Spinner/>:'Create Lead'}</button>
          </div>
        </form>
      </div>
    </div>
  );
}
