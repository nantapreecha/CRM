<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>SMM Sourcing CRM</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
  :root {
    --primary:#111827; --primary-light:#1f2937; --primary-bg:#f3f4f6;
    --border:#e5e7eb; --text:#111827; --text-muted:#6b7280; --text-label:#374151;
    --bg:#f9fafb; --bg-card:#fff; --bg-header:#f9fafb;
    --cx:#1589EE; --sales-kam:#2E844A; --sales-co:#DD7A01;
    --merchandise:#9050E9; --inbound:#C23934; --outbound:#0EBEC9; --customer:#747474;
    --sidebar-bg:#ffffff; --sidebar-border:#e5e7eb;
    --sidebar-text:#6b7280; --sidebar-active-bg:#f3f4f6; --sidebar-active-text:#111827;
    --sidebar-hover-bg:#f9fafb;
    --input-focus:#111827;
  }
  body { font-family:'Inter',system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--text); font-size:13px; }

  /* ── Sidebar ── */
  .sidebar { background:var(--sidebar-bg); width:220px; flex-shrink:0; position:sticky; top:0; height:100vh; overflow-y:auto; border-right:1px solid var(--sidebar-border); display:flex; flex-direction:column; }
  .sidebar-brand { padding:14px 16px; border-bottom:1px solid var(--sidebar-border); display:flex; align-items:center; gap:10px; flex-shrink:0; }
  .sidebar-logo { width:28px; height:28px; background:#dc2626; border-radius:6px; display:flex; align-items:center; justify-content:center; color:#fff; font-size:11px; font-weight:700; flex-shrink:0; }
  .sidebar-title { font-size:13px; font-weight:600; color:var(--text); line-height:1.2; }
  .sidebar-subtitle { font-size:10px; color:var(--text-muted); }
  .sidebar-section-label { font-size:10px; font-weight:600; color:var(--text-muted); text-transform:uppercase; letter-spacing:.06em; padding:14px 16px 6px; }
  .sidebar-nav { flex:1; padding:6px 8px; overflow-y:auto; }
  .sidebar-nav a, .nav-btn { display:flex; align-items:center; gap:8px; padding:7px 10px; border-radius:6px; color:var(--sidebar-text); font-size:13px; font-weight:500; text-decoration:none; cursor:pointer; border:none; background:none; width:100%; text-align:left; transition:background .1s,color .1s; }
  .sidebar-nav a:hover, .nav-btn:hover { background:var(--sidebar-hover-bg); color:var(--sidebar-active-text); }
  .sidebar-nav a.active, .nav-btn.active { background:var(--sidebar-active-bg); color:var(--sidebar-active-text); font-weight:600; }
  .nav-icon { width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:1.75; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0; }
  .sidebar-footer { padding:10px 14px; border-top:1px solid var(--sidebar-border); display:flex; align-items:center; gap:8px; flex-shrink:0; }
  .sidebar-avatar { width:28px; height:28px; border-radius:50%; background:#111827; color:#fff; font-size:11px; font-weight:600; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .sidebar-user-name { font-size:12px; font-weight:600; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sidebar-user-role { font-size:10px; color:var(--text-muted); }
  .sidebar-logout-btn { background:none; border:none; cursor:pointer; color:var(--text-muted); padding:4px; border-radius:4px; display:flex; align-items:center; margin-left:auto; flex-shrink:0; }
  .sidebar-logout-btn:hover { color:#ef4444; background:#fef2f2; }

  /* ── Buttons ── */
  .btn { padding:7px 14px; border-radius:6px; font-size:13px; cursor:pointer; border:1px solid transparent; transition:all .15s; font-weight:500; display:inline-flex; align-items:center; gap:6px; }
  .btn:disabled { opacity:.5; cursor:not-allowed; }
  .btn-primary { background:#111827; color:#fff; border-color:#111827; }
  .btn-primary:hover:not(:disabled) { background:#1f2937; border-color:#1f2937; }
  .btn-secondary { background:#fff; color:var(--text); border-color:var(--border); }
  .btn-secondary:hover:not(:disabled) { background:var(--bg); border-color:#9ca3af; }
  .btn-danger { background:#fff; color:#dc2626; border-color:#dc2626; }
  .btn-danger:hover:not(:disabled) { background:#fef2f2; }

  /* ── Cards ── */
  .card { background:var(--bg-card); border-radius:8px; border:1px solid var(--border); }
  .card-header { background:var(--bg-header); border-bottom:1px solid var(--border); padding:10px 16px; border-radius:8px 8px 0 0; font-weight:600; font-size:13px; color:var(--text); display:flex; align-items:center; gap:8px; }

  /* ── Status badges ── */
  .status-open { color:#0176D3; background:#EEF4FF; border:1px solid #B3D4FF; border-radius:4px; padding:2px 8px; font-size:11px; font-weight:700; letter-spacing:.03em; }
  .status-in_progress { color:#DD7A01; background:#FFF3E0; border:1px solid #FFD699; border-radius:4px; padding:2px 8px; font-size:11px; font-weight:700; letter-spacing:.03em; }
  .status-pending_ack { color:#9050E9; background:#F5F0FF; border:1px solid #CDB4F8; border-radius:4px; padding:2px 8px; font-size:11px; font-weight:700; letter-spacing:.03em; }
  .status-pending_fault { color:#C23934; background:#FFF0EE; border:1px solid #FFBCB4; border-radius:4px; padding:2px 8px; font-size:11px; font-weight:700; letter-spacing:.03em; }
  .status-closed { color:#3E3E3C; background:#F3F3F3; border:1px solid var(--border); border-radius:4px; padding:2px 8px; font-size:11px; font-weight:700; letter-spacing:.03em; }

  /* ── Priority ── */
  .priority-Urgent { color:#C23934; font-weight:700; }
  .priority-High { color:#DD7A01; font-weight:600; }
  .priority-Medium { color:#706E6B; font-weight:500; }
  .priority-Low { color:#2E844A; font-weight:500; }

  /* ── Forms ── */
  input, select, textarea { border:1px solid var(--border); border-radius:4px; padding:7px 10px; width:100%; outline:none; font-size:13px; color:var(--text); background:#fff; transition:border-color .15s,box-shadow .15s; font-family:inherit; }
  input:focus, select:focus, textarea:focus { border-color:var(--input-focus); box-shadow:0 0 0 3px rgba(17,24,39,.1); }
  label { font-size:11px; font-weight:700; color:var(--text-label); display:block; margin-bottom:4px; letter-spacing:.04em; text-transform:uppercase; }

  /* ── Tabs ── */
  .tab { padding:10px 18px; cursor:pointer; border-bottom:2px solid transparent; color:var(--text-muted); font-size:13px; white-space:nowrap; font-weight:500; transition:color .15s; }
  .tab.active { color:#111827; border-color:#111827; font-weight:600; }
  .tab:hover { color:var(--text); }

  /* ── Tables ── */
  thead th { background:var(--bg-header); color:var(--text-label); font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; padding:9px 12px; border-bottom:1px solid var(--border); text-align:left; }
  tbody td { padding:9px 12px; border-bottom:1px solid var(--border); color:var(--text); font-size:13px; }
  tbody tr:last-child td { border-bottom:none; }
  tbody tr:hover td { background:var(--bg); }

  /* ── Misc ── */
  .badge { background:#C23934; color:#fff; border-radius:12px; padding:1px 7px; font-size:11px; font-weight:600; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .spin { animation:spin .8s linear infinite; display:inline-block; }
  .timeline-line { position:absolute; left:13px; top:28px; bottom:0; width:2px; background:var(--border); }
  .tl-dot { width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:12px; flex-shrink:0; z-index:1; }
  .fault-btn { border:1px solid var(--border); border-radius:4px; padding:10px 12px; cursor:pointer; text-align:center; transition:all .15s; font-size:12px; background:#fff; }
  .fault-btn:hover { border-color:var(--primary); background:var(--primary-bg); }
  .fault-btn.selected { border-color:var(--primary); background:var(--primary-bg); color:var(--primary); font-weight:600; box-shadow:0 0 0 1px var(--primary); }
  .checkbox-team { display:flex; align-items:center; gap:8px; padding:8px 12px; border:1px solid var(--border); border-radius:4px; cursor:pointer; transition:all .15s; font-size:13px; background:#fff; }
  .checkbox-team:hover { border-color:#9e9e9e; }
  .checkbox-team.checked { border-color:var(--primary); background:var(--primary-bg); color:var(--primary); font-weight:500; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;
const API = '';

// ── auth helpers ─────────────────────────────────────────────────────────────
const getToken = () => localStorage.getItem('crm_token');
const setToken = t => localStorage.setItem('crm_token', t);
const clearToken = () => localStorage.removeItem('crm_token');

async function api(path, opts = {}) {
  const token = getToken();
  const headers = { 'Content-Type': 'application/json', ...(opts.headers || {}) };
  if (token) headers['Authorization'] = 'Bearer ' + token;
  const res = await fetch(API + path, { ...opts, headers });
  if (res.status === 401) { clearToken(); window.location.reload(); return; }
  return res.json();
}

async function apiUpload(path, formData) {
  const token = getToken();
  const headers = {};
  if (token) headers['Authorization'] = 'Bearer ' + token;
  const res = await fetch(API + path, { method: 'POST', body: formData, headers });
  return res.json();
}

// ── constants ─────────────────────────────────────────────────────────────────
const TEAMS = ['CX', 'Sales/KAM', 'Sales Co', 'Merchandise', 'Inbound', 'Outbound'];
const FAULT_TEAMS = [...TEAMS, 'Customer'];
const CASE_TYPES = ['Complain', 'Claim', 'Update Invoice', 'วางบิล'];
const CLAIM_SUBTYPES = ['ด่วน (ภายในวัน)', 'รอรอบถัดไป (ไม่รู้วัน)', 'รอรอบถัดไป (รู้วันแล้ว)'];
const ROOT_CAUSES = ['สินค้าตกหล่น', 'คุณภาพไม่ผ่าน/ไม่ได้ spec', 'น้ำหนักไม่ครบ', 'ส่งผิด SKU', 'เอกสารผิดพลาด', 'อื่นๆ'];
const PRIORITIES = ['High', 'Medium'];

const TEAM_ICONS = {
  'CX':'', 'Sales/KAM':'', 'Sales Co':'', 'Merchandise':'',
  'Inbound':'', 'Outbound':'', 'Customer':''
};

const TEAM_COLORS = {
  'CX':'#1589EE', 'Sales/KAM':'#2E844A', 'Sales Co':'#DD7A01',
  'Merchandise':'#9050E9', 'Inbound':'#C23934', 'Outbound':'#0EBEC9',
  'Customer':'#747474', 'ยังไม่ระบุ':'#BDBDBD'
};

const STATUS_LABELS = {
  open: 'Open', in_progress: 'In Progress',
  pending_ack: 'Pending Acknowledge', pending_fault: 'Pending Fault Attribution', closed: 'Closed'
};

function fmtDuration(sec) {
  if (!sec && sec !== 0) return '';
  if (sec < 60) return `${sec}วิ`;
  if (sec < 3600) return `${Math.floor(sec/60)}น.`;
  if (sec < 86400) return `${Math.floor(sec/3600)}ชม.${Math.floor((sec%3600)/60)}น.`;
  return `${Math.floor(sec/86400)}วัน ${Math.floor((sec%86400)/3600)}ชม.`;
}

function fmtDt(s) {
  if (!s) return '';
  const d = new Date(s);
  return d.toLocaleDateString('th-TH', { day:'2-digit', month:'short' }) + ' ' +
    d.toLocaleTimeString('th-TH', { hour:'2-digit', minute:'2-digit' });
}

// ── Icon ─────────────────────────────────────────────────────────────────────
const ICON_PATHS = {
  'grid':            <><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></>,
  'trending-up':     <><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></>,
  'clock':           <><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></>,
  'bar-chart':       <><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></>,
  'alert-triangle':  <><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></>,
  'box':             <><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></>,
  'home':            <><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></>,
  'user':            <><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></>,
  'users':           <><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></>,
  'upload':          <><polyline points="16 16 12 12 8 16"/><line x1="12" y1="12" x2="12" y2="21"/><path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/></>,
  'file-text':       <><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></>,
  'building':        <><rect x="4" y="2" width="16" height="20" rx="2" ry="2"/><line x1="9" y1="22" x2="9" y2="12"/><line x1="15" y1="22" x2="15" y2="12"/><path d="M9 7h6M9 12h6"/></>,
  'truck':           <><rect x="1" y="3" width="15" height="13" rx="2"/><path d="M16 8h4l3 5v3h-7V8z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></>,
  'shield':          <><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></>,
  'log-out':         <><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></>,
  'refresh':         <><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></>,
  'search':          <><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></>,
  'arrow-left':      <><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></>,
  'download':        <><polyline points="8 17 12 21 16 17"/><line x1="12" y1="3" x2="12" y2="21"/></>,
  'plus':            <><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></>,
  'x':               <><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></>,
  'lock':            <><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></>,
  'message-square':  <><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></>,
  'send':            <><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></>,
  'paperclip':       <><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></>,
  'check':           <><polyline points="20 6 9 17 4 12"/></>,
  'factory':         <><path d="M2 20a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8l-7 5V8l-7 5V4a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"/></>,
  'hard-hat':        <><path d="M2 18a1 1 0 0 0 1 1h18a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1H3a1 1 0 0 0-1 1v2z"/><path d="M10 10V5a2 2 0 0 1 4 0v5"/><path d="M4 15v-3a8 8 0 0 1 16 0v3"/></>,
  'pie-chart':       <><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></>,
};
function Icon({ name, size = 16, className = '' }) {
  const paths = ICON_PATHS[name];
  if (!paths) return null;
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none"
      stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round"
      className={className} style={{flexShrink:0}}>
      {paths}
    </svg>
  );
}

// ── Spinner ───────────────────────────────────────────────────────────────────
function Spinner({ size = 16 }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor"
      strokeWidth="2.5" strokeLinecap="round"
      style={{animation:'spin .7s linear infinite',flexShrink:0,display:'inline-block'}}>
      <circle cx="12" cy="12" r="10" strokeOpacity=".25"/>
      <path d="M12 2a10 10 0 0 1 10 10"/>
    </svg>
  );
}

// ── Login ─────────────────────────────────────────────────────────────────────
function Login({ onLogin }) {
  const [username, setUsername] = useState('');
  const [password, setPassword] = useState('');
  const [err, setErr] = useState('');
  const [loading, setLoading] = useState(false);

  const submit = async e => {
    e.preventDefault();
    setLoading(true); setErr('');
    const res = await fetch(API + '/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();
    setLoading(false);
    if (data.token) { setToken(data.token); onLogin(data.user); }
    else setErr(data.error || 'Login failed');
  };

  return (
    <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',background:'#f9fafb'}}>
      <div className="card" style={{width:'100%',maxWidth:360,padding:'32px 32px 28px'}}>
        <div style={{textAlign:'center',marginBottom:28}}>
          <div style={{width:36,height:36,background:'#dc2626',borderRadius:8,display:'inline-flex',alignItems:'center',justifyContent:'center',color:'#fff',fontSize:11,fontWeight:700,marginBottom:12}}>SMM</div>
          <h1 style={{fontSize:18,fontWeight:700,color:'#111827',margin:0}}>SMM CRM</h1>
          <p style={{fontSize:13,color:'#6b7280',marginTop:4}}>Sign in to your account</p>
        </div>
        <form onSubmit={submit} style={{display:'flex',flexDirection:'column',gap:16}}>
          <div>
            <label style={{fontSize:12,fontWeight:600,color:'#374151',display:'block',marginBottom:4,textTransform:'none',letterSpacing:'normal'}}>Username</label>
            <input value={username} onChange={e=>setUsername(e.target.value)} required autoFocus placeholder="Enter username"/>
          </div>
          <div>
            <label style={{fontSize:12,fontWeight:600,color:'#374151',display:'block',marginBottom:4,textTransform:'none',letterSpacing:'normal'}}>Password</label>
            <input type="password" value={password} onChange={e=>setPassword(e.target.value)} required placeholder="••••••••"/>
          </div>
          {err && <div style={{color:'#dc2626',fontSize:12,background:'#fef2f2',padding:'8px 12px',borderRadius:6}}>{err}</div>}
          <button type="submit" className="btn btn-primary" style={{width:'100%',justifyContent:'center',padding:'10px'}} disabled={loading}>
            {loading ? <Spinner size={14}/> : 'Sign In'}
          </button>
        </form>
      </div>
    </div>
  );
}

// ── helpers ───────────────────────────────────────────────────────────────────
const isPdf = url => url && (url.toLowerCase().includes('.pdf') || url.toLowerCase().includes('/pdf'));

function TeamBadge({ team, size='sm' }) {
  const color = TEAM_COLORS[team] || '#747474';
  const fs = size === 'xs' ? '10px' : '11px';
  const pad = size === 'xs' ? '1px 5px' : '2px 7px';
  return (
    <span style={{background:color+'18', color, border:`1px solid ${color}40`,
      borderRadius:4, padding:pad, fontSize:fs, fontWeight:700, whiteSpace:'nowrap'}}>
      {TEAM_ICONS[team]||''} {team}
    </span>
  );
}

function LineChart({ data, xKey, yKey, color='var(--primary)' }) {
  if (!data || data.length === 0) return <p style={{color:'var(--text-muted)',fontSize:13}}>ยังไม่มีข้อมูล</p>;
  const max = Math.max(...data.map(d => d[yKey]||0)) || 1;
  const W=560, H=100, pt={top:8,bottom:20,left:28,right:8};
  const cw=W-pt.left-pt.right, ch=H-pt.top-pt.bottom;
  const pts = data.map((d,i)=>({
    x: pt.left + (data.length>1 ? i/(data.length-1)*cw : cw/2),
    y: pt.top + (1-(d[yKey]||0)/max)*ch,
    val:d[yKey], lbl:(d[xKey]||'').slice(5)
  }));
  const path = pts.map((p,i)=>`${i?'L':'M'}${p.x},${p.y}`).join(' ');
  const area = `M${pts[0].x},${pt.top+ch} ${pts.map(p=>`L${p.x},${p.y}`).join(' ')} L${pts[pts.length-1].x},${pt.top+ch}Z`;
  const step = Math.ceil(data.length/8);
  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%',height:100}}>
      <defs>
        <linearGradient id="lg" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={color} stopOpacity=".15"/>
          <stop offset="100%" stopColor={color} stopOpacity="0"/>
        </linearGradient>
      </defs>
      <path d={area} fill="url(#lg)"/>
      <path d={path} fill="none" stroke={color} strokeWidth="2"/>
      {pts.map((p,i)=>(
        <g key={i}>
          <circle cx={p.x} cy={p.y} r={3} fill={color}/>
          {i%step===0 && <text x={p.x} y={H-2} textAnchor="middle" fontSize={8} fill="var(--text-muted)">{p.lbl}</text>}
        </g>
      ))}
    </svg>
  );
}

function StackedBar({ teams, totalInvoices }) {
  if (!totalInvoices)
    return <p style={{color:'var(--text-muted)',fontSize:13}}>ยังไม่มีข้อมูล (ไม่มี invoice ในช่วงที่เลือก)</p>;
  if (!teams || teams.length===0)
    return <p style={{color:'var(--text-muted)',fontSize:13}}>✅ ไม่มี fault case ใน {totalInvoices} invoice ช่วงนี้</p>;
  const total = teams.reduce((s,t)=>s+t.pct,0);
  return (
    <div>
      <div style={{display:'flex',height:36,borderRadius:4,overflow:'hidden',border:'1px solid var(--border)',marginBottom:10}}>
        {teams.map(t=>(
          <div key={t.team} style={{width:t.pct+'%',background:TEAM_COLORS[t.team]||'#747474',
            display:'flex',alignItems:'center',justifyContent:'center',color:'#fff',
            fontSize:10,fontWeight:700,minWidth:t.pct>2?'auto':0}}>
            {t.pct>3?t.pct+'%':''}
          </div>
        ))}
        {(100-total)>0 && <div style={{flex:1,background:'#f3f3f3'}}/>}
      </div>
      <div style={{display:'flex',flexWrap:'wrap',gap:'8px 16px',fontSize:12}}>
        {teams.map(t=>(
          <div key={t.team} style={{display:'flex',alignItems:'center',gap:6}}>
            <div style={{width:10,height:10,borderRadius:2,background:TEAM_COLORS[t.team]||'#747474',flexShrink:0}}/>
            <span><strong>{t.team}</strong>: {t.pct}% ({t.cnt} เคส)</span>
          </div>
        ))}
      </div>
      <p style={{fontSize:11,color:'var(--text-muted)',marginTop:6}}>
        {totalInvoices} invoice ที่ส่งในช่วงนี้ — fault rate: {teams.filter(t=>t.team!=='ยังไม่ระบุ').reduce((s,t)=>s+t.pct,0).toFixed(2)}%
        {teams.find(t=>t.team==='ยังไม่ระบุ') && <> · <span style={{color:'#9e9e9e'}}>pending: {teams.find(t=>t.team==='ยังไม่ระบุ').cnt} เคส</span></>}
      </p>
    </div>
  );
}

function CaseInvoicePanel({ ratio, faultTrend, start, end }) {
  const [debug, setDebug] = useState(null);
  const [loadingDebug, setLoadingDebug] = useState(false);
  const [showDebug, setShowDebug] = useState(false);
  const [filterDebug, setFilterDebug] = useState('all'); // all | included | excluded
  const [hoveredLine, setHoveredLine] = useState(null); // index of hovered line
  const [weeklyData, setWeeklyData]   = useState(null);
  const [weeklyLoading, setWeeklyLoading] = useState(false);
  const [hoveredBar, setHoveredBar]   = useState(null); // index of hovered weekly bar

  // Load weekly trend whenever date range changes
  React.useEffect(() => {
    let cancelled = false;
    const load = async () => {
      setWeeklyLoading(true);
      try {
        const parts = ['group_by=week'];
        if (start) parts.push('start=' + start);
        if (end)   parts.push('end='   + end);
        const d = await api('/api/dashboard/fault-rate-trend?' + parts.join('&'));
        if (!cancelled) setWeeklyData(Array.isArray(d) ? d : []);
      } catch(e) {
        if (!cancelled) setWeeklyData([]);
      } finally {
        if (!cancelled) setWeeklyLoading(false);
      }
    };
    load();
    return () => { cancelled = true; };
  }, [start, end]);

  const loadDebug = async () => {
    if (debug) { setShowDebug(v => !v); return; }
    setLoadingDebug(true);
    const qs = [start && `start=${start}`, end && `end=${end}`].filter(Boolean).join('&');
    const d = await api(`/api/dashboard/case-invoice-debug${qs ? '?'+qs : ''}`);
    setDebug(d);
    setLoadingDebug(false);
    setShowDebug(true);
  };

  if (!ratio || !ratio.total_invoices) return (
    <p style={{color:'var(--text-muted)',fontSize:13,padding:'8px 0'}}>
      ยังไม่มีข้อมูล (ไม่มี invoice ในช่วงที่เลือก — กรุณา Import ERP ก่อน)
    </p>
  );

  const { total_invoices, teams } = ratio;
  // นับทั้งหมด รวม pending (ยังไม่ระบุ fault team)
  const totalFaults = (teams||[]).reduce((s,t)=>s+t.cnt, 0);
  const pendingCnt = ((teams||[]).find(t=>t.team==='ยังไม่ระบุ')||{}).cnt || 0;
  const overallRate = total_invoices ? (totalFaults/total_invoices*100).toFixed(2) : 0;
  const maxPct = Math.max(...(teams||[]).map(t=>t.pct), 0.1);

  const hasT = faultTrend && faultTrend.length > 1;

  // collect teams from trend data
  const trendTeams = hasT ? [...new Set(faultTrend.flatMap(d=>Object.keys(d.by_team||{})))]
                              .filter(t=>t!=='ยังไม่ระบุ') : [];
  const LINE_COLORS = {
    'CX':'#3b82f6','Sales/KAM':'#10b981','Sales Co':'#f59e0b',
    'Merchandise':'#8b5cf6','Inbound':'#ec4899','Outbound':'#ef4444','Customer':'#6b7280'
  };
  const TOTAL_COLOR = '#111827';

  return (
    <div style={{display:'flex',flexDirection:'column',gap:20}}>
      {/* KPI row */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:12}}>
        {[
          {label:'Invoice ที่ส่งในช่วงนี้', value: total_invoices.toLocaleString(), color:'#111827'},
          {label:'Fault Cases (Claim+Complain)', value: totalFaults, color:'#dc2626'},
          {label:'Fault Rate รวม', value: overallRate+'%', color: overallRate>5?'#dc2626':overallRate>2?'#f59e0b':'#10b981'},
        ].map(({label,value,color})=>(
          <div key={label} className="card" style={{padding:'14px 16px'}}>
            <div style={{fontSize:22,fontWeight:700,color}}>{value}</div>
            <div style={{fontSize:11,color:'var(--text-muted)',marginTop:2}}>{label}</div>
          </div>
        ))}
      </div>
      {pendingCnt > 0 && (
        <div style={{fontSize:12,color:'#9ca3af',background:'#f9fafb',border:'1px solid #e5e7eb',borderRadius:6,padding:'6px 12px'}}>
          ⏳ รวม <strong>{pendingCnt} เคส</strong> ที่ยังรอระบุ fault team (แถบสีเทา)
        </div>
      )}

      {/* Multi-line Trend Chart */}
      {hasT ? (() => {
        const W=1000, H=260, pad={t:16,b:32,l:42,r:16};
        const cw=W-pad.l-pad.r, ch=H-pad.t-pad.b;
        const n = faultTrend.length;
        const allRates = [
          ...faultTrend.map(d=>d.rate),
          ...trendTeams.flatMap(team=>faultTrend.map(d=>(d.by_team?.[team]?.rate)||0))
        ];
        const maxR = Math.max(...allRates, 0.5);
        const xOf = i => pad.l + (n>1 ? i/(n-1)*cw : cw/2);
        const yOf = r => pad.t + ch - (r/maxR)*ch;
        const step = Math.max(1, Math.ceil(n/10));
        const labelStep = Math.max(1, Math.ceil(n/6));

        const makeLine = (getRates, color, strokeW, dashed=false) => {
          const pts = faultTrend.map((d,i)=>({x:xOf(i), y:yOf(getRates(d,i)), r:getRates(d,i)}));
          const pathD = pts.map((p,i)=>(i===0?`M${p.x.toFixed(1)},${p.y.toFixed(1)}`:`L${p.x.toFixed(1)},${p.y.toFixed(1)}`)).join(' ');
          return { pts, pathD, color, strokeW, dashed };
        };

        const lines = [
          makeLine(d=>d.rate, TOTAL_COLOR, 2.5),
          ...trendTeams.map(team=>makeLine(d=>(d.by_team?.[team]?.rate)||0, LINE_COLORS[team]||'#94a3b8', 1.5))
        ];

        // y-axis labels
        const yTicks = [0, 25, 50, 75, 100].map(p=>({pct:p, y:yOf(maxR*p/100), val:(maxR*p/100).toFixed(1)+'%'}));

        const isHovering = hoveredLine !== null;
        return (
          <div className="card" style={{padding:'16px 20px'}}>
            <div style={{fontSize:13,fontWeight:600,color:'var(--text)',marginBottom:12}}>Fault Rate Trend</div>
            <svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%',height:'auto',display:'block',cursor:'crosshair'}}
              onMouseLeave={()=>setHoveredLine(null)}>
              {/* grid */}
              {yTicks.map(t=>(
                <g key={t.pct}>
                  <line x1={pad.l} y1={t.y} x2={W-pad.r} y2={t.y} stroke="#f3f4f6" strokeWidth="1"/>
                  <text x={pad.l-4} y={t.y+4} textAnchor="end" fontSize={8} fill="#9ca3af">{t.val}</text>
                </g>
              ))}
              {/* x-axis labels */}
              {faultTrend.map((d,i)=>i%labelStep===0&&(
                <text key={i} x={xOf(i)} y={H-4} textAnchor="middle" fontSize={8} fill="#9ca3af">
                  {String(d.date).slice(5)}
                </text>
              ))}
              {/* Pass 1: hit areas + paths */}
              {[...lines].reverse().map((ln, rli)=>{
                const li = lines.length - 1 - rli;
                const isHovered = hoveredLine === li;
                const isFaded = isHovering && !isHovered;
                return (
                  <g key={li} style={{cursor:'pointer'}} onMouseEnter={()=>setHoveredLine(li)}>
                    <path d={ln.pathD} fill="none" stroke="transparent" strokeWidth={12}/>
                    <path d={ln.pathD} fill="none" stroke={ln.color}
                      strokeWidth={isHovered ? ln.strokeW+1.5 : ln.strokeW}
                      opacity={isFaded ? 0.12 : 1}
                      style={{transition:'opacity .2s'}}/>
                  </g>
                );
              })}
              {/* Pass 2: circles */}
              {[...lines].reverse().map((ln, rli)=>{
                const li = lines.length - 1 - rli;
                const isHovered = hoveredLine === li;
                const isFaded = isHovering && !isHovered;
                return (
                  <g key={li} style={{cursor:'pointer'}} onMouseEnter={()=>setHoveredLine(li)}>
                    {ln.pts.map((p,i)=>(
                      <circle key={i} cx={p.x} cy={p.y}
                        r={isHovered?(li===0?4.5:3.5):(li===0?3:2)}
                        fill={ln.color} opacity={isFaded?0.12:1}
                        style={{transition:'opacity .2s'}}/>
                    ))}
                  </g>
                );
              })}
              {/* Pass 3: labels — always on top, white halo via stroke */}
              {lines.map((ln, li)=>{
                const isHovered = hoveredLine === li;
                const isFaded = isHovering && !isHovered;
                const showLabels = !isHovering || isHovered;
                if (!showLabels) return null;
                return (
                  <g key={li}>
                    {ln.pts.map((p,i)=> p.r > 0 ? (
                      <text key={i} x={p.x} y={p.y-8} textAnchor="middle"
                        fontSize={isHovered?8:7} fontWeight={li===0||isHovered?'700':'400'}
                        fill={ln.color} opacity={isFaded?0:1}
                        stroke="white" strokeWidth="3" paintOrder="stroke"
                        style={{transition:'opacity .15s'}}>
                        {p.r.toFixed(1)}%
                      </text>
                    ) : null)}
                  </g>
                );
              })}
            </svg>
            {/* Legend — hover to highlight */}
            <div style={{display:'flex',flexWrap:'wrap',gap:'6px 14px',marginTop:10}}>
              {lines.map((ln,li)=>(
                <div key={li} style={{display:'flex',alignItems:'center',gap:5,cursor:'pointer',
                  opacity: isHovering&&hoveredLine!==li ? 0.3 : 1, transition:'opacity .2s'}}
                  onMouseEnter={()=>setHoveredLine(li)}
                  onMouseLeave={()=>setHoveredLine(null)}>
                  <div style={{width: li===0?22:16, height: li===0?3:2, background:ln.color, borderRadius:2}}/>
                  <span style={{fontSize:11,color:li===0?'var(--text)':'var(--text-muted)',fontWeight:li===0?600:400}}>
                    {li===0 ? 'รวมทุกทีม' : trendTeams[li-1]}
                  </span>
                </div>
              ))}
            </div>
          </div>
        );
      })() : (
        <div style={{fontSize:12,color:'var(--text-muted)'}}>ไม่มีข้อมูล trend (ต้องมีข้อมูลอย่างน้อย 2 วัน)</div>
      )}

      {/* Weekly Stacked Bar Chart */}
      {weeklyLoading ? (
        <div className="card" style={{padding:'16px 20px',display:'flex',alignItems:'center',gap:8}}>
          <Spinner size={14}/> <span style={{fontSize:12,color:'var(--text-muted)'}}>กำลังโหลด weekly trend...</span>
        </div>
      ) : weeklyData && weeklyData.length > 0 ? (() => {
        const W=1000, H=300, pad={t:28,b:52,l:48,r:20};
        const cw=W-pad.l-pad.r, ch=H-pad.t-pad.b;
        const n = weeklyData.length;
        const maxRate = Math.max(...weeklyData.map(w=>w.rate), 1);
        const barSlot = cw / n;
        const barW = Math.min(barSlot * 0.72, 90);
        const xOf = i => pad.l + (i + 0.5) * barSlot;
        const yOf = r => pad.t + ch - (r / maxRate) * ch;

        const TEAM_ORDER = ['CX','Sales/KAM','Sales Co','Merchandise','Inbound','Outbound','Customer','ยังไม่ระบุ'];
        const allTeams = TEAM_ORDER.filter(t =>
          weeklyData.some(w => (w.by_team?.[t]?.rate||0) > 0)
        );

        const weekLabel = (dateStr) => {
          if (!dateStr) return '';
          const d = new Date(dateStr + 'T00:00:00');
          const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
          return `${months[d.getMonth()]} W${Math.ceil(d.getDate()/7)}`;
        };

        const rawStep = maxRate / 4;
        const niceStep = rawStep <= 1 ? 1 : rawStep <= 2.5 ? 2.5 : rawStep <= 5 ? 5 : Math.ceil(rawStep/5)*5;
        const yTicks = [];
        for (let v = 0; v <= maxRate * 1.15; v += niceStep) yTicks.push(parseFloat(v.toFixed(2)));

        return (
          <div className="card" style={{padding:'16px 20px'}}>
            <div style={{fontSize:13,fontWeight:600,color:'var(--text)',marginBottom:2}}>Fault Rate รายสัปดาห์ (แยกตามทีม)</div>
            <div style={{fontSize:11,color:'var(--text-muted)',marginBottom:12}}>1 แท่ง = 1 สัปดาห์ (อา–ส) · hover ที่แท่งเพื่อดูสัดส่วนแต่ละทีม</div>
            <svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%',height:'auto',display:'block',cursor:'default'}}
              onMouseLeave={()=>setHoveredBar(null)}>

              {/* grid lines + y-axis labels */}
              {yTicks.map(v => {
                const y = yOf(v);
                if (y < pad.t - 2 || y > pad.t + ch + 2) return null;
                return (
                  <g key={v}>
                    <line x1={pad.l} y1={y} x2={W-pad.r} y2={y} stroke="#f3f4f6" strokeWidth="1"/>
                    <text x={pad.l-5} y={y+4} textAnchor="end" fontSize={9} fill="#9ca3af">{v}%</text>
                  </g>
                );
              })}

              {/* bars */}
              {weeklyData.map((w, i) => {
                const x = xOf(i);
                let stackY = yOf(0);
                const segments = [];
                allTeams.forEach(team => {
                  const data = w.by_team?.[team];
                  if (!data || data.rate <= 0) return;
                  const segH = (data.rate / maxRate) * ch;
                  stackY -= segH;
                  segments.push({ team, rate: data.rate, faults: data.faults, y: stackY, h: segH });
                });
                const isHovered = hoveredBar === i;

                return (
                  <g key={i} onMouseEnter={()=>setHoveredBar(i)} style={{cursor:'pointer'}}>
                    {/* background track */}
                    <rect x={x-barW/2} y={pad.t} width={barW} height={ch} fill="#f9fafb" rx="3"/>
                    {/* stacked team segments */}
                    {segments.map((s, si) => (
                      <rect key={si} x={x-barW/2} y={s.y} width={barW} height={s.h}
                        fill={LINE_COLORS[s.team]||'#9ca3af'}
                        opacity={isHovered ? 1 : 0.82}
                        rx={si===segments.length-1 ? 3 : 0}/>
                    ))}
                    {/* total % label above bar */}
                    {w.rate > 0 && (
                      <text x={x} y={yOf(w.rate)-5} textAnchor="middle" fontSize={10} fontWeight="700"
                        fill="#111827" stroke="white" strokeWidth="2.5" paintOrder="stroke">
                        {w.rate.toFixed(1)}%
                      </text>
                    )}
                    {/* x-label: week */}
                    <text x={x} y={H-32} textAnchor="middle" fontSize={9}
                      fill={isHovered?'#111827':'#6b7280'} fontWeight={isHovered?'700':'400'}>
                      {weekLabel(w.date)}
                    </text>
                    {/* x-label: invoice count */}
                    <text x={x} y={H-18} textAnchor="middle" fontSize={8} fill="#9ca3af">
                      {w.invoices} inv
                    </text>
                  </g>
                );
              })}

              {/* SVG Tooltip */}
              {hoveredBar !== null && (() => {
                const w = weeklyData[hoveredBar];
                const bx = xOf(hoveredBar);
                const teams = allTeams
                  .filter(t => (w.by_team?.[t]?.rate||0) > 0)
                  .map(t => ({ team: t, ...w.by_team[t] }));
                const TW = 195, lineH = 18;
                const TH = 26 + teams.length * lineH + 8;
                const tx = Math.max(pad.l+2, Math.min(bx - TW/2, W - pad.r - TW));
                const ty = Math.max(pad.t+4, yOf(w.rate) - TH - 12);
                return (
                  <g style={{pointerEvents:'none'}}>
                    {/* shadow rect */}
                    <rect x={tx-1} y={ty-1} width={TW+2} height={TH+2} rx={6} fill="#0001"/>
                    <rect x={tx} y={ty} width={TW} height={TH} rx={6} fill="white" stroke="#e5e7eb" strokeWidth="1"/>
                    {/* header */}
                    <text x={tx+10} y={ty+16} fontSize={10} fontWeight="700" fill="#111827">
                      {weekLabel(w.date)} · รวม {w.rate.toFixed(1)}% ({w.faults}/{w.invoices})
                    </text>
                    {/* divider */}
                    <line x1={tx+6} y1={ty+22} x2={tx+TW-6} y2={ty+22} stroke="#e5e7eb" strokeWidth="0.5"/>
                    {/* per-team rows */}
                    {teams.map((t, ti) => (
                      <g key={t.team}>
                        <rect x={tx+10} y={ty+28+ti*lineH} width={10} height={10} rx={2}
                          fill={LINE_COLORS[t.team]||'#9ca3af'}/>
                        <text x={tx+26} y={ty+37+ti*lineH} fontSize={9} fill="#374151">
                          {t.team}:
                        </text>
                        <text x={tx+TW-10} y={ty+37+ti*lineH} textAnchor="end" fontSize={9} fontWeight="600" fill="#111827">
                          {t.rate.toFixed(1)}% · {t.faults} เคส
                        </text>
                      </g>
                    ))}
                  </g>
                );
              })()}
            </svg>
            {/* Legend */}
            <div style={{display:'flex',flexWrap:'wrap',gap:'6px 16px',marginTop:10}}>
              {allTeams.map(team => (
                <div key={team} style={{display:'flex',alignItems:'center',gap:5}}>
                  <div style={{width:12,height:12,background:LINE_COLORS[team]||'#9ca3af',borderRadius:2}}/>
                  <span style={{fontSize:11,color:'var(--text-muted)'}}>{team}</span>
                </div>
              ))}
            </div>
          </div>
        );
      })() : weeklyData && weeklyData.length === 0 ? (
        <div style={{fontSize:12,color:'var(--text-muted)',padding:'4px 0'}}>ไม่มีข้อมูล weekly trend ในช่วงที่เลือก</div>
      ) : null}

      {/* Per-team bars — รวม ยังไม่ระบุ (สีเทา) */}
      {(teams||[]).length > 0 && (
        <div className="card" style={{padding:'14px 16px'}}>
          <div style={{fontSize:12,fontWeight:600,color:'var(--text)',marginBottom:12}}>Fault Rate แยกตาม Team</div>
          <div style={{display:'flex',flexDirection:'column',gap:10}}>
            {(teams||[]).map(t=>{
              const isPending = t.team === 'ยังไม่ระบุ';
              const barColor = isPending ? '#9ca3af' : (TEAM_COLORS[t.team]||'#6b7280');
              const labelColor = isPending ? '#9ca3af' : 'var(--text)';
              return (
                <div key={t.team} style={{display:'flex',alignItems:'center',gap:10}}>
                  <div style={{width:100,fontSize:12,color:labelColor,flexShrink:0,fontWeight:500,fontStyle:isPending?'italic':'normal'}}>
                    {isPending ? '(ยังไม่ระบุ)' : t.team}
                  </div>
                  <div style={{flex:1,height:18,background:'#f3f4f6',borderRadius:4,overflow:'hidden'}}>
                    <div style={{width:(t.pct/maxPct*100)+'%',height:'100%',background:barColor,borderRadius:4,transition:'width .4s'}}/>
                  </div>
                  <div style={{width:80,fontSize:12,color:'var(--text-muted)',flexShrink:0,textAlign:'right'}}>
                    {t.pct}% · {t.cnt} เคส
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      )}

      {/* Debug: ทำไมเคสถึงไม่ขึ้น */}
      <div className="card" style={{padding:'14px 16px'}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom: showDebug ? 12 : 0}}>
          <div style={{fontSize:12,fontWeight:600,color:'var(--text)'}}>🔍 วิเคราะห์เคสทั้งหมด — ทำไมถึงนับ/ไม่นับใน Case/Invoice %</div>

function FilePreview({ url, className = '' }) {
  if (!url) return null;
  if (isPdf(url)) {
    return (
      <a href={url} target="_blank" rel="noopener noreferrer"
        className={`inline-flex items-center gap-2 px-3 py-2 bg-red-50 border border-red-200 rounded-lg text-red-700 text-sm hover:bg-red-100 ${className}`}>
        <Icon name="file-text" size={14}/> ดู PDF
      </a>
    );
  }
  return <img src={url} alt="attachment" className={`rounded-lg border border-gray-200 cursor-pointer ${className}`}
    onClick={()=>window.open(url,'_blank')}/>;
}

// ── helpers: multi-image serialize / parse ────────────────────────────────────
const serializeImages = (urls) => {
  if (!urls || urls.length === 0) return '';
  if (urls.length === 1) return urls[0];
  return JSON.stringify(urls);
};
const parseImageUrls = (raw) => {
  if (!raw) return [];
  try { const p = JSON.parse(raw); return Array.isArray(p) ? p : [raw]; }
  catch { return [raw]; }
};

// ── ImageUploader (supports multiple files) ───────────────────────────────────
// Multi-file mode:  <ImageUploader urls={arr} onAdd={fn} onRemove={fn}/>
// Single-file mode: <ImageUploader onUploaded={fn}/> (backward-compat)
function ImageUploader({ urls = [], onAdd, onRemove, onUploaded }) {
  const isSingle = !!onUploaded;
  const [uploading, setUploading] = useState(false);
  const [err, setErr] = useState('');
  const ref = useRef();

  const handle = async e => {
    const files = Array.from(e.target.files);
    if (!files.length) return;
    setUploading(true); setErr('');
    try {
      for (const file of files) {
        const fd = new FormData();
        fd.append('file', file);
        const res = await apiUpload('/api/upload/image', fd);
        if (res && res.url) { isSingle ? onUploaded(res.url) : onAdd(res.url); }
        else setErr(res?.error || 'Upload failed');
      }
    } catch(ex) {
      setErr('Network error: ' + ex.message);
    } finally {
      setUploading(false);
      if (ref.current) ref.current.value = '';
    }
  };

  return (
    <div className="flex flex-col gap-2">
      {!isSingle && urls.length > 0 && (
        <div className="flex flex-wrap gap-2">
          {urls.map((url, i) => (
            <div key={i} style={{position:'relative',display:'inline-block'}}>
              <FilePreview url={url} className="w-16 h-16 object-cover"/>
              <button type="button" onClick={()=>onRemove(i)}
                style={{position:'absolute',top:-6,right:-6,width:18,height:18,
                  background:'#ef4444',color:'#fff',border:'none',borderRadius:'50%',
                  cursor:'pointer',fontSize:14,fontWeight:700,display:'flex',
                  alignItems:'center',justifyContent:'center',lineHeight:1,padding:0}}>
                ×
              </button>
            </div>
          ))}
        </div>
      )}
      <label className="flex items-center gap-2 cursor-pointer text-sm text-gray-500 hover:text-gray-700">
        {uploading ? <Spinner size={13}/> : <Icon name="paperclip" size={14}/>}
        <span>{uploading ? 'Uploading...' : 'Attach file'}</span>
        <input ref={ref} type="file" accept="image/*,application/pdf"
          multiple={!isSingle} className="hidden" onChange={handle} style={{display:'none'}}/>
      </label>
      {err && <p className="text-xs text-red-500">{err}</p>}
    </div>
  );
}

// ── DateRangeFilter ───────────────────────────────────────────────────────────
function DateRangeFilter({ value, onChange }) {
  const today = new Date().toISOString().slice(0, 10);
  const d7 = new Date(Date.now() - 6*86400000).toISOString().slice(0, 10);
  const d30 = new Date(Date.now() - 29*86400000).toISOString().slice(0, 10);
  return (
    <div style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap',marginBottom:20}}>
      <span style={{fontSize:12,color:'var(--text-muted)',flexShrink:0}}>Date range:</span>
      <input type="date" value={value.start}
        onChange={e=>{ if(e.target.value.length===10) onChange({...value,start:e.target.value}); }}
        style={{width:140,fontSize:13}}/>
      <span style={{color:'var(--text-muted)',fontSize:12}}>—</span>
      <input type="date" value={value.end}
        onChange={e=>{ if(e.target.value.length===10) onChange({...value,end:e.target.value}); }}
        style={{width:140,fontSize:13}}/>
      {[{l:'7 วัน',s:d7},{l:'30 วัน',s:d30}].map(({l,s})=>(
        <button type="button" key={l} onClick={()=>onChange({start:s,end:today})}
          style={{fontSize:12,padding:'4px 10px',border:'1px solid var(--border)',borderRadius:4,
            background:'#fff',cursor:'pointer',color:'var(--text)'}}>{l}</button>
      ))}
      <button type="button" onClick={()=>onChange({start:'',end:''})}
        style={{fontSize:12,color:'var(--text-muted)',background:'none',border:'none',cursor:'pointer'}}>All time</button>
    </div>
  );
}

// ── BarChart ──────────────────────────────────────────────────────────────────
function BarChart({ data, labelKey, valueKey, color='var(--primary)' }) {
  if (!data || data.length === 0) return <p className="text-gray-400 text-sm">No data yet</p>;
  const max = Math.max(...data.map(d => d[valueKey] || 0)) || 1;
  return (
    <div className="space-y-2">
      {data.map((d, i) => {
        const pct = Math.round((d[valueKey]||0) / max * 100);
        return (
          <div key={i} className="flex items-center gap-3">
            <div className="w-32 text-sm text-gray-600 truncate shrink-0">{d[labelKey] || '—'}</div>
            <div className="flex-1 h-4 bg-gray-100 rounded-full overflow-hidden">
              <div className="h-full rounded-full" style={{width:pct+'%', background:color}}/>
            </div>
            <div className="text-sm text-gray-600 w-8 text-right shrink-0">{d[valueKey]||0}</div>
          </div>
        );
      })}
    </div>
  );
}
