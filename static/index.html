// ── Employees ─────────────────────────────────────────────────────────────────
function Employees() {
  const EMPTY = { name:'', employee_code:'', department:'', team:'CX', role:'', phone:'', email:'', status:'active' };
  const [data, setData] = useState([]);
  const [loading, setLoading] = useState(true);
  const [form, setForm] = useState(EMPTY);
  const [editId, setEditId] = useState(null);
  const [saving, setSaving] = useState(false);
  const [msg, setMsg] = useState('');

  const load = () => {
    setLoading(true);
    api('/api/employees').then(d => { setData(d || []); setLoading(false); });
  };
  useEffect(() => { load(); }, []);

  const set = (k, v) => setForm(f => ({ ...f, [k]: v }));

  const save = async e => {
    e.preventDefault();
    if (!form.name.trim()) return setMsg('กรุณาใส่ชื่อ');
    setSaving(true); setMsg('');
    const method = editId ? 'PUT' : 'POST';
    const path = editId ? `/api/employees/${editId}` : '/api/employees';
    const res = await api(path, { method, body: JSON.stringify(form) });
    setSaving(false);
    if (res && (res.id || res.ok)) { setForm(EMPTY); setEditId(null); load(); }
    else setMsg(res?.error || 'เกิดข้อผิดพลาด');
  };

  const startEdit = emp => {
    setEditId(emp.id);
    setForm({ name: emp.name||'', employee_code: emp.employee_code||'', department: emp.department||'',
      team: emp.team||'CX', role: emp.role||'', phone: emp.phone||'', email: emp.email||'', status: emp.status||'active' });
  };

  const deleteEmp = async (emp) => {
    if (!window.confirm(`ลบพนักงาน "${emp.name}" ออกจากระบบ?\nประวัติ fault attribution จะยังคงอยู่ แต่ชื่อพนักงานจะหลุดออก`)) return;
    const res = await api(`/api/employees/${emp.id}`, { method: 'DELETE' });
    if (res && res.ok) { load(); setMsg(''); }
    else setMsg('ลบไม่สำเร็จ: ' + (res?.error || 'Unknown error'));
  };

  return (
    <div className="p-6 max-w-4xl">
      <h2 className="text-xl font-bold mb-5" style={{color:'var(--primary)'}}>👷 Employees</h2>

      <div className="card p-5 mb-5">
        <h3 className="font-semibold text-gray-700 mb-3">{editId ? '✏️ Edit Employee' : '➕ Add Employee'}</h3>
        <form onSubmit={save} className="grid grid-cols-2 gap-3">
          <div>
            <label className="text-sm font-medium text-gray-700 block mb-1">Name *</label>
            <input value={form.name} onChange={e=>set('name',e.target.value)} required placeholder="ชื่อ-นามสกุล"/>
          </div>
          <div>
            <label className="text-sm font-medium text-gray-700 block mb-1">Employee Code</label>
            <input value={form.employee_code} onChange={e=>set('employee_code',e.target.value)} placeholder="รหัสพนักงาน"/>
          </div>
          <div>
            <label className="text-sm font-medium text-gray-700 block mb-1">Team *</label>
            <select value={form.team} onChange={e=>set('team',e.target.value)}>
              {TEAMS.map(t=><option key={t} value={t}>{t}</option>)}
            </select>
          </div>
          <div>
            <label className="text-sm font-medium text-gray-700 block mb-1">Position / Role</label>
            <input value={form.role} onChange={e=>set('role',e.target.value)} placeholder="เช่น Supervisor, Staff"/>
          </div>
          <div>
            <label className="text-sm font-medium text-gray-700 block mb-1">Department</label>
            <input value={form.department} onChange={e=>set('department',e.target.value)} placeholder="แผนก"/>
          </div>
          <div>
            <label className="text-sm font-medium text-gray-700 block mb-1">Phone</label>
            <input value={form.phone} onChange={e=>set('phone',e.target.value)} placeholder="เบอร์โทร"/>
          </div>
          <div>
            <label className="text-sm font-medium text-gray-700 block mb-1">Email</label>
            <input type="email" value={form.email} onChange={e=>set('email',e.target.value)} placeholder="email@example.com"/>
          </div>
          <div>
            <label className="text-sm font-medium text-gray-700 block mb-1">Status</label>
            <select value={form.status} onChange={e=>set('status',e.target.value)}>
              <option value="active">Active</option>
              <option value="inactive">Inactive</option>
            </select>
          </div>
          {msg && <div className="col-span-2 text-red-600 text-sm">{msg}</div>}
          <div className="col-span-2 flex gap-2">
            <button type="submit" className="btn btn-primary" disabled={saving}>{saving?<Spinner/>:(editId?'Save changes':'Add Employee')}</button>
            {editId && <button type="button" className="btn btn-secondary" onClick={()=>{setEditId(null);setForm(EMPTY);}}>Cancel</button>}
          </div>
        </form>
      </div>

      {loading ? <Spinner/> : (
        <div className="card overflow-hidden">
          <table className="w-full text-sm">
            <thead className="bg-gray-50 text-gray-600 text-left">
              <tr>
                <th className="p-3">Name</th>
                <th className="p-3">Team</th>
                <th className="p-3">Position</th>
                <th className="p-3">Phone</th>
                <th className="p-3">Status</th>
                <th className="p-3"></th>
              </tr>
            </thead>
            <tbody>
              {data.length === 0
                ? <tr><td colSpan={6} className="p-6 text-center text-gray-400">No employees yet</td></tr>
                : data.map(emp => (
                <tr key={emp.id} className="border-t hover:bg-gray-50">
                  <td className="p-3 font-medium">{emp.name}</td>
                  <td className="p-3">{TEAM_ICONS[emp.team]||''} {emp.team}</td>
                  <td className="p-3 text-gray-500">{emp.role||'-'}</td>
                  <td className="p-3 text-gray-500">{emp.phone||'-'}</td>
                  <td className="p-3">
                    <span className={`px-2 py-0.5 rounded-full text-xs ${emp.status==='active'?'bg-green-100 text-green-700':'bg-gray-100 text-gray-500'}`}>
                      {emp.status}
                    </span>
                  </td>
                  <td className="p-3">
                    <div className="flex gap-2">
                      <button className="btn btn-secondary text-xs" onClick={()=>startEdit(emp)}>Edit</button>
                      <button className="btn text-xs" style={{background:'#fef2f2',color:'#dc2626',border:'1px solid #fca5a5'}}
                        onClick={()=>deleteEmp(emp)}>ลบ</button>
                    </div>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

// ── App ───────────────────────────────────────────────────────────────────────
function App() {
  const [user, setUser] = useState(null);
  const [checking, setChecking] = useState(true);
  const [page, setPage] = useState('tickets');
  const [selectedTicket, setSelectedTicket] = useState(null);
  const [creating, setCreating] = useState(false);

  useEffect(() => {
    const token = getToken();
    if (!token) { setChecking(false); return; }
    api('/api/auth/me').then(d => {
      if (d && d.id) setUser(d);
      else clearToken();
      setChecking(false);
    }).catch(() => { clearToken(); setChecking(false); });
  }, []);

  const logout = () => { clearToken(); setUser(null); setPage('tickets'); };

  if (checking) return <div className="min-h-screen flex items-center justify-center text-gray-400"><Spinner/></div>;
  if (!user) return <Login onLogin={u => setUser(u)}/>;

  const navItems = [
    { id:'dashboard', label:'Dashboard', icon:'grid' },
    { id:'tickets', label:'Cases', icon:'file-text' },
    { id:'accounts', label:'Account', icon:'building' },
    { id:'suppliers', label:'Supplier', icon:'factory' },
    { id:'employees', label:'Employees', icon:'hard-hat' },
    { id:'import', label:'Import ERP', icon:'upload' },
    ...(user.role === 'admin' ? [{ id:'users', label:'Users', icon:'users' }] : []),
  ];

  const renderPage = () => {
    if (selectedTicket) return <TicketDetail ticketId={selectedTicket} user={user} onBack={()=>setSelectedTicket(null)}/>;
    if (creating) return <CreateTicket user={user} onCreated={id=>{ setCreating(false); setSelectedTicket(id); }}/>;
    switch(page) {
      case 'dashboard': return <Dashboard/>;
      case 'tickets': return <TicketList user={user} onSelect={id=>setSelectedTicket(id)}/>;
      case 'accounts': return <Accounts onSelectTicket={id=>setSelectedTicket(id)}/>;
      case 'suppliers': return <SimpleList title="🏭 Supplier" endpoint="/api/suppliers" columns={[{key:'name',label:'Name'},{key:'supplier_type',label:'Type'},{key:'contact_person',label:'Contact'},{key:'phone',label:'Phone'}]}/>;
      case 'employees': return <Employees/>;
      case 'import': return <ImportERP/>;
      case 'users': return <Users currentUser={user}/>;
      default: return <TicketList user={user} onSelect={id=>setSelectedTicket(id)}/>;
    }
  };

  return (
    <div style={{display:'flex',height:'100vh',overflow:'hidden'}}>
      {/* Sidebar */}
      <div className="sidebar">
        <div className="sidebar-brand">
          <div className="sidebar-logo">SMM</div>
          <div>
            <div className="sidebar-title">SMM CRM</div>
            <div className="sidebar-subtitle">Sales Operations</div>
          </div>
        </div>

        <div className="sidebar-nav">
          <div className="sidebar-section-label">Navigation</div>
          {navItems.map(n => (
            <button key={n.id} className={'nav-btn'+(page===n.id&&!selectedTicket&&!creating?' active':'')}
              onClick={()=>{ setPage(n.id); setSelectedTicket(null); setCreating(false); }}>
              <Icon name={n.icon} size={15}/>
              {n.label}
            </button>
          ))}
          <div className="sidebar-section-label" style={{marginTop:8}}>Actions</div>
          <button className="nav-btn" onClick={()=>{ setCreating(true); setSelectedTicket(null); setPage('tickets'); }}>
            <Icon name="plus" size={15}/>
            New Case
          </button>
        </div>

        <div className="sidebar-footer">
          <div className="sidebar-avatar">
            {user.display_name ? user.display_name.substring(0,2).toUpperCase() : (user.username||'U').substring(0,2).toUpperCase()}
          </div>
          <div style={{flex:1,minWidth:0}}>
            <div className="sidebar-user-name">{user.display_name || user.username}</div>
            <div className="sidebar-user-role">{user.role} {user.team ? '· '+user.team : ''}</div>
          </div>
          <button className="sidebar-logout-btn" onClick={logout} title="Sign out">
            <Icon name="log-out" size={14}/>
          </button>
        </div>
      </div>

      {/* Main */}
      <div style={{flex:1,overflow:'auto',background:'#f9fafb'}}>
        {renderPage()}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
